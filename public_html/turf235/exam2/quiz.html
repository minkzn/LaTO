less susceptible to:","correct":"gaseous losses","options":["gaseous losses","microbial breakdown","root uptake","mowing removal"],"feedback":"Volatilization.","source":"M19.6: Nitrogen","kind":"module"},{"id":"e2r007","module":"M12","question":"Dollar spot resistance plus greater Pythium blight susceptibility are both linked to:","correct":"fungal endophytes","options":["fungal endophytes","rhizomatous growth","high N fertility","low mowing heights"],"feedback":"Endophytes trade one disease for another.","source":"M12 module quiz (reworked)","kind":"module"},{"id":"e2r008","module":"M19","question":"Microbial tie-up of available N in organic forms is called:","correct":"immobilization","options":["immobilization","mineralization","nitrification","volatilization"],"feedback":"The reverse of mineralization.","source":"M19 module quiz (reworked)","kind":"module"},{"id":"e2r009","module":"M17","question":"Percolation is ___ in coarser-textured soils.","correct":"faster","options":["faster","slower"],"feedback":"Larger pores.","source":"M17 module quiz (reworked)","kind":"module"},{"id":"e2r010","module":"M12","question":"Turfgrass breeders are actively attempting to incorporate fungal endophytes into which other turfgrass species?","correct":"the bentgrasses and bluegrasses","options":["the bentgrasses and bluegrasses","the ryegrasses and fescues","zoysiagrass and bermudagrass","St. Augustinegrass and centipedegrass"],"feedback":"Breeders are attempting to incorporate fungal endophytes into bentgrasses and bluegrasses, which don't currently have them.","source":"M12.3: Endophytes","kind":"module"},{"id":"e2r011","module":"M11","question":"Which fescue has rolled vernation?","correct":"tall fescue","options":["tall fescue","Chewings fescue","creeping red fescue","hard fescue"],"feedback":"The fine fescues are folded.","source":"M11 module quiz (reworked)","kind":"module","tag":"grass-id"},{"id":"e2r012","module":"M11","question":"A droughty, acid, infertile site in light shade is best suited to:","correct":"red fescue","options":["red fescue","tall fescue","perennial ryegrass","Kentucky bluegrass"],"feedback":"The fine fescues tolerate dry shade and low fertility.","source":"M11 module quiz (reworked)","kind":"module"},{"id":"e2r013","module":"M19","question":"N, P, and K deficiencies show first in older leaves because these nutrients are:","correct":"mobile","options":["mobile","immobile","insoluble","volatile"],"feedback":"Mobile nutrients move from old to new growth.","source":"M19 module quiz (reworked)","kind":"module"},{"id":"e2r014","module":"M19","question":"Nitrogen is released from IBDU mainly by:","correct":"hydrolysis","options":["hydrolysis","microbial degradation","coating rupture","volatilization"],"feedback":"UF and natural organics rely on microbes.","source":"M19.4: Nitrogen Carriers","kind":"module"},{"id":"e2r015","module":"M18","question":"Confining traffic to walkways and paths is called:","correct":"concentration","options":["concentration","dilution","compaction","intensification"],"feedback":"Dilution spreads it out.","source":"M18 module quiz (reworked)","kind":"module"},{"id":"e2r016","module":"M20","question":"Double and triple row designs:","correct":"extend uniform coverage sideways","options":["extend uniform coverage sideways","reduce coverage uniformity","remove the need for overlap","work only on putting greens"],"feedback":"Greater control of moisture.","source":"M20.9: Irrigation System Design","kind":"module"},{"id":"e2r017","module":"M20","question":"Compared with a sandy soil, a clayey soil needs ___ water over the season.","correct":"less","options":["less","more"],"feedback":"Clay holds more available water.","source":"M20 module quiz (reworked)","kind":"module"},{"id":"e2r018","module":"M13","question":"Agrostis palustris is a Latin name for:","correct":"creeping bentgrass","options":["creeping bentgrass","colonial bentgrass","velvet bentgrass","redtop"],"feedback":"Also Agrostis stolonifera.","source":"M13 module quiz (reworked)","kind":"module","tag":"grass-id"},{"id":"e2r019","module":"M17","question":"Thatch is the layer of undecomposed or partly decomposed organic matter located:","correct":"above the soil surface","options":["above the soil surface","within the B horizon","below the subsoil","on leaf surfaces"],"feedback":"Between shoots and soil.","source":"M17.9: Thatch Zone","kind":"module"},{"id":"e2r020","module":"M13","question":"Which turfgrass LACKS auricles?","correct":"creeping bentgrass","options":["creeping bentgrass","tall fescue","annual ryegrass","perennial ryegrass"],"feedback":"Bentgrasses have no auricles.","source":"M13 module quiz (reworked)","kind":"module","tag":"grass-id"},{"id":"e2r021","module":"M11","question":"For lawn turf, hard fescue is adaptable to:","correct":"a low-to-moderate intensity of culture","options":["a low-to-moderate intensity of culture","only a very high intensity of culture","any intensity of culture equally","intensities below putting-green height only"],"feedback":"Hard fescue is adaptable to a low-to-moderate intensity of lawn culture.","source":"M11.4: Hard Fescue","kind":"module"},{"id":"e2r022","module":"M11","question":"On golf roughs, tall fescue is rated:","correct":"adapted","options":["adapted","not adapted","marginally adapted","not suitable"],"feedback":"Tall fescue is adapted for golf roughs.","source":"M11.5: Tall Fescue","kind":"module"},{"id":"e2r023","module":"M20","question":"Uniform wetting without runoff occurs when PR is ___ the infiltration capacity.","correct":"less than","options":["less than","greater than"],"feedback":"PR above IC gives runoff.","source":"M20 module quiz (reworked)","kind":"module"},{"id":"e2r024","module":"M14","question":"Per its module page, the Latin name of buffalograss is:","correct":"Buchloe dactyloides [Nutt.] Engelm.","options":["Buchloe dactyloides [Nutt.] Engelm.","Bouteloua dactyloides [Nutt.] J.T. Columbus","Cynodon dactylon [L.]","Bouteloua gracilis"],"feedback":"Buffalograss's species page gives its Latin name as Buchloe dactyloides [Nutt.] Engelm.","source":"M14.6: Buffalograss","kind":"module","tag":"grass-id"},{"id":"e2r025","module":"M20","question":"\"Rabbit ears\" along a fairway result from:","correct":"poor sprinkler coverage","options":["poor sprinkler coverage","too much nitrogen","golf cart traffic","low mowing heights"],"feedback":"Dry, off-color fairway edges.","source":"M20 module quiz (reworked)","kind":"module"},{"id":"e2r026","module":"M18","question":"Excess thatch increases resistance to wear but also increases susceptibility to:","correct":"disease and stress","options":["disease and stress","wear injury","soil compaction","divot damage"],"feedback":"Thatch cushions but invites disease.","source":"M18 module quiz (reworked)","kind":"module"},{"id":"e2r027","module":"M20","question":"A tensiometer reading of 10–30 cb indicates:","correct":"field capacity","options":["field capacity","wilting point","saturation","reduced available moisture"],"feedback":"70 cb = reduced plant-available moisture.","source":"M20.3: Rooting Depth","kind":"module"},{"id":"e2r028","module":"M17","question":"A benefit of mechanical thatch removal is reduced:","correct":"disease","options":["disease","rooting depth","infiltration","aeration"],"feedback":"Less thatch, less disease and stress.","source":"M17 module quiz (reworked)","kind":"module"},{"id":"e2r029","module":"M14","question":"Which chloridoid has folded vernation?","correct":"bermudagrass","options":["bermudagrass","zoysiagrass","buffalograss","Japanese lawngrass"],"feedback":"Zoysia and buffalograss are rolled.","source":"M14 module quiz (reworked)","kind":"module","tag":"grass-id"},{"id":"e2r030","module":"M10","question":"The fungal endophyte found in perennial ryegrass seed forms a ________ association with the plant.","correct":"symbiotic","options":["symbiotic","parasitic","competitive","temporary"],"feedback":"The fungal endophyte forms a symbiotic association with the perennial ryegrass plant.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"e2r031","module":"M13","question":"Velvet bentgrass is described as an especially ________-textured turfgrass.","correct":"fine","options":["fine","coarse","medium","variable"],"feedback":"Velvet bentgrass is an especially fine-textured turfgrass.","source":"M13.5: Velvet Bentgrass","kind":"module","tag":"grass-id"},{"id":"e2r032","module":"M19","question":"On potassium-deficient turf, chlorosis begins at the:","correct":"leaf tip","options":["leaf tip","leaf base","midvein","sheath"],"feedback":"Then tip and margin necrosis.","source":"M19.12: Primary Nutrients","kind":"module"},{"id":"e2r033","module":"M17","question":"Plant-available water lies between field capacity and:","correct":"the permanent wilting point","options":["the permanent wilting point","saturation","the water table","the hygroscopic coefficient"],"feedback":"Field capacity = after gravitational water drains.","source":"M17.16: Soil Water","kind":"module"},{"id":"e2r034","module":"M20","question":"Overwatering harms roots mainly by causing:","correct":"oxygen deficiency","options":["oxygen deficiency","salt crystals","frost heaving","excess rooting"],"feedback":"Anoxic conditions.","source":"M20.3: Rooting Depth","kind":"module"},{"id":"e2r035","module":"M16","question":"Compared with turf in full sun, shaded turf has cuticles that are:","correct":"thinner","options":["thinner","thicker"],"feedback":"Shade also gives thinner, longer, more vertical leaves.","source":"M16 module quiz (reworked)","kind":"module"},{"id":"e2r036","module":"M19","question":"Which tertiary nutrient is most likely to be deficient in turf?","correct":"iron","options":["iron","copper","molybdenum","chlorine"],"feedback":"High pH, excess P, cold wet springs.","source":"M19.14: Tertiary Nutrients","kind":"module"},{"id":"e2r037","module":"M17","question":"Compared with a sand, the nutrient retention of a clay soil is:","correct":"much greater","options":["much greater","much less","about the same","zero"],"feedback":"Depends on clay type and organic matter.","source":"M17.7: Soil Chemistry","kind":"module"},{"id":"e2r038","module":"M13","question":"Velvet bentgrass's recuperative capacity, owing to its slow growth, is:","correct":"very slow","options":["very slow","very fast","moderate","identical to creeping bentgrass"],"feedback":"Velvet bentgrass's recuperative capacity is very slow because of its slow growth.","source":"M13.5: Velvet Bentgrass","kind":"module"},{"id":"e2r039","module":"M17","question":"Removing both water and oxygen as limiting factors requires:","correct":"a range of pore sizes","options":["a range of pore sizes","only large, aeration pores","only small, water-holding pores","a high bulk density"],"feedback":"Large pores for air, small for water.","source":"M17.4: Oxygen - Moisture Relationship in Soils","kind":"module"},{"id":"e2r040","module":"M18","question":"Turf quality measurably declines when traffic intensity is ___ the traffic threshold.","correct":"above","options":["above","below","unrelated to"],"feedback":"\"At\" and \"below\" were wrong on the quiz.","source":"M18 module quiz (reworked)","kind":"module"},{"id":"e2r041","module":"M19","question":"At low pH, the solubility of molybdenum and calcium is:","correct":"decreased","options":["decreased","increased"],"feedback":"Both are most soluble at high pH.","source":"M19 module quiz (reworked)","kind":"module"},{"id":"e2r042","module":"M19","question":"Iron is classified as a ___ nutrient.","correct":"tertiary","options":["tertiary","primary","secondary"],"feedback":"Tertiary = micronutrients.","source":"M19 module quiz (reworked)","kind":"module"},{"id":"e2r043","module":"M13","question":"Colonial bentgrass's high susceptibility to brown patch disease limits its use primarily to:","correct":"temperate oceanic climates","options":["temperate oceanic climates","hot, arid desert climates","tropical rainforest climates","the transition zone"],"feedback":"Because of brown patch susceptibility, colonial bentgrass use is limited mainly to temperate oceanic climates with milder summers.","source":"M13.4: Colonial Bentgrass","kind":"module"},{"id":"e2r044","module":"M19","question":"Which nitrogen form is especially lost by leaching?","correct":"nitrate","options":["nitrate","ammonium","organic N","UF polymers"],"feedback":"Nitrate is an anion, not held by CEC.","source":"M19.6: Nitrogen","kind":"module"},{"id":"e2r045","module":"M10","question":"Perennial ryegrass is NOT well suited to soils that are:","correct":"droughty and infertile","options":["droughty and infertile","moist","slightly acid","moderately fertile"],"feedback":"It prefers moist, slightly acid, moderate-to-high fertility soils.","source":"M10 module quiz (reworked)","kind":"module"},{"id":"e2r046","module":"M13","question":"Creeping and colonial bentgrasses show a differential in disease susceptibility during the winter months for:","correct":"snow mold disease","options":["snow mold disease","brown patch disease","dollar spot disease","gray leaf spot disease"],"feedback":"A photograph in the module shows the differential in snow mold susceptibility between creeping and colonial bentgrasses in winter.","source":"M13.4: Colonial Bentgrass","kind":"module"},{"id":"e2r047","module":"M17","question":"As a growing medium, thatch is best described as:","correct":"coarse-textured","options":["coarse-textured","fine-textured","medium-textured"],"feedback":"Few small pores, little water held.","source":"M17 module quiz (reworked)","kind":"module"},{"id":"e2r048","module":"M18","question":"Which is NOT a way to raise the traffic threshold?","correct":"lowering the mowing height","options":["lowering the mowing height","improving light and drainage","optimizing fertility and irrigation","planting a more tolerant turfgrass"],"feedback":"Raise the mowing height instead.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"e2r049","module":"M19","question":"Phosphates do not leach readily because they are:","correct":"immobile in soil","options":["immobile in soil","highly soluble","gaseous","in nitrate form"],"feedback":"Lowest leaching risk of N, P, K.","source":"M19.7: Phosphorus","kind":"module"},{"id":"e2r050","module":"M10","question":"Folded vernation, short auricles, and bunch-type growth identify:","correct":"perennial ryegrass","options":["perennial ryegrass","annual ryegrass","tall fescue","creeping red fescue"],"feedback":"Annual ryegrass is rolled with long auricles.","source":"M10 module quiz (reworked)","kind":"module","tag":"grass-id"},{"id":"e2r051","module":"M10","question":"Seeding an aggressive perennial ryegrass at high rates with Kentucky bluegrass will likely:","correct":"crowd out the bluegrass","options":["crowd out the bluegrass","speed bluegrass spread","improve bluegrass rooting","have no effect on the mix"],"feedback":"A nursegrass should be non-aggressive and seeded at low rates.","source":"M10 module quiz (reworked)","kind":"module"},{"id":"e2r052","module":"M14","question":"For wintertime play, hybrid bermudagrass greens are often overseeded with cool-season turfgrasses such as:","correct":"perennial ryegrass","options":["perennial ryegrass","tall fescue","hard fescue","Kentucky bluegrass"],"feedback":"Hybrid bermudagrass greens are commonly overseeded with perennial ryegrass for winter play and color.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"e2r053","module":"M17","question":"Which soil separate has the smallest particles?","correct":"clay","options":["clay","silt","very fine sand","fine sand"],"feedback":"Sand largest, clay smallest.","source":"M17.3: Physical Properties","kind":"module"},{"id":"e2r054","module":"M20","question":"For S3 water (SAR 18–26), M20.5 recommends adding:","correct":"gypsum","options":["gypsum","lime","urea","potassium chloride"],"feedback":"Calcium exchanges sodium.","source":"M20.5: Salinity and Sodium Hazard","kind":"module"},{"id":"e2r055","module":"M10","question":"Gray leaf spot disease can devastate a perennial ryegrass fairway in:","correct":"just a few days","options":["just a few days","about a month","a full growing season","several years"],"feedback":"Gray leaf spot can devastate a perennial ryegrass fairway in just a few days.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"e2r056","module":"M19","question":"Calcium is classified as a ___ nutrient.","correct":"secondary","options":["secondary","primary","tertiary"],"feedback":"Ca, Mg, S are secondary.","source":"M19 module quiz (reworked)","kind":"module"},{"id":"e2r057","module":"M20","question":"A donut-shaped sprinkler pattern means pressure is:","correct":"too low","options":["too low","too high","normal","fluctuating"],"feedback":"Large drops fall in a ring.","source":"M20 module quiz (reworked)","kind":"module"},{"id":"e2r058","module":"M12","question":"Which seed loses its endophyte viability faster in storage: fine fescue (about one year) or tall fescue/perennial ryegrass (about two years)?","correct":"fine fescue","options":["fine fescue","tall fescue/perennial ryegrass","they lose viability at the same rate","neither loses viability over time"],"feedback":"Fine fescue endophyte viability may not last beyond one year, shorter than the roughly two years for tall fescue and perennial ryegrass seed.","source":"M12.3: Endophytes","kind":"module"},{"id":"e2r059","module":"M14","question":"Because older bermudagrasses suffered low-temperature injury in St. Louis' climate, common zoysiagrass became a popular alternative for use in:","correct":"fairways","options":["fairways","greens","roughs","utility turf"],"feedback":"Common zoysiagrass became a popular fairway alternative to cold-sensitive bermudagrass in St. Louis.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"e2r060","module":"M17","question":"The study of soils in relation to plant growth is:","correct":"edaphology","options":["edaphology","pedology","hydrology","mineralogy"],"feedback":"Pedology studies soil formation.","source":"M17 module quiz (reworked)","kind":"module"},{"id":"e2r061","module":"M14","question":"Bermudagrass's greatest limitation is its poor:","correct":"shade adaptation","options":["shade adaptation","heat tolerance","wear tolerance","drought tolerance"],"feedback":"Bermudagrass needs full sun.","source":"M14 module quiz (reworked)","kind":"module"},{"id":"e2r062","module":"M15","question":"Kikuyugrass turf can have a silvery cast because:","correct":"white anther filaments above the canopy","options":["white anther filaments above the canopy","female flower parts above the canopy","a waxy bloom on the leaves","stolons exposed on the surface"],"feedback":"The anthers and white filaments of the male flower portions extend above the canopy, giving a silvery cast.","source":"M15.4: Kikuyugrass","kind":"module"},{"id":"e2r063","module":"M12","question":"Fungal endophytes are NOT naturally found in:","correct":"bentgrasses","options":["bentgrasses","tall fescue","perennial ryegrass","Chewings fescue"],"feedback":"Only ryegrasses and fescues.","source":"M12 module quiz (reworked)","kind":"module"},{"id":"e2r064","module":"M17","question":"Within the thatch layer, decomposition is greatest:","correct":"nearest the soil surface","options":["nearest the soil surface","at the top near the shoots","uniformly throughout","only in the middle"],"feedback":"Contact with soil biology.","source":"M17.9: Thatch Zone","kind":"module"},{"id":"e2r065","module":"M20","question":"Sandy soils hold less water than clays because:","correct":"large pores drain quickly","options":["large pores drain quickly","total porosity is high","pores are mostly small","CEC is very high"],"feedback":"Total porosity of sand is relatively low.","source":"M20.4: Water Quantity in Irrigation","kind":"module"},{"id":"e2r066","module":"M16","question":"Wind tItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(activeBank().map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(activeBank().map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.module} · ${q.kind==='enrichment'?'Textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>Exam 2 cleared</h2><p>You retired all ${activeBank().length} questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart Exam 2 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};noid.checked=noId;noid.onchange=()=>{noId=noid.checked;try{localStorage.setItem(BASE+'_noid',noId?'1':'0')}catch(e){}KEY=BASE+(noId?'_noid':'');if(!load())reset();else{state.current=[];nextBatch()}};if(!load())reset();else{state.current=[];nextBatch()}
