const BANK=[{"id":"m24q044","module":"M24","question":"A blend is a combination of:","correct":"different cultivars of the same species","options":["different cultivars of the same species","two or more different turfgrass species combined","seed and vegetative materials","a turfgrass and a nursegrass"],"feedback":"A mixture combines two or more species.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q045","module":"M24","question":"In a Kentucky bluegrass-red fescue mixture, red fescue would be favored on:","correct":"infertile or shady sites","options":["infertile or shady sites","sunny, fertile sites","wet, poorly drained sites","heavily trafficked sites"],"feedback":"Kentucky bluegrass dominates sunny sites of moderate-high fertility.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q046","module":"M24","question":"A blend provides insurance against widespread turf deterioration because:","correct":"a cultivar may lose its pest resistance","options":["a cultivar may lose its pest resistance","blends contain several different species","blends germinate faster than mixtures","blends need less fertilizer to persist"],"feedback":"If one cultivar becomes susceptible, others carry the stand.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q047","module":"M24","question":"Blends may, to some extent, replace mixtures because:","correct":"some cultivars are better adapted to shade","options":["some cultivars are better adapted to shade","blends contain more seed per pound than mixtures do","mixtures are no longer sold in stores","mixtures cannot be seeded by machine"],"feedback":"Cultivar differences in site adaptation.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q048","module":"M24","question":"Vegetative planting materials are used for genotypes that:","correct":"do not produce viable seed or true-to-type seed","options":["do not produce viable seed or true-to-type seed","produce seed too large for most drop spreaders to meter","germinate too quickly in cool weather","are too expensive to plant by seed alone"],"feedback":"Also used where especially rapid establishment is desired.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q049","module":"M24","question":"The one vegetative propagation method that can be used for ALL turfgrasses is:","correct":"sodding","options":["sodding","plugging","sprigging","stolonizing"],"feedback":"Others require strong creeping growth.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q050","module":"M24","question":"To ensure rapid rooting, sod should be cut:","correct":"as thin as possible","options":["as thin as possible","at least 2 inches thick","with extra thatch on it","in very large slabs"],"feedback":"Thin sod roots faster.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q051","module":"M24","question":"Washing sod free of soil reduces weight, hastens rooting, and:","correct":"eliminates troublesome soil layers","options":["eliminates troublesome soil layers","adds nutrients to the root zone","prevents all thatch development","kills weed seeds in the sod"],"feedback":"Important where production and transplant soils differ.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q052","module":"M24","question":"Sprigs or stolons for propagation are produced by:","correct":"shredding sod or plugs of stoloniferous species","options":["shredding sod or plugs of stoloniferous species","harvesting seed heads before they mature","cutting cores during hollow-tine cultivation","dividing bunch-type plants into their individual tillers"],"feedback":"Individual plants or plant parts.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q053","module":"M24","question":"The principal factors influencing seed quality are:","correct":"purity and viability","options":["purity and viability","color and size","weight and shape","cost and origin"],"feedback":"%P × %V = %PLS.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q054","module":"M24","question":"Purity is the percentage of:","correct":"pure seed of the identified species or cultivar","options":["pure seed of the identified species or cultivar","seed that germinates under standard laboratory conditions","inert matter present in the seed lot","weed seeds found in a pound of seed"],"feedback":"The remainder is inert matter, weed seeds, and other crop seeds.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q055","module":"M24","question":"Where purity is below 100%, the remainder is composed of:","correct":"inert matter, weed seeds, and other crop seeds","options":["inert matter, weed seeds, and other crop seeds","dead seed, dormant seed, and hard seed","chaff, dust, and broken seed only, with no other materials","noxious weeds and restricted weeds only"],"feedback":"Listed on the label.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q056","module":"M24","question":"Viability is the percentage of seed that:","correct":"is alive and germinates under standard lab conditions","options":["is alive and germinates under standard lab conditions","is the identified species or cultivar listed","emerges and survives in the field after planting is done","is free of weed and other crop seeds"],"feedback":"Field emergence is often lower.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q057","module":"M24","question":"Percent pure live seed (PLS) is calculated as:","correct":"% purity × % viability","options":["% purity × % viability","% purity + % viability","% purity ÷ % viability","% viability − % inert"],"feedback":"Divide by 100 to keep it a percent.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q058","module":"M24","question":"A seed label shows 92% purity and 80% germination. The PLS is:","correct":"73.6%","options":["73.6%","86.0%","80.0%","72.0%"],"feedback":"0.92 × 0.80 = 0.736.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q059","module":"M24","question":"Seed costs $3.68/lb with 73.6% PLS. The cost per pound of PLS is:","correct":"$5.00","options":["$5.00","$2.71","$3.68","$4.60"],"feedback":"$3.68 ÷ 73.6 × 100 = $5.00.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q060","module":"M24","question":"Seed with 90% purity and 80% viability has a PLS of:","correct":"72%","options":["72%","85%","80%","70%"],"feedback":"0.90 × 0.80 = 0.72.","source":"M24.3: Turfgrass Selection","kind":"module"},{"id":"m24q061","module":"M24","question":"Seed lot A costs $2.00/lb at 50% PLS; lot B costs $3.00/lb at 90% PLS. The better buy per pound of PLS is:","correct":"lot B ($3.33/lb PLS)","options":["lot B ($3.33/lb PLS)","lot A ($4.00/lb PLS)","lot A ($1.00/lb PLS)","they cost the same"],"feedback":"A: 2.00 ÷ 50 × 100 = $4.00; B: 3.00 ÷ 90 × 100 = $3.33.","source":"M24.3: Turfgrass Selection","kind":"module"}];const KEY='turf235_final_m24_24_3_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M24.3 cleared</h2><p>You retired all 18 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M24.3 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
