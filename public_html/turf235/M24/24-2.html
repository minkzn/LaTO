</style><style>.subs{max-width:1050px;margin:12px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.subs a{text-decoration:none;color:#173f24;background:#fff;border:1px solid #c9d4ca;border-radius:999px;padding:6px 11px;font-weight:750;font-size:14px}.subs a span{color:#657167;font-weight:600}.subs a.on{background:#0d5722;color:#fff;border-color:#0d5722}.subs a.on span{color:#dce9df}</style></head><body><header><h1>M24.2 • 43 Questions</h1><p>M24.2: Turf Establishment. TURF 235 final exam practice. Ten at a time. Correct questions retire; misses cycle back until you clear the module.</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="toolbar"><div class="row"><button class="primary" id="restart">Restart M24.2</button><button id="clear">Clear Saved Progress</button><a href="../index.html"><button>All Modules</button></a></div></div><nav class="subs"><a href="index.html">All M24 <span>253</span></a><a href="24-2.html" class="on">M24.2 <span>43</span></a><a href="24-3.html">M24.3 <span>18</span></a><a href="24-4.html">M24.4 <span>17</span></a><a href="24-5.html">M24.5 <span>18</span></a><a href="24-6.html">M24.6 <span>5</span></a><a href="24-7.html">M24.7 <span>19</span></a><a href="24-textbook.html">Textbook <span>133</span></a></nav><main><div class="stats"><div class="stat" id="remaining">Remaining: 43</div><div class="stat" id="mastered">Mastered: 0</div><div class="stat" id="misses">Misses: 0</div><div class="stat" id="batch">Batch: —</div></div><div id="quiz"></div><div class="actions"><button class="primary" id="submit">Submit 10</button><button class="primary" id="next" disabled>Next 10 →</button></div></main><script>
const BANK=[{"id":"m24q001","module":"M24","question":"The four components of turf establishment in the module's diagram are site preparation, turfgrass selection, planting procedures, and:","correct":"postplanting culture","options":["postplanting culture","soil testing","renovation","irrigation design"],"feedback":"Mistakes or omissions in any of the four cause later problems.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q002","module":"M24","question":"Severe weeds, disease, poor drainage, scalping, and stress intolerance in a turf often trace back to:","correct":"mistakes made during establishment","options":["mistakes made during establishment","improper mowing of the mature turf","poor choice of fertilizer carrier","overwatering in the first summer"],"feedback":"Many problems are directly related to establishment mistakes or omissions.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q003","module":"M24","question":"Which is NOT one of the site preparation steps in the module's hexagon?","correct":"seeding","options":["seeding","tillage","grading","soil modification"],"feedback":"The six: clearing, tillage, soil modification, fertilization and liming, drainage/irrigation, grading.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q004","module":"M24","question":"Clearing operations are any practices designed to:","correct":"eliminate or reduce obstructions to propagation","options":["eliminate or reduce obstructions to propagation","provide a smooth planting bed of the desired contour","improve physical and chemical soil properties","prepare a soil for planting by loosening it"],"feedback":"Trees, shrubs, rocks, debris, weeds.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q005","module":"M24","question":"Tillage is defined as:","correct":"any operation performed to prepare a soil for planting","options":["any operation performed to prepare a soil for planting","all operations providing a smooth bed of desired contour","the incorporation of amendments into the soil","the removal of obstructions to propagation"],"feedback":"Grading = contour; modification = amendments; clearing = obstructions.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q006","module":"M24","question":"Grading includes all operations for:","correct":"providing a smooth planting bed of the desired contour","options":["providing a smooth planting bed of the desired contour","incorporating soil amendments to improve the soil's properties","removing trees, rocks, and debris from the site","loosening and granulating the soil for planting"],"feedback":"Rough and fine grading.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q007","module":"M24","question":"Drainage and irrigation systems should be installed:","correct":"after rough grading of the new site","options":["after rough grading of the new site","after final topsoil placement only","before any clearing operations begin","after the turf has been established"],"feedback":"Settling of soil in trenches is less of a problem than after topsoil placement.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q008","module":"M24","question":"Fumigation applies a highly volatile chemical to the soil under a:","correct":"polyethylene tarp","options":["polyethylene tarp","layer of straw mulch","sand topdressing","burlap cover"],"feedback":"Controls weed seeds, vegetative propagules, pathogens, and nematodes.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q009","module":"M24","question":"Fumigation controls all of the following EXCEPT:","correct":"established turfgrass sod laid later","options":["established turfgrass sod laid later","weed seeds lying dormant in the soil seed bank","rhizomes, stolons, and tubers","nematodes and disease organisms"],"feedback":"It targets seeds, vegetative propagules, disease organisms, nematodes, and others in the soil.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q010","module":"M24","question":"After applying the granular fumigant dazomet, the best practice is to:","correct":"tarp the site immediately","options":["tarp the site immediately","till it in after two weeks","mow the site the next day","seed directly into it"],"feedback":"At minimum water it in; tarping immediately is better. (The module labels it \"Basagran\"; the textbook brand is Basamid.)","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q011","module":"M24","question":"Tillage is done to improve aeration, infiltration, and percolation and to:","correct":"minimize resistance to root penetration","options":["minimize resistance to root penetration","increase the bulk density of the surface soil layer","raise the soil pH for turfgrass","bury weed seeds below germination"],"feedback":"Root penetration is eased.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q012","module":"M24","question":"Tilling a soil that is too WET causes it to:","correct":"clod or puddle","options":["clod or puddle","turn powdery","crack deeply","repel water"],"feedback":"Too dry, it becomes a powdery mass.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q013","module":"M24","question":"Tilling a soil that is too DRY may reduce it to:","correct":"a powdery mass of particles","options":["a powdery mass of particles","hard clods and puddles","a smeared, sealed surface","a layer of surface crust"],"feedback":"Too wet: clods or puddles.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q014","module":"M24","question":"In the squeeze test for tillage moisture, tillage may proceed if the soil mass:","correct":"crumbles easily","options":["crumbles easily","smears under pressure","is very hard to break","holds together firmly"],"feedback":"Too dry is hard to break up; too wet smears.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q015","module":"M24","question":"In the squeeze test, a soil that is too wet will:","correct":"smear under pressure","options":["smear under pressure","crumble easily","be hard to break","crack into plates"],"feedback":"Too dry is very hard to break up.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q016","module":"M24","question":"Plowing cuts loose a furrow slice of soil, granulates it, and:","correct":"inverts it","options":["inverts it","smooths it","compacts it","sieves it"],"feedback":"Leaving furrows and ridges parallel to the plowing direction.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q017","module":"M24","question":"Disking is performed on plowed or loose soil to:","correct":"break up clods and surface crusts","options":["break up clods and surface crusts","invert the furrow slice of soil","incorporate seed into the top 1/4 inch","install drainage tile in the field"],"feedback":"Improves granulation and surface uniformity.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q018","module":"M24","question":"The tillage step that further granulates and smooths the soil to complete the series is:","correct":"harrowing","options":["harrowing","plowing","disking","grading"],"feedback":"It completes the series of tillage operations.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q019","module":"M24","question":"Rototilling is a very intensive tillage method used primarily on small sites as an alternative to:","correct":"plowing and disking","options":["plowing and disking","grading and rolling","harrowing and seeding","mulching and irrigating"],"feedback":"Over-tilling can destroy structure and compact the soil.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q020","module":"M24","question":"Excessive rototilling on large sites can result in:","correct":"destroyed structure and severe compaction","options":["destroyed structure and severe compaction","too many large clods left on the soil surface afterward","a surface that is too loose to plant","a loss of all organic matter at once"],"feedback":"Care is needed with this intensive method.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q021","module":"M24","question":"Adding a little sand to a fine-textured soil often produces:","correct":"a cement-like medium","options":["a cement-like medium","a well-aerated medium","a hydrophobic medium","a highly organic medium"],"feedback":"Like adding a marble to a cup of flour: porosity drops.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q022","module":"M24","question":"In the marble-and-flour analogy, porosity only increases once:","correct":"adjacent marbles contact each other","options":["adjacent marbles contact each other","the first marble is added to the cup of flour","the flour is fully wetted by water","the marbles are smaller than flour"],"feedback":"Sand improves aeration only when grains touch.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q023","module":"M24","question":"To improve a predominantly sand medium, it is generally better to:","correct":"add a small amount of soil to the sand","options":["add a small amount of soil to the sand","add a small amount of sand to the soil","add perlite and vermiculite to the sand","add raw sawdust to the sand mixture"],"feedback":"Improves moisture and nutrient retention and reduces hydrophobicity.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q024","module":"M24","question":"Perlite and vermiculite are unsuitable for turf soils because under traffic:","correct":"perlite crushes and vermiculite flattens","options":["perlite crushes and vermiculite flattens","perlite flattens and vermiculite crushes","both decompose rapidly in the soil","both raise soil pH to toxic levels"],"feedback":"Popular in potting media, but not for turf.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q025","module":"M24","question":"Raw sawdust should never be used as an amendment because its decomposition:","correct":"draws so much N that the turf becomes deficient","options":["draws so much N that the turf becomes deficient","releases toxic gases that kill the germinating seedlings","raises soil pH above the optimum range","makes the soil hydrophobic for years"],"feedback":"Compost it with soil and fertilizer first.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q026","module":"M24","question":"Caution is needed with muck soil as an amendment because it may contain:","correct":"dispersed clay and silt that clog pores","options":["dispersed clay and silt that clog pores","weed seeds that cannot be controlled","salts that injure the turfgrass seedlings as they emerge","raw sawdust that draws soil nitrogen"],"feedback":"This impedes drainage.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q027","module":"M24","question":"The most generally acceptable soil amendment is:","correct":"peat moss","options":["peat moss","sand","perlite","sawdust"],"feedback":"Dilutes clay in fine soils and sand in coarse soils.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q028","module":"M24","question":"In clayey soils, incorporating peat moss primarily improves:","correct":"aeration capacity","options":["aeration capacity","water retention","nutrient retention","resiliency"],"feedback":"In sandy soils it improves nutrient and moisture retention.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q029","module":"M24","question":"Peat moss and sand added but not incorporated resulted in:","correct":"a serious layering problem","options":["a serious layering problem","a well-mixed root zone","a hydrophobic surface","excess nitrogen release"],"feedback":"Amendments must be mixed in.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q030","module":"M24","question":"\"Basic fertilizer\" refers primarily to:","correct":"phosphorus and potash","options":["phosphorus and potash","nitrogen and potash","nitrogen and phosphorus","lime and sulfur"],"feedback":"May also include secondary and tertiary nutrients.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q031","module":"M24","question":"Basic fertilizer and lime should be:","correct":"tilled into the soil during bed preparation","options":["tilled into the soil during bed preparation","applied on the surface right after the seeding is done","withheld until after the first mowing","applied only with the starter fertilizer"],"feedback":"Bed preparation is a rare chance to incorporate them into the root zone.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q032","module":"M24","question":"Starter fertilizer (nitrogen) is generally applied:","correct":"just prior to final grading","options":["just prior to final grading","before rough grading","with the lime in tillage","after the first mowing"],"feedback":"Not tilled deeply, because leaching may lose it before roots develop.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q033","module":"M24","question":"Nitrogen is usually NOT tilled deeply into the soil because:","correct":"it may leach before roots can absorb it","options":["it may leach before roots can absorb it","it volatilizes when it is buried deeply","it reacts with lime to form insoluble salts","it burns the seed if placed near it"],"feedback":"Roots are still shallow.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q034","module":"M24","question":"Drain tiles are normally placed at a depth of:","correct":"18 to 36 inches","options":["18 to 36 inches","6 to 12 inches","3 to 6 feet","12 to 18 inches"],"feedback":"Lines spaced 15 to 60 feet apart.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q035","module":"M24","question":"Drain tile lines are typically spaced:","correct":"15 to 60 feet apart","options":["15 to 60 feet apart","3 to 5 feet apart","100 to 150 feet apart","6 to 12 inches apart"],"feedback":"At 18-36 inches deep.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q036","module":"M24","question":"Gravel is placed around drain tiles to:","correct":"prevent clogging by fine soil particles","options":["prevent clogging by fine soil particles","add weight that holds the pipe in place","raise the pipe above the water table","filter salts out of the drainage water"],"feedback":"A buffer between tile and soil.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q037","module":"M24","question":"Catch basins with covers flush with the turf surface dramatically improve:","correct":"surface as well as internal drainage","options":["surface as well as internal drainage","irrigation uniformity across the whole site","topsoil depth across the site","soil aeration beneath the turf"],"feedback":"Cylinders extend down to the drain-tile depth.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q038","module":"M24","question":"If grading could damage an irrigation system installed before topsoil placement, installation should be:","correct":"delayed until topsoil is placed and graded","options":["delayed until topsoil is placed and graded","moved deeper into the subsoil","completed before any of the clearing operations occur","skipped in favor of hand watering"],"feedback":"Delay all or part of the system.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q039","module":"M24","question":"Before major changes in contour, the topsoil should be:","correct":"removed and stockpiled","options":["removed and stockpiled","tilled into the subsoil","fumigated and tarped","buried under the fill"],"feedback":"Determine its depth first, then scrape and store.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q040","module":"M24","question":"Rough grading refers to:","correct":"contouring the subgrade after topsoil removal","options":["contouring the subgrade after topsoil removal","smoothing the soil surface just before planting begins","working in starter fertilizer by raking","dragging a mat to smooth the surface"],"feedback":"Cutting down high spots and filling depressions.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q041","module":"M24","question":"Fine grading smooths the soil for planting and is also effective for:","correct":"working in starter fertilizer","options":["working in starter fertilizer","breaking up surface clods","installing drainage tile","removing rocks and debris"],"feedback":"Hand raking for small areas; mats, plank drags, tiller rakes for large ones.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q042","module":"M24","question":"Before fine grading, sufficient time should be allowed for:","correct":"settling of the soil","options":["settling of the soil","weed seeds to germinate","fertilizer to dissolve","the soil to dry fully"],"feedback":"Otherwise traffic leaves depressions; irrigation or rain speeds settling.","source":"M24.2: Turf Establishment","kind":"module"},{"id":"m24q043","module":"M24","question":"Soil settling before fine grading can be accelerated by:","correct":"intensive irrigation or rainfall","options":["intensive irrigation or rainfall","adding lime and fertilizer","harrowing in several directions","harrowing the site in several different directions"],"feedback":"Settling prevents later depressions.","source":"M24.2: Turf Establishment","kind":"module"}];const KEY='turf235_final_m24_24_2_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M24.2 cleared</h2><p>You retired all 43 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M24.2 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
