</style><style>.subs{max-width:1050px;margin:12px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.subs a{text-decoration:none;color:#173f24;background:#fff;border:1px solid #c9d4ca;border-radius:999px;padding:6px 11px;font-weight:750;font-size:14px}.subs a span{color:#657167;font-weight:600}.subs a.on{background:#0d5722;color:#fff;border-color:#0d5722}.subs a.on span{color:#dce9df}</style></head><body><header><h1>M24.5 • 18 Questions</h1><p>M24.5: Vegetative Planting Methods. TURF 235 final exam practice. Ten at a time. Correct questions retire; misses cycle back until you clear the module.</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="toolbar"><div class="row"><button class="primary" id="restart">Restart M24.5</button><button id="clear">Clear Saved Progress</button><a href="../index.html"><button>All Modules</button></a></div></div><nav class="subs"><a href="index.html">All M24 <span>253</span></a><a href="24-2.html">M24.2 <span>43</span></a><a href="24-3.html">M24.3 <span>18</span></a><a href="24-4.html">M24.4 <span>17</span></a><a href="24-5.html" class="on">M24.5 <span>18</span></a><a href="24-6.html">M24.6 <span>5</span></a><a href="24-7.html">M24.7 <span>19</span></a><a href="24-textbook.html">Textbook <span>133</span></a></nav><main><div class="stats"><div class="stat" id="remaining">Remaining: 18</div><div class="stat" id="mastered">Mastered: 0</div><div class="stat" id="misses">Misses: 0</div><div class="stat" id="batch">Batch: —</div></div><div id="quiz"></div><div class="actions"><button class="primary" id="submit">Submit 10</button><button class="primary" id="next" disabled>Next 10 →</button></div></main><script>
const BANK=[{"id":"m24q079","module":"M24","question":"Except for sodding, vegetative methods are only practical for turfgrasses that:","correct":"have strong stoloniferous or rhizomatous growth","options":["have strong stoloniferous or rhizomatous growth","produce large amounts of viable, true-to-type seed","are bunch-type and slow growing","are adapted to cool, shaded sites"],"feedback":"They must spread between plants.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q080","module":"M24","question":"Sodding is the most expensive propagation method but provides:","correct":"an \"instant turf\" almost any time of year","options":["an \"instant turf\" almost any time of year","the strongest root system in the first year","the cheapest turf over the long term","the best weed control of any method"],"feedback":"Fastest results.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q081","module":"M24","question":"At the time of sodding, the sodbed should be:","correct":"moist but not wet","options":["moist but not wet","completely dry","saturated","frozen"],"feedback":"Promotes rapid rooting.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q082","module":"M24","question":"Sod should be laid as soon as possible after delivery to avoid:","correct":"desiccation or excessive sod heating","options":["desiccation or excessive sod heating","soil compaction from the delivery truck","weed seed germination in the stack","sod webworm infestation in the rolls"],"feedback":"Stacked sod deteriorates quickly.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q083","module":"M24","question":"Staggering the ends of adjacent sod strips (brick pattern) minimizes:","correct":"cracks from shrinkage","options":["cracks from shrinkage","sod heating in stacks","weed invasion at seams","scalping on slopes"],"feedback":"Also limits drying of edges.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q084","module":"M24","question":"On sloping terrain, each sod strip should be:","correct":"secured with a stake until rooted","options":["secured with a stake until rooted","laid perpendicular to the slope","rolled with a heavy steel roller","laid without fitting the seams"],"feedback":"Prevents sliding.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q085","module":"M24","question":"Desiccation of newly laid sod can be reduced by:","correct":"working screened soil into the seams","options":["working screened soil into the seams","stretching strips to close the gaps","leaving gaps for air circulation","delaying irrigation for one week"],"feedback":"Fills gaps between strips.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q086","module":"M24","question":"The PRINCIPAL advantage of sod washing is:","correct":"eliminating the soil interface at the site","options":["eliminating the soil interface at the site","reducing the sod's weight for easier and cheaper shipment","lowering the cost of the finished sod","removing weed seeds from the sod"],"feedback":"Especially important on sand-based media.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q087","module":"M24","question":"When washed sod is planted on sand, it should be topdressed with sand soon to deal with:","correct":"rapid thatch development","options":["rapid thatch development","rapid nutrient leaching","severe soil compaction","early seed head formation"],"feedback":"Thatch is very likely to develop.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q088","module":"M24","question":"Unless sod was produced on a nearly identical sand, unwashed sod on a sand green creates:","correct":"a layer that impairs infiltration and drainage","options":["a layer that impairs infiltration and drainage","a firmer surface for faster ball roll","a more resilient and wear-tolerant turf on the sand","better nutrient retention for the sod"],"feedback":"Hence washing.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q089","module":"M24","question":"Plugs range in size from:","correct":"small aerification cores to cup-cutter plugs","options":["small aerification cores to cup-cutter plugs","individual stolons to single tillers","sod strips to full sod rolls","seeds to small seedlings"],"feedback":"Plugging plants turf sections.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q090","module":"M24","question":"In the mechanical plugger, plugs are cut from sod strips by:","correct":"a rotating drum with square knives","options":["a rotating drum with square knives","a set of triangular furrow knives","a V-shaped steel section","a ridged roller at the rear"],"feedback":"Triangular knives dig furrows; the V-shaped steel fills them; a roller firms the bed.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q091","module":"M24","question":"Stolonizing is essentially:","correct":"broadcast sprigging","options":["broadcast sprigging","broadcast plugging","row sodding","hydro-sprigging"],"feedback":"Material is spread uniformly on moist soil.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q092","module":"M24","question":"Stolonizing usually requires:","correct":"5 to 10 bushels per 1000 ft²","options":["5 to 10 bushels per 1000 ft²","1 to 4 bushels per 1000 ft²","15 to 20 bushels per 1000 ft²","0.5 to 1 bushel per 1000 ft²"],"feedback":"Sprigging needs 1 to 4.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q093","module":"M24","question":"Sprigging plants individual plants in furrows spaced:","correct":"6 to 12 inches apart","options":["6 to 12 inches apart","1 to 2 inches apart","18 to 24 inches apart","3 to 4 feet apart"],"feedback":"Requires 1 to 4 bushels per 1000 ft².","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q094","module":"M24","question":"Compared with stolonizing, sprigging requires:","correct":"less plant material","options":["less plant material","more plant material","the same plant material","no rolling afterward"],"feedback":"1-4 vs. 5-10 bushels per 1000 ft².","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q095","module":"M24","question":"After stolonizing, stolons are partially covered by:","correct":"topdressing or light disking","options":["topdressing or light disking","rolling with a ridged roller","a layer of straw mulch","hydroseeding with mulch"],"feedback":"Then roll and irrigate.","source":"M24.5: Vegetative Planting Methods","kind":"module"},{"id":"m24q096","module":"M24","question":"Stolons should be washed free of soil especially when:","correct":"laws prohibit shipping soil contaminants","options":["laws prohibit shipping soil contaminants","they will be planted on a clay soil","they are stored for more than a year","they are planted in early spring"],"feedback":"Stolon washing devices remove adhering soil.","source":"M24.5: Vegetative Planting Methods","kind":"module"}];const KEY='turf235_final_m24_24_5_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M24.5 cleared</h2><p>You retired all 18 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M24.5 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
