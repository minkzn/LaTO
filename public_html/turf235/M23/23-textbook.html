</style><style>.subs{max-width:1050px;margin:12px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.subs a{text-decoration:none;color:#173f24;background:#fff;border:1px solid #c9d4ca;border-radius:999px;padding:6px 11px;font-weight:750;font-size:14px}.subs a span{color:#657167;font-weight:600}.subs a.on{background:#0d5722;color:#fff;border-color:#0d5722}.subs a.on span{color:#dce9df}</style></head><body><header><h1>Textbook • 29 Questions</h1><p>Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting. TURF 235 final exam practice. Ten at a time. Correct questions retire; misses cycle back until you clear the module.</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="toolbar"><div class="row"><button class="primary" id="restart">Restart Textbook</button><button id="clear">Clear Saved Progress</button><a href="../index.html"><button>All Modules</button></a></div></div><nav class="subs"><a href="index.html">All M23 <span>74</span></a><a href="23-2.html">M23.2 <span>20</span></a><a href="23-3.html">M23.3 <span>25</span></a><a href="23-textbook.html" class="on">Textbook <span>29</span></a></nav><main><div class="stats"><div class="stat" id="remaining">Remaining: 29</div><div class="stat" id="mastered">Mastered: 0</div><div class="stat" id="misses">Misses: 0</div><div class="stat" id="batch">Batch: —</div></div><div id="quiz"></div><div class="actions"><button class="primary" id="submit">Submit 10</button><button class="primary" id="next" disabled>Next 10 →</button></div></main><script>
const BANK=[{"id":"m23q046","module":"M23","question":"Rolling has enjoyed a resurgence on greens since the 1990s with:","correct":"relatively lightweight units","options":["relatively lightweight units","heavy water-ballast drums","tractor-drawn steel rollers","vibratory compaction plates"],"feedback":"Heavy rolling was abandoned once its compacting effects were recognized.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q047","module":"M23","question":"Rolling after planting ensures:","correct":"contact between soil and planting materials","options":["contact between soil and planting materials","faster germination of weed seed in the soil","deeper penetration of the irrigation water","removal of excess thatch from the surface"],"feedback":"Seed, stolons, sprigs, plugs, and sod.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q048","module":"M23","question":"In climates with freezing winters, rolling is used to:","correct":"press heaved turfgrasses back into the soil","options":["press heaved turfgrasses back into the soil","break up the thick ice layers that cover the turf in winter","remove snow mold from the leaf surface","firm the soil before snow cover arrives"],"feedback":"Otherwise heaved plants may desiccate or be scalped.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q049","module":"M23","question":"At the time of rolling, the soil should be:","correct":"moist but not wet","options":["moist but not wet","completely dry","saturated","frozen"],"feedback":"Dry soil resists pressing; wet soil compacts.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q050","module":"M23","question":"Sod growers often roll before harvest to:","correct":"ensure uniform sod thickness","options":["ensure uniform sod thickness","speed up the sod rooting","remove weeds from the field","improve the sod color"],"feedback":"Allows shallower cuts and lighter sod.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q051","module":"M23","question":"Rolling of greens is regarded as an alternative to:","correct":"ultra-low mowing heights for fast speeds","options":["ultra-low mowing heights for fast speeds","core cultivation for relieving soil compaction","topdressing for thatch control","vertical mowing for grain control"],"feedback":"Especially on sand-based greens that resist compaction.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q052","module":"M23","question":"The three basic types of rollers are drum rollers, triplex-attachment rollers, and:","correct":"dedicated greens rollers","options":["dedicated greens rollers","vibratory plow rollers","sheepsfoot rollers","water-filled lawn rollers"],"feedback":"Greens rollers were introduced in the early 1990s.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q053","module":"M23","question":"An advantage of triplex-attachment rollers is that:","correct":"no extra operator training is needed","options":["no extra operator training is needed","they are the heaviest rollers made","they do not compact soil at all","they double as vertical mowers for grain control"],"feedback":"They are operated like a triplex mowing unit.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q054","module":"M23","question":"Nikolai et al. (2001) found that lightweight rolling once or twice per week:","correct":"raised green speed for 24-48 hours","options":["raised green speed for 24-48 hours","raised soil bulk density sharply","reduced turf quality within weeks","reduced water infiltration rates"],"feedback":"Rolling four or more times per week could raise bulk density and reduce infiltration and quality.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q055","module":"M23","question":"Rolling four or more times per week could result in:","correct":"higher bulk density and lower infiltration","options":["higher bulk density and lower infiltration","lower bulk density and higher infiltration","no change in any soil property at all","faster green speed lasting a full week"],"feedback":"One or two rollings per week caused no significant change.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q056","module":"M23","question":"Ancillary benefits of rolling that have spurred fairway rolling include reduced:","correct":"dollar spot, moss, and black cutworms","options":["dollar spot, moss, and black cutworms","brown patch, algae, and white grub damage","pythium, crabgrass, and sod webworms","snow mold, clover, and mole crickets"],"feedback":"Bird activity associated with cutworms also declined.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q057","module":"M23","question":"Topdressing is believed to have originated specifically to:","correct":"smooth the playing surface of greens","options":["smooth the playing surface of greens","control thatch on fairways","protect greens in winter","change the root-zone soil"],"feedback":"Thatch reduction was observed later as a side effect.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q058","module":"M23","question":"Where a submerged layer of sand exists within a soil profile, the soil above it is often:","correct":"persistently wet, with restricted rooting","options":["persistently wet, with restricted rooting","droughty, with very deep rooting","droughty, with very deep rooting into the subsoil","compacted, with no change in moisture"],"feedback":"Even small differences among layers have significant adverse effects.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q059","module":"M23","question":"When starting a sand topdressing program, core reincorporation should wait until the sand depth exceeds:","correct":"the cultivator's maximum penetration depth","options":["the cultivator's maximum penetration depth","the depth of the thatch layer above the soil","one inch below the putting surface","the mowing height of the green"],"feedback":"Otherwise alternating sand and soil layers form.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q060","module":"M23","question":"Where the indigenous soil is favorable, the topdressing soil should be:","correct":"identical to it","options":["identical to it","sandier than it","finer than it","higher in organic matter"],"feedback":"Stockpile extra soil when building a new green.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q061","module":"M23","question":"The only difference between a construction soil and a topdressing soil is the amount of:","correct":"organic amendment","options":["organic amendment","sand","lime","fertilizer"],"feedback":"The turf generates enough organic residue on its own.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q062","module":"M23","question":"Which is NOT a listed concern over sand topdressing?","correct":"a softer playing surface","options":["a softer playing surface","continuing with sand indefinitely","more water and fertilizer needed","hydrophobic localized dry spots"],"feedback":"Sand layers give a HARDER playing surface.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q063","module":"M23","question":"A rule of thumb is to topdress for thatch control when the thatch layer becomes:","correct":"\"pencil thick\" (about 0.25 inch)","options":["\"pencil thick\" (about 0.25 inch)","\"finger thick\" (about 0.75 inch)","\"paper thin\" (about 0.01 inch)","\"thumb thick\" (about 1.0 inch)"],"feedback":"Then apply about 0.2 yd³/1000 ft², a layer about 0.0625 inch.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q064","module":"M23","question":"In the integrated topdressing soil-thatch medium, the thatch provides:","correct":"resiliency and aeration","options":["resiliency and aeration","firmness and nutrient retention","water retention and nutrients","firmness and water retention"],"feedback":"The soil provides firmness and water/nutrient retention.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q065","module":"M23","question":"Per O'Brien and Hartwiger (2003), light, moderate, and heavy sand topdressing rates are:","correct":"0.02, 0.07, and 0.15 yd³/1000 ft²","options":["0.02, 0.07, and 0.15 yd³/1000 ft²","0.2, 0.7, and 1.5 yd³/1000 ft²","0.01, 0.05, and 0.10 yd³/1000 ft²","0.05, 0.10, and 0.20 yd³/1000 ft²"],"feedback":"USGA Green Section rates.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q066","module":"M23","question":"For bentgrass/annual bluegrass greens, light topdressing rates should be used in:","correct":"summer","options":["summer","spring","fall","early spring"],"feedback":"Slow growth means slow organic matter accumulation; for bermudagrass, light rates go in spring and fall.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q067","module":"M23","question":"For bermudagrass greens, moderate topdressing rates are used in:","correct":"summer","options":["summer","spring","fall","winter"],"feedback":"When growth and organic matter accumulation are most rapid.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q068","module":"M23","question":"Total seasonal sand for topdressing plus filling HTC holes should be at least:","correct":"1.50 to 1.85 yd³/1000 ft²","options":["1.50 to 1.85 yd³/1000 ft²","0.15 to 0.20 yd³/1000 ft²","4.0 to 5.0 yd³/1000 ft²","0.50 to 0.60 yd³/1000 ft²"],"feedback":"About 4000-5000 lb/1000 ft², or a 0.5-0.6 inch depth.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q069","module":"M23","question":"Dust and particulate matter in sand topdressing can be managed by periodically:","correct":"coring and filling holes with clean sand","options":["coring and filling holes with clean sand","rolling the green with a heavy drum roller","applying wetting agents every few weeks","raising the mowing height for a season"],"feedback":"Or by topdressing often enough to dilute the particulates.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q070","module":"M23","question":"Years of topdressing can raise the level of a USGA green, making its surface:","correct":"droughty","options":["droughty","waterlogged","harder to mow","more shaded"],"feedback":"Compensate by coring and core removal.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q071","module":"M23","question":"Matting is usually necessary after topdressing to:","correct":"work soil off foliage and into the turf","options":["work soil off foliage and into the turf","remove thatch along with the excess topdressing soil","firm the surface for faster speeds","sever stolons and reduce grain"],"feedback":"Adhering soil would interfere with mowing and putting.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q072","module":"M23","question":"When soil cores are too wet for matting, the soil tends to:","correct":"smear","options":["smear","crumble","harden","blow away"],"feedback":"Too dry, and the cores are hard and bricklike.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q073","module":"M23","question":"Before modern herbicides, matting was used to:","correct":"lift decumbent crabgrass shoots for mowing","options":["lift decumbent crabgrass shoots for mowing","bury weed seed below germination depth","spread herbicidal salts over the turf","pull broadleaf weeds out by the roots"],"feedback":"Uplifted shoots could be mowed more easily.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q074","module":"M23","question":"Matting after vertical mowing serves to \"ribbon\" debris, which:","correct":"facilitates removal of the debris","options":["facilitates removal of the debris","buries the debris into the thatch","spreads the debris for mulching","grinds the debris into fine dust"],"feedback":"Seed can be left in place while debris is removed.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"}];const KEY='turf235_final_m23_23_textbook_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>Textbook cleared</h2><p>You retired all 29 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart Textbook from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
