const BANK=[{"id":"m23q001","module":"M23","question":"Which is NOT one of the five purposes of topdressing shown in the module's star diagram?","correct":"relieving soil compaction","options":["relieving soil compaction","controlling thatch","protecting greens in winter","promoting recovery"],"feedback":"The five: controlling thatch, smoothing surface, protecting greens in winter, changing the growth medium, promoting recovery.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q002","module":"M23","question":"The practice of topdressing originated to:","correct":"keep golf and bowling greens smooth","options":["keep golf and bowling greens smooth","control thatch buildup on golf fairways","protect greens from winter injury","change the root-zone soil texture"],"feedback":"Smoothing came first; other benefits were observed later.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q003","module":"M23","question":"Before specialized equipment, topdressing was applied with:","correct":"hand shovels","options":["hand shovels","steel mats","drop spreaders","brooms"],"feedback":"Manual application with shovels.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q004","module":"M23","question":"Non-uniform hand application of topdressing can result in:","correct":"differential wilting or localized dry spots","options":["differential wilting or localized dry spots","marcelling and scalping of the green","severe soil compaction beneath the coring holes","grain and stolon buildup on the green"],"feedback":"Plugs show the contrast between well and inadequately topdressed turf.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q005","module":"M23","question":"Specialized topdressing equipment is used mainly to ensure:","correct":"uniform application","options":["uniform application","deeper incorporation","faster green speeds","lower sand costs"],"feedback":"Uneven application caused dry spots.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q006","module":"M23","question":"Traditional topdressing preparation involves screening and blending loam or sandy loam soil, medium-to-coarse sand, and:","correct":"peat moss or other organic materials","options":["peat moss or other organic materials","crushed gravel or other coarse materials","lime or other pH-adjusting materials","clay or other fine-textured soils"],"feedback":"Three constituents screened and blended.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q007","module":"M23","question":"The sand component of a traditional topdressing blend is:","correct":"medium-to-coarse sand","options":["medium-to-coarse sand","very fine sand","gravel-sized sand","silty fine sand"],"feedback":"Blended with loam/sandy loam and peat moss.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q008","module":"M23","question":"Sand topdressing has become increasingly popular because of:","correct":"increased traffic stress and higher quality standards","options":["increased traffic stress and higher quality standards","lower sand prices and much easier application methods today","reduced thatch production in modern cultivars","the shortage of loam soils near golf courses"],"feedback":"An alternative to blended soil topdressing.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q009","module":"M23","question":"When topdressing immediately follows core cultivation, the remaining medium not in the holes may:","correct":"fill thatch pores or form a layer above the thatch","options":["fill thatch pores or form a layer above the thatch","wash completely out of the turf with irrigation","compact the soil at the very base of the coring holes","be collected and reused at the next application"],"feedback":"Part fills the holes; the rest goes into or onto the thatch.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q010","module":"M23","question":"Properly filling aerification channels with topdressing leads to:","correct":"quicker recovery of the turf","options":["quicker recovery of the turf","slower recovery of the turf","more thatch accumulation","reduced root growth in holes"],"feedback":"The filled holes stay visible until covered by adjacent growth.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q011","module":"M23","question":"The portion of topdressing that fills cultivation holes remains clearly evident until:","correct":"covered by growth of adjacent turfgrass plants","options":["covered by growth of adjacent turfgrass plants","the next core cultivation removes it again","it is washed out of the holes by heavy rain or irrigation","the green is matted with a heavy steel mat"],"feedback":"Most other topdressing is obscured by shoots and thatch.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q012","module":"M23","question":"In the turf-soil profile, the sand \"finger\" resulted from:","correct":"filling a cultivation hole with sand","options":["filling a cultivation hole with sand","a crack in the soil from drought","a root channel left by old grass","an earthworm burrow filled with sand"],"feedback":"Successive topdressings dramatically change the growth medium.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q013","module":"M23","question":"The thin soil layer above the lowermost sand layer in the profile probably resulted from:","correct":"reincorporating cores after sand topdressing began","options":["reincorporating cores after sand topdressing began","topdressing with soil before the green was built","a single heavy rain washing silt into the green","vertical mowing that pulled native soil up from far below"],"feedback":"Reincorporated cores after starting a sand program.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q014","module":"M23","question":"Once a sand topdressing program begins, soil cores from hollow-tine cultivation should be:","correct":"removed from the site before topdressing","options":["removed from the site before topdressing","reincorporated with a steel mat right away","left on the surface to break down naturally","mixed with the sand and spread back out"],"feedback":"Otherwise texturally different layers form.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q015","module":"M23","question":"Texturally different layers from mixing sand topdressing with reincorporated soil cores interfere with:","correct":"root growth and water and air movement","options":["root growth and water and air movement","mowing quality and the ball-roll distance on the green","fertilizer uptake through the leaves","seed germination on the surface only"],"feedback":"Layers seriously interfere with root growth and water and air movement.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q016","module":"M23","question":"Besides reincorporating soil cores, layering can also occur where sand is:","correct":"not effectively incorporated into the thatch","options":["not effectively incorporated into the thatch","applied at a light rate every week","matted in with brushes or smooth rakes","used to fill the holes left behind after core cultivation"],"feedback":"Sand sitting atop thatch forms its own layer.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q017","module":"M23","question":"The rate and number of topdressing applications are limited by:","correct":"the capacity of the turf to absorb the material","options":["the capacity of the turf to absorb the material","the size and capacity of the topdressing equipment used","the cost of sand in the local market","the number of core cultivations per year"],"feedback":"Too much prevents light from reaching leaves.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q018","module":"M23","question":"Excessive amounts of topdressing can lead to substantial turf loss by:","correct":"preventing light from reaching the leaves","options":["preventing light from reaching the leaves","raising the soil pH beyond optimal levels","introducing weed seeds into the green","compacting the soil beneath the thatch"],"feedback":"Light exclusion.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q019","module":"M23","question":"Which topdressing purposes require LARGE amounts of material?","correct":"smoothing big irregularities and changing root-zone soil","options":["smoothing big irregularities and changing root-zone soil","protecting greens in winter and promoting recovery","light thatch control and promoting the recovery from disease","marking spray areas and overseeding the green"],"feedback":"Both need frequent applications of considerable quantities.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q020","module":"M23","question":"Per the module's photo caption, the factor that may be most important in setting topdressing amount is:","correct":"turfgrass growth","options":["turfgrass growth","sand price","mowing height","green speed"],"feedback":"The amount depends on several factors, though growth may be most important.","source":"M23.2: Topdressing","kind":"module"}];const KEY='turf235_final_m23_23_2_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M23.2 cleared</h2><p>You retired all 20 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M23.2 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
