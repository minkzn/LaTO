<style>

</style><style>.subs{max-width:1050px;margin:12px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.subs a{text-decoration:none;color:#173f24;background:#fff;border:1px solid #c9d4ca;border-radius:999px;padding:6px 11px;font-weight:750;font-size:14px}.subs a span{color:#657167;font-weight:600}.subs a.on{background:#0d5722;color:#fff;border-color:#0d5722}.subs a.on span{color:#dce9df}</style></head><body><header><h1>M23.3 • 25 Questions</h1><p>M23.3: Topdressing (continued). TURF 235 final exam practice. Ten at a time. Correct questions retire; misses cycle back until you clear the module.</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="toolbar"><div class="row"><button class="primary" id="restart">Restart M23.3</button><button id="clear">Clear Saved Progress</button><a href="../index.html"><button>All Modules</button></a></div></div><nav class="subs"><a href="index.html">All M23 <span>74</span></a><a href="23-2.html">M23.2 <span>20</span></a><a href="23-3.html" class="on">M23.3 <span>25</span></a><a href="23-textbook.html">Textbook <span>29</span></a></nav><main><div class="stats"><div class="stat" id="remaining">Remaining: 25</div><div class="stat" id="mastered">Mastered: 0</div><div class="stat" id="misses">Misses: 0</div><div class="stat" id="batch">Batch: —</div></div><div id="quiz"></div><div class="actions"><button class="primary" id="submit">Submit 10</button><button class="primary" id="next" disabled>Next 10 →</button></div></main><script>
const BANK=[{"id":"m23q021","module":"M23","question":"For thatch control, the AMOUNT of topdressing sand depends on:","correct":"the amount of thatch present","options":["the amount of thatch present","the rate thatch is accumulating","the green speed wanted","the mowing height used"],"feedback":"Amount ↔ thatch present; frequency ↔ accumulation rate.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q022","module":"M23","question":"For thatch control, the FREQUENCY of topdressing depends on:","correct":"the rate thatch is accumulating","options":["the rate thatch is accumulating","the amount of thatch present","the sand particle size","the green speed wanted for upcoming tournament play"],"feedback":"Amount ↔ thatch present; frequency ↔ accumulation rate.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q023","module":"M23","question":"If topdressing rates and frequencies are too low:","correct":"excessive organic residue persists in the profile","options":["excessive organic residue persists in the profile","the thatchlike derivative becomes too firm to play","the green loses all of its resiliency over time","sand layers form on top of the compressed thatch"],"feedback":"Too little sand leaves too much thatch.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q024","module":"M23","question":"If too much sand is applied, the thatchlike derivative may lack:","correct":"resiliency and ball-holding capacity","options":["resiliency and ball-holding capacity","firmness and drainage capacity","water and nutrient retention","porosity and infiltration rates"],"feedback":"Too much sand makes the surface too hard.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q025","module":"M23","question":"Per the thatch-sand proportion diagram, more thatch relative to sand gives:","correct":"higher resiliency, but possibly too spongy","options":["higher resiliency, but possibly too spongy","lower resiliency, and a harder surface","higher resiliency, and better ball roll","lower resiliency, but better drainage"],"feedback":"Thatch bounces back but may be spongy.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q026","module":"M23","question":"Topdressed turfs are usually matted with:","correct":"a heavy steel mat","options":["a heavy steel mat","a lightweight roller","a vertical mower","a rotary mower"],"feedback":"Matting works the sand or soil into the turf.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q027","module":"M23","question":"Compared with a heavy steel mat, brushes for working in topdressing cause:","correct":"considerably less wear damage","options":["considerably less wear damage","considerably more wear damage","about the same wear damage","less damage but poor incorporation"],"feedback":"An alternative to steel mats.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q028","module":"M23","question":"Which method of working in topdressing causes the LEAST damage to turf?","correct":"smooth rakes","options":["smooth rakes","heavy steel mats","mounted brushes","chain-link fence"],"feedback":"Even less damage than brushes.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q029","module":"M23","question":"With sand topdressing on dense thatch, instead of migrating into the thatch pores, the sand may:","correct":"form a distinct layer atop the thatch","options":["form a distinct layer atop the thatch","dissolve into the organic matter quickly","wash down through the thatch completely","bind with the thatch into a single crust"],"feedback":"Especially in dense thatch such as a Penn A-4 green.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q030","module":"M23","question":"Sand is especially likely to form a layer atop the thatch where the thatch is:","correct":"relatively dense, as in Penn A-4 greens","options":["relatively dense, as in Penn A-4 greens","relatively thin, as in new USGA greens","relatively loose, as in Kentucky bluegrass","relatively dry, as in dormant bermudagrass"],"feedback":"Dense thatch resists sand infiltration.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q031","module":"M23","question":"The weight of a sand layer atop thatch:","correct":"compresses the thatch and reduces its porosity","options":["compresses the thatch and reduces its porosity","loosens the thatch and increases its overall porosity","has no effect on the thatch beneath it","speeds decomposition of the thatch layer"],"feedback":"The thatch becomes fine-textured relative to sand.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q032","module":"M23","question":"Relative to the topdressing sand, compressed thatch is a:","correct":"finer-textured medium","options":["finer-textured medium","coarser-textured medium","more porous medium","more resilient medium"],"feedback":"Compression reduces porosity.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q033","module":"M23","question":"Successive sand topdressings over dense thatch can create alternating layers of:","correct":"coarse sand and fine compressed thatch","options":["coarse sand and fine compressed thatch","fine sand and coarse loose thatch","coarse gravel and fine native soil","fine silt and coarse organic matter"],"feedback":"A texturally layered profile.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q034","module":"M23","question":"Alternating layers of sand and compressed thatch impede:","correct":"infiltration into and percolation through the green","options":["infiltration into and percolation through the green","root growth only in the topmost sand layer","green speed only, with no effect on water movement through it","fertilizer uptake by the leaves"],"feedback":"Texturally distinct layers impede water movement.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q035","module":"M23","question":"Layering from sand and compressed thatch can be avoided by:","correct":"a more frequent sand topdressing program","options":["a more frequent sand topdressing program","a less frequent but heavier sand program","switching to soil instead of sand","rolling the green after each topdressing"],"feedback":"Frequent light applications prevent distinct layers.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q036","module":"M23","question":"On a Penn A-4 green, topdressing should be conducted:","correct":"weekly","options":["weekly","monthly","twice a year","daily"],"feedback":"Dense thatch requires frequent topdressing.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q037","module":"M23","question":"Where sand and thatch layers have already formed, bypass drainage channels can be created by:","correct":"coring followed by heavy sand topdressing","options":["coring followed by heavy sand topdressing","rolling followed by light sand topdressing","spiking followed by wetting agents","matting followed by heavy irrigation"],"feedback":"The sand-filled holes pass through the layers.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q038","module":"M23","question":"An alternative to coring for existing layers is shallow vertical mowing to:","correct":"remove some thatch and open up the rest","options":["remove some thatch and open up the rest","compact the thatch for a firmer surface","bury the sand layer beneath the thatch","sever stolons and reduce grain on greens"],"feedback":"Facilitates subsequent sand incorporation.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q039","module":"M23","question":"In newly planted turfs, rolling is performed to:","correct":"firm the bed for good plant-soil contact","options":["firm the bed for good plant-soil contact","smooth out frost heaving in spring","increase green speed for play","press divots back into the soil"],"feedback":"Contact between planting material and soil.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q040","module":"M23","question":"In established turfs, rolling corrects minor surface disruptions and:","correct":"reestablishes soil contact with turf torn by play","options":["reestablishes soil contact with turf torn by play","removes thatch accumulated at the surface","increases water infiltration into the compacted surface soil","incorporates topdressing sand into thatch"],"feedback":"Sections loosened or torn by play.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q041","module":"M23","question":"Large, heavy rollers were commonly used in the Northeastern US to:","correct":"smooth fairways in spring","options":["smooth fairways in spring","firm greens in fall","press sod after harvest","flatten snow on greens"],"feedback":"A traditional practice later recognized as compacting.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q042","module":"M23","question":"Many traditional rolling practices were abandoned because of:","correct":"the severe soil compaction of heavy rolling","options":["the severe soil compaction of heavy rolling","the high cost of buying and running large rolling equipment","damage to irrigation pipes from rolling","the scalping caused by heavy rollers"],"feedback":"Recognized as turfgrass technology progressed.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q043","module":"M23","question":"Lightweight rolling of greens has enjoyed a resurgence since the:","correct":"1990s","options":["1990s","1940s","1960s","2010s"],"feedback":"Part of superintendents' success in maintaining fast putting speeds.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q044","module":"M23","question":"The success of many superintendents in maintaining fast putting speeds is attributable, in part, to:","correct":"a rolling program","options":["a rolling program","a heavy topdressing program","deep vertical mowing","core cultivation"],"feedback":"Lightweight rolling increases green speed.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q045","module":"M23","question":"Rolling can be done with a triplex greens mower by:","correct":"replacing the reel units with rollers","options":["replacing the reel units with rollers","raising the reels above the turf","removing the bedknives from the reels","adding ballast to the mower frame"],"feedback":"Interchangeable units.","source":"M23.3: Topdressing (continued)","kind":"module"}];const KEY='turf235_final_m23_23_3_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M23.3 cleared</h2><p>You retired all 25 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M23.3 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
