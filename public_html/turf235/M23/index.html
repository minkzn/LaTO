const BANK=[{"id":"m23q001","module":"M23","question":"Which is NOT one of the five purposes of topdressing shown in the module's star diagram?","correct":"relieving soil compaction","options":["relieving soil compaction","controlling thatch","protecting greens in winter","promoting recovery"],"feedback":"The five: controlling thatch, smoothing surface, protecting greens in winter, changing the growth medium, promoting recovery.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q002","module":"M23","question":"The practice of topdressing originated to:","correct":"keep golf and bowling greens smooth","options":["keep golf and bowling greens smooth","control thatch buildup on golf fairways","protect greens from winter injury","change the root-zone soil texture"],"feedback":"Smoothing came first; other benefits were observed later.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q003","module":"M23","question":"Before specialized equipment, topdressing was applied with:","correct":"hand shovels","options":["hand shovels","steel mats","drop spreaders","brooms"],"feedback":"Manual application with shovels.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q004","module":"M23","question":"Non-uniform hand application of topdressing can result in:","correct":"differential wilting or localized dry spots","options":["differential wilting or localized dry spots","marcelling and scalping of the green","severe soil compaction beneath the coring holes","grain and stolon buildup on the green"],"feedback":"Plugs show the contrast between well and inadequately topdressed turf.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q005","module":"M23","question":"Specialized topdressing equipment is used mainly to ensure:","correct":"uniform application","options":["uniform application","deeper incorporation","faster green speeds","lower sand costs"],"feedback":"Uneven application caused dry spots.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q006","module":"M23","question":"Traditional topdressing preparation involves screening and blending loam or sandy loam soil, medium-to-coarse sand, and:","correct":"peat moss or other organic materials","options":["peat moss or other organic materials","crushed gravel or other coarse materials","lime or other pH-adjusting materials","clay or other fine-textured soils"],"feedback":"Three constituents screened and blended.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q007","module":"M23","question":"The sand component of a traditional topdressing blend is:","correct":"medium-to-coarse sand","options":["medium-to-coarse sand","very fine sand","gravel-sized sand","silty fine sand"],"feedback":"Blended with loam/sandy loam and peat moss.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q008","module":"M23","question":"Sand topdressing has become increasingly popular because of:","correct":"increased traffic stress and higher quality standards","options":["increased traffic stress and higher quality standards","lower sand prices and much easier application methods today","reduced thatch production in modern cultivars","the shortage of loam soils near golf courses"],"feedback":"An alternative to blended soil topdressing.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q009","module":"M23","question":"When topdressing immediately follows core cultivation, the remaining medium not in the holes may:","correct":"fill thatch pores or form a layer above the thatch","options":["fill thatch pores or form a layer above the thatch","wash completely out of the turf with irrigation","compact the soil at the very base of the coring holes","be collected and reused at the next application"],"feedback":"Part fills the holes; the rest goes into or onto the thatch.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q010","module":"M23","question":"Properly filling aerification channels with topdressing leads to:","correct":"quicker recovery of the turf","options":["quicker recovery of the turf","slower recovery of the turf","more thatch accumulation","reduced root growth in holes"],"feedback":"The filled holes stay visible until covered by adjacent growth.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q011","module":"M23","question":"The portion of topdressing that fills cultivation holes remains clearly evident until:","correct":"covered by growth of adjacent turfgrass plants","options":["covered by growth of adjacent turfgrass plants","the next core cultivation removes it again","it is washed out of the holes by heavy rain or irrigation","the green is matted with a heavy steel mat"],"feedback":"Most other topdressing is obscured by shoots and thatch.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q012","module":"M23","question":"In the turf-soil profile, the sand \"finger\" resulted from:","correct":"filling a cultivation hole with sand","options":["filling a cultivation hole with sand","a crack in the soil from drought","a root channel left by old grass","an earthworm burrow filled with sand"],"feedback":"Successive topdressings dramatically change the growth medium.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q013","module":"M23","question":"The thin soil layer above the lowermost sand layer in the profile probably resulted from:","correct":"reincorporating cores after sand topdressing began","options":["reincorporating cores after sand topdressing began","topdressing with soil before the green was built","a single heavy rain washing silt into the green","vertical mowing that pulled native soil up from far below"],"feedback":"Reincorporated cores after starting a sand program.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q014","module":"M23","question":"Once a sand topdressing program begins, soil cores from hollow-tine cultivation should be:","correct":"removed from the site before topdressing","options":["removed from the site before topdressing","reincorporated with a steel mat right away","left on the surface to break down naturally","mixed with the sand and spread back out"],"feedback":"Otherwise texturally different layers form.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q015","module":"M23","question":"Texturally different layers from mixing sand topdressing with reincorporated soil cores interfere with:","correct":"root growth and water and air movement","options":["root growth and water and air movement","mowing quality and the ball-roll distance on the green","fertilizer uptake through the leaves","seed germination on the surface only"],"feedback":"Layers seriously interfere with root growth and water and air movement.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q016","module":"M23","question":"Besides reincorporating soil cores, layering can also occur where sand is:","correct":"not effectively incorporated into the thatch","options":["not effectively incorporated into the thatch","applied at a light rate every week","matted in with brushes or smooth rakes","used to fill the holes left behind after core cultivation"],"feedback":"Sand sitting atop thatch forms its own layer.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q017","module":"M23","question":"The rate and number of topdressing applications are limited by:","correct":"the capacity of the turf to absorb the material","options":["the capacity of the turf to absorb the material","the size and capacity of the topdressing equipment used","the cost of sand in the local market","the number of core cultivations per year"],"feedback":"Too much prevents light from reaching leaves.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q018","module":"M23","question":"Excessive amounts of topdressing can lead to substantial turf loss by:","correct":"preventing light from reaching the leaves","options":["preventing light from reaching the leaves","raising the soil pH beyond optimal levels","introducing weed seeds into the green","compacting the soil beneath the thatch"],"feedback":"Light exclusion.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q019","module":"M23","question":"Which topdressing purposes require LARGE amounts of material?","correct":"smoothing big irregularities and changing root-zone soil","options":["smoothing big irregularities and changing root-zone soil","protecting greens in winter and promoting recovery","light thatch control and promoting the recovery from disease","marking spray areas and overseeding the green"],"feedback":"Both need frequent applications of considerable quantities.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q020","module":"M23","question":"Per the module's photo caption, the factor that may be most important in setting topdressing amount is:","correct":"turfgrass growth","options":["turfgrass growth","sand price","mowing height","green speed"],"feedback":"The amount depends on several factors, though growth may be most important.","source":"M23.2: Topdressing","kind":"module"},{"id":"m23q021","module":"M23","question":"For thatch control, the AMOUNT of topdressing sand depends on:","correct":"the amount of thatch present","options":["the amount of thatch present","the rate thatch is accumulating","the green speed wanted","the mowing height used"],"feedback":"Amount ↔ thatch present; frequency ↔ accumulation rate.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q022","module":"M23","question":"For thatch control, the FREQUENCY of topdressing depends on:","correct":"the rate thatch is accumulating","options":["the rate thatch is accumulating","the amount of thatch present","the sand particle size","the green speed wanted for upcoming tournament play"],"feedback":"Amount ↔ thatch present; frequency ↔ accumulation rate.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q023","module":"M23","question":"If topdressing rates and frequencies are too low:","correct":"excessive organic residue persists in the profile","options":["excessive organic residue persists in the profile","the thatchlike derivative becomes too firm to play","the green loses all of its resiliency over time","sand layers form on top of the compressed thatch"],"feedback":"Too little sand leaves too much thatch.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q024","module":"M23","question":"If too much sand is applied, the thatchlike derivative may lack:","correct":"resiliency and ball-holding capacity","options":["resiliency and ball-holding capacity","firmness and drainage capacity","water and nutrient retention","porosity and infiltration rates"],"feedback":"Too much sand makes the surface too hard.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q025","module":"M23","question":"Per the thatch-sand proportion diagram, more thatch relative to sand gives:","correct":"higher resiliency, but possibly too spongy","options":["higher resiliency, but possibly too spongy","lower resiliency, and a harder surface","higher resiliency, and better ball roll","lower resiliency, but better drainage"],"feedback":"Thatch bounces back but may be spongy.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q026","module":"M23","question":"Topdressed turfs are usually matted with:","correct":"a heavy steel mat","options":["a heavy steel mat","a lightweight roller","a vertical mower","a rotary mower"],"feedback":"Matting works the sand or soil into the turf.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q027","module":"M23","question":"Compared with a heavy steel mat, brushes for working in topdressing cause:","correct":"considerably less wear damage","options":["considerably less wear damage","considerably more wear damage","about the same wear damage","less damage but poor incorporation"],"feedback":"An alternative to steel mats.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q028","module":"M23","question":"Which method of working in topdressing causes the LEAST damage to turf?","correct":"smooth rakes","options":["smooth rakes","heavy steel mats","mounted brushes","chain-link fence"],"feedback":"Even less damage than brushes.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q029","module":"M23","question":"With sand topdressing on dense thatch, instead of migrating into the thatch pores, the sand may:","correct":"form a distinct layer atop the thatch","options":["form a distinct layer atop the thatch","dissolve into the organic matter quickly","wash down through the thatch completely","bind with the thatch into a single crust"],"feedback":"Especially in dense thatch such as a Penn A-4 green.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q030","module":"M23","question":"Sand is especially likely to form a layer atop the thatch where the thatch is:","correct":"relatively dense, as in Penn A-4 greens","options":["relatively dense, as in Penn A-4 greens","relatively thin, as in new USGA greens","relatively loose, as in Kentucky bluegrass","relatively dry, as in dormant bermudagrass"],"feedback":"Dense thatch resists sand infiltration.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q031","module":"M23","question":"The weight of a sand layer atop thatch:","correct":"compresses the thatch and reduces its porosity","options":["compresses the thatch and reduces its porosity","loosens the thatch and increases its overall porosity","has no effect on the thatch beneath it","speeds decomposition of the thatch layer"],"feedback":"The thatch becomes fine-textured relative to sand.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q032","module":"M23","question":"Relative to the topdressing sand, compressed thatch is a:","correct":"finer-textured medium","options":["finer-textured medium","coarser-textured medium","more porous medium","more resilient medium"],"feedback":"Compression reduces porosity.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q033","module":"M23","question":"Successive sand topdressings over dense thatch can create alternating layers of:","correct":"coarse sand and fine compressed thatch","options":["coarse sand and fine compressed thatch","fine sand and coarse loose thatch","coarse gravel and fine native soil","fine silt and coarse organic matter"],"feedback":"A texturally layered profile.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q034","module":"M23","question":"Alternating layers of sand and compressed thatch impede:","correct":"infiltration into and percolation through the green","options":["infiltration into and percolation through the green","root growth only in the topmost sand layer","green speed only, with no effect on water movement through it","fertilizer uptake by the leaves"],"feedback":"Texturally distinct layers impede water movement.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q035","module":"M23","question":"Layering from sand and compressed thatch can be avoided by:","correct":"a more frequent sand topdressing program","options":["a more frequent sand topdressing program","a less frequent but heavier sand program","switching to soil instead of sand","rolling the green after each topdressing"],"feedback":"Frequent light applications prevent distinct layers.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q036","module":"M23","question":"On a Penn A-4 green, topdressing should be conducted:","correct":"weekly","options":["weekly","monthly","twice a year","daily"],"feedback":"Dense thatch requires frequent topdressing.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q037","module":"M23","question":"Where sand and thatch layers have already formed, bypass drainage channels can be created by:","correct":"coring followed by heavy sand topdressing","options":["coring followed by heavy sand topdressing","rolling followed by light sand topdressing","spiking followed by wetting agents","matting followed by heavy irrigation"],"feedback":"The sand-filled holes pass through the layers.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q038","module":"M23","question":"An alternative to coring for existing layers is shallow vertical mowing to:","correct":"remove some thatch and open up the rest","options":["remove some thatch and open up the rest","compact the thatch for a firmer surface","bury the sand layer beneath the thatch","sever stolons and reduce grain on greens"],"feedback":"Facilitates subsequent sand incorporation.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q039","module":"M23","question":"In newly planted turfs, rolling is performed to:","correct":"firm the bed for good plant-soil contact","options":["firm the bed for good plant-soil contact","smooth out frost heaving in spring","increase green speed for play","press divots back into the soil"],"feedback":"Contact between planting material and soil.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q040","module":"M23","question":"In established turfs, rolling corrects minor surface disruptions and:","correct":"reestablishes soil contact with turf torn by play","options":["reestablishes soil contact with turf torn by play","removes thatch accumulated at the surface","increases water infiltration into the compacted surface soil","incorporates topdressing sand into thatch"],"feedback":"Sections loosened or torn by play.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q041","module":"M23","question":"Large, heavy rollers were commonly used in the Northeastern US to:","correct":"smooth fairways in spring","options":["smooth fairways in spring","firm greens in fall","press sod after harvest","flatten snow on greens"],"feedback":"A traditional practice later recognized as compacting.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q042","module":"M23","question":"Many traditional rolling practices were abandoned because of:","correct":"the severe soil compaction of heavy rolling","options":["the severe soil compaction of heavy rolling","the high cost of buying and running large rolling equipment","damage to irrigation pipes from rolling","the scalping caused by heavy rollers"],"feedback":"Recognized as turfgrass technology progressed.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q043","module":"M23","question":"Lightweight rolling of greens has enjoyed a resurgence since the:","correct":"1990s","options":["1990s","1940s","1960s","2010s"],"feedback":"Part of superintendents' success in maintaining fast putting speeds.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q044","module":"M23","question":"The success of many superintendents in maintaining fast putting speeds is attributable, in part, to:","correct":"a rolling program","options":["a rolling program","a heavy topdressing program","deep vertical mowing","core cultivation"],"feedback":"Lightweight rolling increases green speed.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q045","module":"M23","question":"Rolling can be done with a triplex greens mower by:","correct":"replacing the reel units with rollers","options":["replacing the reel units with rollers","raising the reels above the turf","removing the bedknives from the reels","adding ballast to the mower frame"],"feedback":"Interchangeable units.","source":"M23.3: Topdressing (continued)","kind":"module"},{"id":"m23q046","module":"M23","question":"Rolling has enjoyed a resurgence on greens since the 1990s with:","correct":"relatively lightweight units","options":["relatively lightweight units","heavy water-ballast drums","tractor-drawn steel rollers","vibratory compaction plates"],"feedback":"Heavy rolling was abandoned once its compacting effects were recognized.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q047","module":"M23","question":"Rolling after planting ensures:","correct":"contact between soil and planting materials","options":["contact between soil and planting materials","faster germination of weed seed in the soil","deeper penetration of the irrigation water","removal of excess thatch from the surface"],"feedback":"Seed, stolons, sprigs, plugs, and sod.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q048","module":"M23","question":"In climates with freezing winters, rolling is used to:","correct":"press heaved turfgrasses back into the soil","options":["press heaved turfgrasses back into the soil","break up the thick ice layers that cover the turf in winter","remove snow mold from the leaf surface","firm the soil before snow cover arrives"],"feedback":"Otherwise heaved plants may desiccate or be scalped.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q049","module":"M23","question":"At the time of rolling, the soil should be:","correct":"moist but not wet","options":["moist but not wet","completely dry","saturated","frozen"],"feedback":"Dry soil resists pressing; wet soil compacts.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q050","module":"M23","question":"Sod growers often roll before harvest to:","correct":"ensure uniform sod thickness","options":["ensure uniform sod thickness","speed up the sod rooting","remove weeds from the field","improve the sod color"],"feedback":"Allows shallower cuts and lighter sod.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q051","module":"M23","question":"Rolling of greens is regarded as an alternative to:","correct":"ultra-low mowing heights for fast speeds","options":["ultra-low mowing heights for fast speeds","core cultivation for relieving soil compaction","topdressing for thatch control","vertical mowing for grain control"],"feedback":"Especially on sand-based greens that resist compaction.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q052","module":"M23","question":"The three basic types of rollers are drum rollers, triplex-attachment rollers, and:","correct":"dedicated greens rollers","options":["dedicated greens rollers","vibratory plow rollers","sheepsfoot rollers","water-filled lawn rollers"],"feedback":"Greens rollers were introduced in the early 1990s.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q053","module":"M23","question":"An advantage of triplex-attachment rollers is that:","correct":"no extra operator training is needed","options":["no extra operator training is needed","they are the heaviest rollers made","they do not compact soil at all","they double as vertical mowers for grain control"],"feedback":"They are operated like a triplex mowing unit.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q054","module":"M23","question":"Nikolai et al. (2001) found that lightweight rolling once or twice per week:","correct":"raised green speed for 24-48 hours","options":["raised green speed for 24-48 hours","raised soil bulk density sharply","reduced turf quality within weeks","reduced water infiltration rates"],"feedback":"Rolling four or more times per week could raise bulk density and reduce infiltration and quality.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q055","module":"M23","question":"Rolling four or more times per week could result in:","correct":"higher bulk density and lower infiltration","options":["higher bulk density and lower infiltration","lower bulk density and higher infiltration","no change in any soil property at all","faster green speed lasting a full week"],"feedback":"One or two rollings per week caused no significant change.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q056","module":"M23","question":"Ancillary benefits of rolling that have spurred fairway rolling include reduced:","correct":"dollar spot, moss, and black cutworms","options":["dollar spot, moss, and black cutworms","brown patch, algae, and white grub damage","pythium, crabgrass, and sod webworms","snow mold, clover, and mole crickets"],"feedback":"Bird activity associated with cutworms also declined.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q057","module":"M23","question":"Topdressing is believed to have originated specifically to:","correct":"smooth the playing surface of greens","options":["smooth the playing surface of greens","control thatch on fairways","protect greens in winter","change the root-zone soil"],"feedback":"Thatch reduction was observed later as a side effect.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q058","module":"M23","question":"Where a submerged layer of sand exists within a soil profile, the soil above it is often:","correct":"persistently wet, with restricted rooting","options":["persistently wet, with restricted rooting","droughty, with very deep rooting","droughty, with very deep rooting into the subsoil","compacted, with no change in moisture"],"feedback":"Even small differences among layers have significant adverse effects.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q059","module":"M23","question":"When starting a sand topdressing program, core reincorporation should wait until the sand depth exceeds:","correct":"the cultivator's maximum penetration depth","options":["the cultivator's maximum penetration depth","the depth of the thatch layer above the soil","one inch below the putting surface","the mowing height of the green"],"feedback":"Otherwise alternating sand and soil layers form.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q060","module":"M23","question":"Where the indigenous soil is favorable, the topdressing soil should be:","correct":"identical to it","options":["identical to it","sandier than it","finer than it","higher in organic matter"],"feedback":"Stockpile extra soil when building a new green.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q061","module":"M23","question":"The only difference between a construction soil and a topdressing soil is the amount of:","correct":"organic amendment","options":["organic amendment","sand","lime","fertilizer"],"feedback":"The turf generates enough organic residue on its own.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q062","module":"M23","question":"Which is NOT a listed concern over sand topdressing?","correct":"a softer playing surface","options":["a softer playing surface","continuing with sand indefinitely","more water and fertilizer needed","hydrophobic localized dry spots"],"feedback":"Sand layers give a HARDER playing surface.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q063","module":"M23","question":"A rule of thumb is to topdress for thatch control when the thatch layer becomes:","correct":"\"pencil thick\" (about 0.25 inch)","options":["\"pencil thick\" (about 0.25 inch)","\"finger thick\" (about 0.75 inch)","\"paper thin\" (about 0.01 inch)","\"thumb thick\" (about 1.0 inch)"],"feedback":"Then apply about 0.2 yd³/1000 ft², a layer about 0.0625 inch.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q064","module":"M23","question":"In the integrated topdressing soil-thatch medium, the thatch provides:","correct":"resiliency and aeration","options":["resiliency and aeration","firmness and nutrient retention","water retention and nutrients","firmness and water retention"],"feedback":"The soil provides firmness and water/nutrient retention.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q065","module":"M23","question":"Per O'Brien and Hartwiger (2003), light, moderate, and heavy sand topdressing rates are:","correct":"0.02, 0.07, and 0.15 yd³/1000 ft²","options":["0.02, 0.07, and 0.15 yd³/1000 ft²","0.2, 0.7, and 1.5 yd³/1000 ft²","0.01, 0.05, and 0.10 yd³/1000 ft²","0.05, 0.10, and 0.20 yd³/1000 ft²"],"feedback":"USGA Green Section rates.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q066","module":"M23","question":"For bentgrass/annual bluegrass greens, light topdressing rates should be used in:","correct":"summer","options":["summer","spring","fall","early spring"],"feedback":"Slow growth means slow organic matter accumulation; for bermudagrass, light rates go in spring and fall.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q067","module":"M23","question":"For bermudagrass greens, moderate topdressing rates are used in:","correct":"summer","options":["summer","spring","fall","winter"],"feedback":"When growth and organic matter accumulation are most rapid.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q068","module":"M23","question":"Total seasonal sand for topdressing plus filling HTC holes should be at least:","correct":"1.50 to 1.85 yd³/1000 ft²","options":["1.50 to 1.85 yd³/1000 ft²","0.15 to 0.20 yd³/1000 ft²","4.0 to 5.0 yd³/1000 ft²","0.50 to 0.60 yd³/1000 ft²"],"feedback":"About 4000-5000 lb/1000 ft², or a 0.5-0.6 inch depth.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q069","module":"M23","question":"Dust and particulate matter in sand topdressing can be managed by periodically:","correct":"coring and filling holes with clean sand","options":["coring and filling holes with clean sand","rolling the green with a heavy drum roller","applying wetting agents every few weeks","raising the mowing height for a season"],"feedback":"Or by topdressing often enough to dilute the particulates.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q070","module":"M23","question":"Years of topdressing can raise the level of a USGA green, making its surface:","correct":"droughty","options":["droughty","waterlogged","harder to mow","more shaded"],"feedback":"Compensate by coring and core removal.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q071","module":"M23","question":"Matting is usually necessary after topdressing to:","correct":"work soil off foliage and into the turf","options":["work soil off foliage and into the turf","remove thatch along with the excess topdressing soil","firm the surface for faster speeds","sever stolons and reduce grain"],"feedback":"Adhering soil would interfere with mowing and putting.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q072","module":"M23","question":"When soil cores are too wet for matting, the soil tends to:","correct":"smear","options":["smear","crumble","harden","blow away"],"feedback":"Too dry, and the cores are hard and bricklike.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q073","module":"M23","question":"Before modern herbicides, matting was used to:","correct":"lift decumbent crabgrass shoots for mowing","options":["lift decumbent crabgrass shoots for mowing","bury weed seed below germination depth","spread herbicidal salts over the turf","pull broadleaf weeds out by the roots"],"feedback":"Uplifted shoots could be mowed more easily.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"},{"id":"m23q074","module":"M23","question":"Matting after vertical mowing serves to \"ribbon\" debris, which:","correct":"facilitates removal of the debris","options":["facilitates removal of the debris","buries the debris into the thatch","spreads the debris for mulching","grinds the debris into fine dust"],"feedback":"Seed can be left in place while debris is removed.","source":"Textbook Ch. 6, pp. 201-207: Rolling, Topdressing, and Matting","kind":"enrichment"}];const KEY='turf235_final_m23_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M23 cleared</h2><p>You retired all 74 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M23 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
