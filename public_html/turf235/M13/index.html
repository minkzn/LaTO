eed produced from random crossing of:","correct":"three vegetatively propagated clonal strains","options":["three vegetatively propagated clonal strains","two seeded cultivars","five C-series cultivars","Seaside and Highland"],"feedback":"Penncross was first-generation seed from random crossing of three vegetatively propagated clonal strains.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q111","module":"M13","question":"Per the textbook, Penncross is classified among the ________-density, ________-growing creeping bentgrass cultivars.","correct":"low-density, prostrate-growing","options":["low-density, prostrate-growing","medium-density, upright-growing","high-density, upright-growing","high-density, prostrate-growing"],"feedback":"Penncross is the low-density, prostrate-growing type among creeping bentgrass cultivars.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q112","module":"M13","question":"Per the textbook, medium-density upright-growing creeping bentgrass cultivars include Brighton, Cato, Crenshaw, Pennlinks, and:","correct":"SR 1020","options":["SR 1020","Penn A-1","007","T-1"],"feedback":"SR 1020 is listed among the medium-density upright-growing creeping bentgrass cultivars.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q113","module":"M13","question":"Per the textbook, high-density upright-growing creeping bentgrass cultivars include 007, Pure Distinction, T-1, V8, and the:","correct":"Penn A- and G-series","options":["Penn A- and G-series","C-series","SR 7100 series","Alister and Allure series"],"feedback":"The Penn A- and G-series are among the high-density upright-growing creeping bentgrass cultivars.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q114","module":"M13","question":"Per the textbook, high-density creeping bentgrass cultivars are well adapted to mowing heights as low as:","correct":"0.125 inch or less","options":["0.125 inch or less","0.5 inch or less","0.8 inch or less","1.0 inch or less"],"feedback":"High-density creeping bentgrass cultivars tolerate mowing heights of 0.125 inch or less.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q115","module":"M13","question":"Per the textbook, colonial bentgrass is similar in appearance and adaptation to dryland bentgrass, but colonial is a tetraploid (28 chromosomes) while dryland bentgrass is a:","correct":"hexaploid (42 chromosomes)","options":["hexaploid (42 chromosomes)","diploid (14 chromosomes)","octoploid (56 chromosomes)","tetraploid as well (28 chromosomes)"],"feedback":"Dryland bentgrass is a hexaploid with 42 chromosomes, unlike colonial bentgrass's tetraploid 28.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q116","module":"M13","question":"Per the textbook, colonial bentgrass's poor heat and drought tolerance limits its use mainly to oceanic climates such as the U.S. Pacific Northwest, New England, northwestern Europe, and:","correct":"New Zealand","options":["New Zealand","South Africa","Australia's interior","the Mediterranean coast"],"feedback":"Colonial bentgrass is limited to oceanic climates including the Pacific Northwest, New England, northwestern Europe, and New Zealand.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q117","module":"M13","question":"Per the textbook, U.S. colonial bentgrass cultivars include Alister, Allure, Astoria, Bardot, and:","correct":"Duchess","options":["Duchess","Highland","Boral","Holfior"],"feedback":"Duchess is among the U.S. colonial bentgrass cultivars listed alongside Alister, Allure, Astoria, and Bardot.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q118","module":"M13","question":"Per the textbook, northern European breeding of colonial bentgrass produced the cultivars Holfior and:","correct":"Boral","options":["Boral","Highland","Duchess","Tracenta"],"feedback":"Holfior and Boral resulted from northern European colonial bentgrass breeding efforts.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q119","module":"M13","question":"Per the textbook, a common type of dryland bentgrass grown in the United States is:","correct":"Highland","options":["Highland","Exeter","Astoria","GolfStar"],"feedback":"Highland is a common U.S. dryland bentgrass type.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q120","module":"M13","question":"Per the textbook, Idaho bentgrass differs from colonial and dryland bentgrass in that its leaves are broader and darker, and it lacks rhizomes and:","correct":"false crowns","options":["false crowns","ligules","collars","auricles"],"feedback":"Idaho bentgrass lacks rhizomes and false crowns, unlike colonial and dryland bentgrass.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q121","module":"M13","question":"Per the textbook, Idaho bentgrass favors moist conditions and is commonly found along:","correct":"stream banks","options":["stream banks","sand dunes","desert washes","mountain ridgelines"],"feedback":"Idaho bentgrass favors moist conditions and is commonly found along stream banks.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q122","module":"M13","question":"Per the textbook, the single cultivar of Idaho bentgrass is:","correct":"GolfStar","options":["GolfStar","Highland","Exeter","Rudiger"],"feedback":"GolfStar is the single cultivar of Idaho bentgrass.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q123","module":"M13","question":"Per the textbook, velvet bentgrass is a diploid with how many chromosomes?","correct":"14 (2n = 2x = 14)","options":["14 (2n = 2x = 14)","28 (2n = 4x = 28)","42 (2n = 6x = 42)","56 (2n = 8x = 56)"],"feedback":"Velvet bentgrass is a diploid with 14 chromosomes, the lowest chromosome count among the bentgrasses in this module.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q124","module":"M13","question":"Per the textbook, compared with other bentgrasses, velvet bentgrass is more tolerant of shade, drought, and:","correct":"soil acidity","options":["soil acidity","high salinity","waterlogged soils","high fertility"],"feedback":"Velvet bentgrass is more tolerant of shade, drought, and soil acidity than other bentgrasses.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q125","module":"M13","question":"Per the textbook, the currently best velvet bentgrass cultivars are SR 7200, Vesper, and:","correct":"Greenwich","options":["Greenwich","Highland","Rudiger","Exeter"],"feedback":"SR 7200, Greenwich, and Vesper are the currently best velvet bentgrass cultivars per the textbook.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q126","module":"M13","question":"Per the textbook, velvet bentgrass's inflorescence is described as a reddish,:","correct":"spreading panicle","options":["spreading panicle","contracted panicle","flattened spike","cylindrical spike"],"feedback":"Velvet bentgrass's inflorescence is a reddish, spreading panicle.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q127","module":"M13","question":"Per the textbook's taxonomy discussion, redtop (Agrostis gigantea) has been identified by two different authorities, reflected in the alternate Latin name:","correct":"Agrostis alba L.","options":["Agrostis alba L.","Agrostis palustris Huds.","Agrostis trachyphylla","Agrostis rubra"],"feedback":"Redtop has been identified by the Latin names Agrostis gigantea Roth and Agrostis alba L., reflecting two different naming authorities.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q128","module":"M13","question":"Per the textbook's species description, redtop is a coarse-textured, grayish green, ________ species.","correct":"rhizomatous","options":["rhizomatous","stoloniferous","bunch-type","weakly creeping"],"feedback":"The textbook describes redtop as coarse-textured, grayish green, and rhizomatous.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q129","module":"M13","question":"Per the textbook, redtop was historically used as a component of cool-season turfgrass seed mixtures to promote:","correct":"rapid cover","options":["rapid cover","disease resistance","nitrogen fixation","drought tolerance"],"feedback":"Redtop was used in seed mixtures to promote rapid cover.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q130","module":"M13","question":"Per the textbook, redtop's use as a nursegrass is discouraged because of its highly competitive seedling growth and its unsightly appearance and:","correct":"persistence in new turfs","options":["persistence in new turfs","susceptibility to drought","low germination rate","poor cold tolerance"],"feedback":"Redtop's competitive seedling growth and unsightly, persistent patches discourage its use as a nursegrass.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q131","module":"M13","question":"Per the textbook, redtop is a hexaploid with how many chromosomes?","correct":"42 (2n = 6x = 42)","options":["42 (2n = 6x = 42)","28 (2n = 4x = 28)","14 (2n = 2x = 14)","56 (2n = 8x = 56)"],"feedback":"Redtop is a hexaploid with 42 chromosomes.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q132","module":"M13","question":"Per the textbook, redtop is intolerant of close mowing and needs a mowing height of at least:","correct":"1.5 to 2 inches","options":["1.5 to 2 inches","0.5 to 1 inch","0.125 to 0.5 inch","3 to 4 inches"],"feedback":"Redtop needs a mowing height of at least 1.5 to 2 inches to persist, matching its module page's range.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q133","module":"M13","question":"Per the textbook, redtop is occasionally used as a 'repair grass' for damaged or diseased greens, although ________ are generally preferred for that purpose.","correct":"fine fescues or ryegrasses","options":["fine fescues or ryegrasses","velvet or colonial bentgrass","Kentucky bluegrass cultivars","tall fescue cultivars"],"feedback":"Fine fescues or ryegrasses are generally preferred over redtop as repair grasses.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q134","module":"M13","question":"Per the textbook, the redtop cultivar Rudiger was released promising improved tolerance to drought, salinity, and:","correct":"alkalinity","options":["alkalinity","acidity","shade","disease"],"feedback":"Rudiger was released with improved tolerance to drought, salinity, and alkalinity.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q135","module":"M13","question":"Which bentgrass species has more chromosomes per the textbook: redtop (42) or velvet bentgrass (14)?","correct":"redtop","options":["redtop","velvet bentgrass","they are equal","neither has a reported chromosome count"],"feedback":"Redtop is a hexaploid (42 chromosomes), more than velvet bentgrass's diploid 14.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q136","module":"M13","question":"Which species has more chromosomes per the textbook: dryland bentgrass (42) or colonial bentgrass (28)?","correct":"dryland bentgrass","options":["dryland bentgrass","colonial bentgrass","they are equal","neither has a reported chromosome count"],"feedback":"Dryland bentgrass is a hexaploid (42 chromosomes), more than colonial bentgrass's tetraploid 28.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"},{"id":"m13q137","module":"M13","question":"Per the textbook's species descriptions, which is finer textured: velvet bentgrass or redtop?","correct":"velvet bentgrass","options":["velvet bentgrass","redtop","they are equally fine","neither description mentions texture"],"feedback":"Velvet bentgrass is described as very fine-textured, while redtop is described as coarse-textured.","source":"Textbook Ch. 3, pp. 68-70: Turfgrass Species","kind":"enrichment"}];const KEY='turf235_exam1_m13_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M13 cleared</h2><p>You retired all 137 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M13 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
