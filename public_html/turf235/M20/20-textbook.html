const BANK=[{"id":"m20q074","module":"M20","question":"ET proceeds at its maximum rate:","correct":"in summer","options":["in summer","in winter","in early spring","at night"],"feedback":"ET follows solar radiation.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q075","module":"M20","question":"Research supporting daily irrigation came from:","correct":"Michigan and Nebraska","options":["Michigan and Nebraska","Florida and Texas","California and Arizona","Pennsylvania and Ohio"],"feedback":"At proper rates.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q076","module":"M20","question":"TDR soil probes measure:","correct":"water content","options":["water content","soil tension","salinity","infiltration"],"feedback":"Electromagnetic pulse between two rods.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q077","module":"M20","question":"1 centibar equals:","correct":"1 kPa","options":["1 kPa","10 kPa","100 kPa","0.1 kPa"],"feedback":"Tensiometer units.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q078","module":"M20","question":"In lawns without heavy traffic, irrigation can be scheduled by:","correct":"wilt symptoms","options":["wilt symptoms","calendar dates","pan readings only","golfer complaints"],"feedback":"Shiny purplish leaves.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q079","module":"M20","question":"A main reason to avoid midday summer irrigation is:","correct":"scald risk","options":["scald risk","frost risk","lower evaporation","deeper rooting"],"feedback":"Also evaporation losses and interference with play.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q080","module":"M20","question":"Nighttime irrigation is more efficient because:","correct":"less water evaporates","options":["less water evaporates","night water is colder","pressure is higher","turf absorbs only at night"],"feedback":"Also calmer winds.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q081","module":"M20","question":"On athletic fields, water should be withheld before a game for at least:","correct":"1 day","options":["1 day","1 hour","1 week","1 month"],"feedback":"Wet soil compacts more easily.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q082","module":"M20","question":"Compacted fine-textured soils may have an IC of about:","correct":"0.1 inch/hour","options":["0.1 inch/hour","1 inch/hour","5 inches/hour","0.6 inch/hour"],"feedback":"Systems apply 0.3–0.6 in/hr.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q083","module":"M20","question":"In the multiple-cycling example, four 10-min runs 50 min apart give an effective PR of about:","correct":"0.10 in/hr","options":["0.10 in/hr","0.5 in/hr","0.33 in/hr","1.0 in/hr"],"feedback":"Same 0.33 inch over 190 minutes.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q084","module":"M20","question":"Midday wilt despite moist soil is most common with:","correct":"bentgrasses","options":["bentgrasses","tall fescue","bermudagrass","zoysiagrass"],"feedback":"Especially closely mowed.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q085","module":"M20","question":"Early-morning syringing has largely replaced:","correct":"poling greens","options":["poling greens","hand watering","topdressing","core aeration"],"feedback":"It speeds foliage drying.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q086","module":"M20","question":"The textbook's EC classes come from the:","correct":"Australian Water Authority","options":["Australian Water Authority","U.S. Department of Agriculture","USGA Green Section","Penn State Extension"],"feedback":"The module page uses USDA classes.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q087","module":"M20","question":"Soil-extract EC (ECe) is often how many times irrigation-water EC?","correct":"2–10","options":["2–10","0.5","100","exactly 1"],"feedback":"Plants absorb water faster than ions.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q088","module":"M20","question":"With ECw 1.8 dS/m and bentgrass (threshold ECe 3.7), the leaching requirement is:","correct":"10.8%","options":["10.8%","1.8%","37%","48.6%"],"feedback":"100 × 1.8 ÷ (5 × 3.7 − 1.8).","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q089","module":"M20","question":"Water with an RSC above 2.5 mEq/L is:","correct":"unsuitable","options":["unsuitable","ideal","low hazard","moderate hazard"],"feedback":"Ca and Mg precipitate, leaving Na.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q090","module":"M20","question":"Bicarbonates in water can be neutralized with:","correct":"gypsum or sulfuric acid","options":["gypsum or sulfuric acid","lime or potash","urea or ammonium sulfate","sodium chloride"],"feedback":"RSC × 234 lb gypsum/acre-ft.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q091","module":"M20","question":"Boron in irrigation water may be toxic above:","correct":"1 ppm","options":["1 ppm","10 ppm","100 ppm","0.01 ppm"],"feedback":"Check water sources.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q092","module":"M20","question":"High sulfate in water can contribute to:","correct":"black layer","options":["black layer","dollar spot","frost heaving","fairy ring"],"feedback":"Under anaerobic conditions.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q093","module":"M20","question":"A fourth irrigation source of growing importance is:","correct":"municipal effluent","options":["municipal effluent","seawater","glacier melt","bottled water"],"feedback":"Besides wells, ponds, and rivers.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q094","module":"M20","question":"Impact-drive sprinklers rotate using:","correct":"a spring-loaded arm","options":["a spring-loaded arm","a gear train","an electric motor","a solenoid"],"feedback":"Gear drives use a rotor and gear train.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q095","module":"M20","question":"Pumps in parallel provide:","correct":"additive flow","options":["additive flow","additive pressure","half the flow","no flow"],"feedback":"Pumps in series add pressure.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q096","module":"M20","question":"In normally closed hydraulic valves, tube pressure:","correct":"opens the valve","options":["opens the valve","closes the valve","has no effect","drains the line"],"feedback":"Normally open: pressure closes.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q097","module":"M20","question":"SSDI emitters typically operate at:","correct":"15–35 psi","options":["15–35 psi","60–100 psi","1–5 psi","150 psi"],"feedback":"Lines 6–12 in deep, 12–18 in apart.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"},{"id":"m20q098","module":"M20","question":"A principal disadvantage of SSDI is:","correct":"emitter clogging","options":["emitter clogging","wind drift","high evaporation","vandalism"],"feedback":"From roots and soil ingestion.","source":"Textbook Ch. 5, pp. 170-190: Irrigation","kind":"enrichment"}];const KEY='turf235_exam2_m20_20_textbook_v2';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>Textbook cleared</h2><p>You retired all 25 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart Textbook from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
