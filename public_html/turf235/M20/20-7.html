const BANK=[{"id":"m20q053","module":"M20","question":"As a sprinkler rotates, area covered per distance interval:","correct":"increases outward","options":["increases outward","decreases outward","stays constant","is zero at the edge"],"feedback":"So water per area decreases outward.","source":"M20.7: Water Distribution","kind":"module"},{"id":"m20q054","module":"M20","question":"Water delivered by a rotating sprinkler is greatest:","correct":"near the head","options":["near the head","at the edge of the throw","midway out","beyond the throw"],"feedback":"Wedge-shaped distribution.","source":"M20.7: Water Distribution","kind":"module"},{"id":"m20q055","module":"M20","question":"In Table 20.7.1, 5 ft from the head receives about:","correct":"8.8 moisture units","options":["8.8 moisture units","3.0 moisture units","1.8 moisture units","1.0 moisture unit"],"feedback":"25 ft receives 1.0.","source":"M20.7: Water Distribution","kind":"module"},{"id":"m20q056","module":"M20","question":"The decline in water from head to edge gives a pattern that is:","correct":"wedge-shaped","options":["wedge-shaped","donut-shaped","erratic","rectangular"],"feedback":"Confirmed with collection cans.","source":"M20.7: Water Distribution","kind":"module"},{"id":"m20q057","module":"M20","question":"In Table 20.7.2, catch cans collected 115 units at 5 ft and:","correct":"10 at 55 ft","options":["10 at 55 ft","100 at 55 ft","60 at 55 ft","0 at 55 ft"],"feedback":"Steady decline outward.","source":"M20.7: Water Distribution","kind":"module"}];const KEY='turf235_exam2_m20_20_7_v2';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M20.7 cleared</h2><p>You retired all 5 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M20.7 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
