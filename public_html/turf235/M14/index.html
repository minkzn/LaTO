const BANK=[{"id":"m14q001","module":"M14","question":"The chloridoid species (bermudagrasses, zoysiagrasses, and buffalograss) are important for sports, lawn, and utility turfs in at least the southern half of the United States, as well as in:","correct":"subtropical and tropical climates throughout the world","options":["subtropical and tropical climates throughout the world","polar and subarctic climates throughout the world","temperate oceanic climates only","cool continental climates only"],"feedback":"Chloridoid species are important across the southern half of the U.S. and in subtropical and tropical climates worldwide.","source":"M14.1: Overview","kind":"module"},{"id":"m14q002","module":"M14","question":"In Florida's warm-subtropical-humid and tropical climates, ________ substitutes for the bentgrasses used in colder climates on greens and other golf turfs.","correct":"hybrid bermudagrass","options":["hybrid bermudagrass","zoysiagrass","buffalograss","common bermudagrass"],"feedback":"Hybrid bermudagrass substitutes for bentgrasses on Florida golf turfs.","source":"M14.1: Overview","kind":"module"},{"id":"m14q003","module":"M14","question":"In St. Louis' cool-subtropical-humid climate, ________ is an important species for fairway turfs.","correct":"zoysiagrass","options":["zoysiagrass","hybrid bermudagrass","buffalograss","creeping bentgrass"],"feedback":"Zoysiagrass is an important fairway species in St. Louis' cool-subtropical-humid climate.","source":"M14.1: Overview","kind":"module"},{"id":"m14q004","module":"M14","question":"With the commercial development of several new cultivars, ________ is becoming a popular turfgrass species, especially in dry climates throughout the United States.","correct":"buffalograss","options":["buffalograss","zoysiagrass","hybrid bermudagrass","common bermudagrass"],"feedback":"New cultivars have made buffalograss an increasingly popular species in dry U.S. climates.","source":"M14.1: Overview","kind":"module"},{"id":"m14q005","module":"M14","question":"The purpose of Module 14 is to review which three turfgrass groups?","correct":"Bermudagrasses, Zoysiagrasses, and Buffalograss","options":["Bermudagrasses, Zoysiagrasses, and Buffalograss","Bentgrasses, Fescues, and Ryegrasses","Bluegrasses, Fescues, and Bentgrasses","Zoysiagrasses, Centipedegrass, and St. Augustinegrass"],"feedback":"Module 14 reviews bermudagrasses, zoysiagrasses, and buffalograss.","source":"M14.1: Overview","kind":"module"},{"id":"m14q006","module":"M14","question":"The assigned textbook reading for Module 14 covers Chapter 3, pages:","correct":"74-77, 83","options":["74-77, 83","68-70","61-64","78-82"],"feedback":"Module 14's reading is Turfgrass Management, Chapter 3, pages 74-77 and 83.","source":"M14.1: Overview","kind":"module"},{"id":"m14q007","module":"M14","question":"The most widely used bermudagrass species, Cynodon dactylon, is a tetraploid with how many chromosomes?","correct":"36","options":["36","18","27","40"],"feedback":"Cynodon dactylon (common bermudagrass) is a tetraploid with 36 chromosomes.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q008","module":"M14","question":"Cynodon dactylon is usually referred to as:","correct":"common bermudagrass","options":["common bermudagrass","African bermudagrass","hybrid bermudagrass","Magennis bermudagrass"],"feedback":"Cynodon dactylon is usually called common bermudagrass.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q009","module":"M14","question":"Cynodon transvaalensis, a diploid with 18 chromosomes that is little used directly, is called:","correct":"African bermudagrass","options":["African bermudagrass","common bermudagrass","Magennis bermudagrass","hybrid bermudagrass"],"feedback":"Cynodon transvaalensis, a diploid with 18 chromosomes, is called African bermudagrass.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q010","module":"M14","question":"When Cynodon transvaalensis is crossed with Cynodon dactylon, it forms a sterile hybrid with how many chromosomes?","correct":"27","options":["27","18","36","40"],"feedback":"The cross of C. transvaalensis and C. dactylon forms a sterile hybrid with 27 chromosomes.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q011","module":"M14","question":"The sterile hybrid formed by crossing Cynodon dactylon with Cynodon transvaalensis is called:","correct":"hybrid bermudagrass","options":["hybrid bermudagrass","common bermudagrass","African bermudagrass","dryland bermudagrass"],"feedback":"The Cynodon dactylon x C. transvaalensis cross is called hybrid bermudagrass.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q012","module":"M14","question":"Because African bermudagrass forms a more compact plant with short internodes, hybrid bermudagrass reflects this characteristic because African bermudagrass is one of its:","correct":"parents","options":["parents","diseases","competitors","nurse grasses"],"feedback":"Hybrid bermudagrass reflects African bermudagrass's compact growth because African bermudagrass is one of its parent species.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q013","module":"M14","question":"Where the hybrid of Cynodon dactylon and C. transvaalensis occurs naturally, it is called:","correct":"Magennis bermudagrass (Cynodon magennisii)","options":["Magennis bermudagrass (Cynodon magennisii)","common bermudagrass (Cynodon dactylon)","African bermudagrass (Cynodon transvaalensis)","dryland bermudagrass"],"feedback":"The naturally occurring version of this hybrid is called Magennis bermudagrass.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q014","module":"M14","question":"Because sterile hybrids of bermudagrass do not produce viable seeds, they must be:","correct":"propagated vegetatively","options":["propagated vegetatively","propagated by seed only","grown from spores","grafted onto rootstock"],"feedback":"Sterile bermudagrass hybrids, lacking viable seed, must be propagated vegetatively.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q015","module":"M14","question":"Per its module page, the Latin name of common bermudagrass is:","correct":"Cynodon dactylon [L.]","options":["Cynodon dactylon [L.]","Cynodon transvaalensis","Cynodon magennisii","Buchloe dactyloides"],"feedback":"Common bermudagrass's species page gives its Latin name as Cynodon dactylon [L.].","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q016","module":"M14","question":"Per its module page, the ligule on common bermudagrass is:","correct":"a fringe of hairs, 2 to 5 mm long","options":["a fringe of hairs, 2 to 5 mm long","a fringe of hairs, 1 to 3 mm long","a fringe of hairs, 0.5 to 1 mm long","membranous, 2 to 5 mm long"],"feedback":"Common bermudagrass's ligule is a fringe of hairs, 2 to 5 mm long.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q017","module":"M14","question":"The preferred mowing height for common bermudagrass is:","correct":"1.0 - 2.0 inches","options":["1.0 - 2.0 inches","3/16 - 3/4 inches","0.5 - 1.0 inches","0.5 - 0.75 inches"],"feedback":"Common bermudagrass is best mowed at 1.0 to 2.0 inches.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q018","module":"M14","question":"The preferred fertilization rate for common bermudagrass is:","correct":"2.0 - 5.0 lb. N / K ft² / year","options":["2.0 - 5.0 lb. N / K ft² / year","3.0 - 10.0 lb. N / K ft² / year","1.5 - 3.0 lb. N / K ft² / year","0.5 - 2.0 lb. N / K ft² / year"],"feedback":"Common bermudagrass's preferred fertilization rate is 2.0 to 5.0 lb N/K ft²/year.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q019","module":"M14","question":"The preferred irrigation amount for common bermudagrass is:","correct":"varies with cultural intensity","options":["varies with cultural intensity","frequently used","minimal or no irrigation","as needed to sustain growth and color"],"feedback":"Common bermudagrass's irrigation needs vary with cultural intensity.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q020","module":"M14","question":"On golf greens, common bermudagrass is rated:","correct":"not well adapted","options":["not well adapted","adapted","well adapted","not suitable"],"feedback":"Common bermudagrass is not well adapted for golf greens.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q021","module":"M14","question":"On golf tees, common bermudagrass is rated:","correct":"adapted","options":["adapted","not well adapted","not suitable","overseeding only"],"feedback":"Common bermudagrass is adapted for golf tees.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q022","module":"M14","question":"On golf fairways, common bermudagrass is rated:","correct":"adapted","options":["adapted","not well adapted","not suitable","overseeding only"],"feedback":"Common bermudagrass is adapted for golf fairways.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q023","module":"M14","question":"On golf roughs, common bermudagrass is rated:","correct":"adapted","options":["adapted","not well adapted","not suitable","overseeding only"],"feedback":"Common bermudagrass is adapted for golf roughs.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q024","module":"M14","question":"For athletic turf, common bermudagrass is rated:","correct":"well adapted","options":["well adapted","not well adapted","not suitable","marginally adapted"],"feedback":"Common bermudagrass is well adapted for athletic turf.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q025","module":"M14","question":"For lawn turf, common bermudagrass can be adapted to:","correct":"sunny locations of culture","options":["sunny locations of culture","shaded locations of culture","only intensively cultured lawns","only unmowed ground covers"],"feedback":"Common bermudagrass can be adapted to sunny locations for lawn culture.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q026","module":"M14","question":"For utility turf, common bermudagrass is rated:","correct":"adaptable","options":["adaptable","not well adapted","not suitable","ideal only in shade"],"feedback":"Common bermudagrass is adaptable for utility turf.","source":"M14.2: Bermudagrasses","kind":"module"},{"id":"m14q027","module":"M14","question":"The Latin name of hybrid bermudagrass is:","correct":"Cynodon dactylon X C. transvaalensis","options":["Cynodon dactylon X C. transvaalensis","Cynodon dactylon [L.]","Cynodon magennisii","Buchloe dactyloides"],"feedback":"Hybrid bermudagrass is the cross Cynodon dactylon X C. transvaalensis.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q028","module":"M14","question":"Per its module page, the ligule on hybrid bermudagrass is a fringe of hairs, 1 to 3 mm long, and its auricles are:","correct":"absent","options":["absent","short and blunt","long and clasping","present but reduced"],"feedback":"Hybrid bermudagrass's ligule is a fringe of hairs 1-3mm long, with auricles absent.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q029","module":"M14","question":"The preferred mowing height for hybrid bermudagrass is:","correct":"3/16 - 3/4 inches","options":["3/16 - 3/4 inches","1.0 - 2.0 inches","0.5 - 1.0 inches","0.5 - 0.75 inches"],"feedback":"Hybrid bermudagrass is best mowed at 3/16 to 3/4 inches, lower than common bermudagrass.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q030","module":"M14","question":"The preferred fertilization rate for hybrid bermudagrass is:","correct":"3.0 - 10.0 lb. N / K ft² / year","options":["3.0 - 10.0 lb. N / K ft² / year","2.0 - 5.0 lb. N / K ft² / year","1.5 - 3.0 lb. N / K ft² / year","0.5 - 2.0 lb. N / K ft² / year"],"feedback":"Hybrid bermudagrass's preferred fertilization rate is 3.0 to 10.0 lb N/K ft²/year, higher than common bermudagrass.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q031","module":"M14","question":"The preferred irrigation amount for hybrid bermudagrass is:","correct":"frequently used","options":["frequently used","varies with cultural intensity","minimal or no irrigation","as needed to sustain growth and color"],"feedback":"Hybrid bermudagrass is irrigated frequently.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q032","module":"M14","question":"'Other' cultural practices for hybrid bermudagrass are described as many, especially on:","correct":"greens","options":["greens","roughs","utility turf","lawns"],"feedback":"Hybrid bermudagrass requires many cultural practices, especially on greens.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q033","module":"M14","question":"On golf greens, hybrid bermudagrass is rated:","correct":"adapted","options":["adapted","not well adapted","not suitable","overseeding only"],"feedback":"Hybrid bermudagrass is adapted for golf greens, unlike common bermudagrass.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q034","module":"M14","question":"On golf tees, hybrid bermudagrass is rated:","correct":"adapted","options":["adapted","not well adapted","not suitable","overseeding only"],"feedback":"Hybrid bermudagrass is adapted for golf tees.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q035","module":"M14","question":"On golf fairways, hybrid bermudagrass is rated:","correct":"adapted","options":["adapted","not well adapted","not suitable","overseeding only"],"feedback":"Hybrid bermudagrass is adapted for golf fairways.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q036","module":"M14","question":"On golf roughs, hybrid bermudagrass is rated:","correct":"not well adapted","options":["not well adapted","adapted","well adapted","not suitable"],"feedback":"Hybrid bermudagrass is not well adapted for golf roughs, unlike common bermudagrass.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q037","module":"M14","question":"For athletic turf, hybrid bermudagrass is rated:","correct":"well adapted","options":["well adapted","not well adapted","not suitable","marginally adapted"],"feedback":"Hybrid bermudagrass is well adapted for athletic turf.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q038","module":"M14","question":"For lawn turf, hybrid bermudagrass can be adapted to sunny locations, but requires:","correct":"a high intensity of culture","options":["a high intensity of culture","a low intensity of culture","no irrigation at all","shaded conditions"],"feedback":"Hybrid bermudagrass can be adapted to sunny lawn locations but requires a high intensity of culture.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q039","module":"M14","question":"For utility turf, hybrid bermudagrass is rated:","correct":"not adaptable","options":["not adaptable","well adapted","adaptable","ideal"],"feedback":"Hybrid bermudagrass is not adaptable for utility turf.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q040","module":"M14","question":"For wintertime play, hybrid bermudagrass greens are often overseeded with cool-season turfgrasses such as:","correct":"perennial ryegrass","options":["perennial ryegrass","tall fescue","hard fescue","Kentucky bluegrass"],"feedback":"Hybrid bermudagrass greens are commonly overseeded with perennial ryegrass for winter play and color.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q041","module":"M14","question":"Besides perennial ryegrass, other grasses used to overseed bermudagrass include annual ryegrass, intermediate ryegrass, rough bluegrass, fine fescues, and:","correct":"creeping bentgrass","options":["creeping bentgrass","buffalograss","zoysiagrass","centipedegrass"],"feedback":"Creeping bentgrass is among the grasses used to overseed dormant bermudagrass, alongside the ryegrasses, rough bluegrass, and fine fescues.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q042","module":"M14","question":"The overseeded grasses on a dormant bermudagrass green provide a favorable playing surface and protect the bermudagrass from:","correct":"wear injury","options":["wear injury","disease","drought stress","nitrogen deficiency"],"feedback":"Overseeded cool-season grasses protect dormant bermudagrass from wear injury during winter play.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q043","module":"M14","question":"Comparing a hybrid bermudagrass collar to a green, density, texture, and growth habit are profoundly influenced by:","correct":"the mowing height difference","options":["the mowing height difference","the fertilization difference","the irrigation difference","the soil pH difference"],"feedback":"The mowing height difference between collar and green profoundly affects density, texture, and growth habit.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q044","module":"M14","question":"Above greens height, the strongly stoloniferous growth of bermudagrass is evident in:","correct":"the lateral orientation of the shoots","options":["the lateral orientation of the shoots","the vertical orientation of the shoots","a complete absence of shoots","a change in leaf color"],"feedback":"Above greens height, bermudagrass's strongly stoloniferous growth shows in the lateral orientation of its shoots.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q045","module":"M14","question":"Where hybrid bermudagrass collars surround creeping bentgrass greens, bermudagrass stolons typically invade the greens unless prevented by:","correct":"installed plastic barriers","options":["installed plastic barriers","frequent fungicide applications","deep-tine aerification","increased mowing height"],"feedback":"Plastic barriers are installed to keep invasive bermudagrass stolons out of bentgrass greens.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q046","module":"M14","question":"Hybrid bermudagrass is well adapted for use on tees because of its wear tolerance and:","correct":"excellent recuperative capacity","options":["excellent recuperative capacity","low fertility requirement","shade tolerance","cold tolerance"],"feedback":"Hybrid bermudagrass's wear tolerance and excellent recuperative capacity suit it to tee use.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q047","module":"M14","question":"Hybrid bermudagrass is prone to scalp, especially during:","correct":"the summer months when growth is vigorous and thatch is likely to form","options":["the summer months when growth is vigorous and thatch is likely to form","the winter months during dormancy","periods of drought stress","periods of heavy shade"],"feedback":"Hybrid bermudagrass scalps most in summer, when vigorous growth promotes thatch formation.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q048","module":"M14","question":"Successful thatch-control practices that can reduce hybrid bermudagrass scalping include topdressing, coring followed by soil core reincorporation or topdressing, and:","correct":"vertical mowing","options":["vertical mowing","deep irrigation","heavy fall fertilization","reduced mowing frequency"],"feedback":"Topdressing, coring with reincorporation, and vertical mowing all help control thatch and reduce scalping.","source":"M14.3: Hybrid Bermudagrass","kind":"module"},{"id":"m14q049","module":"M14","question":"The three primary zoysiagrass species are Japanese lawngrass (Zoysia japonica), manilagrass (Zoysia matrella), and:","correct":"mascarenegrass (Zoysia pacifica)","options":["mascarenegrass (Zoysia pacifica)","common zoysiagrass (Zoysia communis)","hybrid zoysiagrass (Zoysia hybrida)","dwarf zoysiagrass (Zoysia nana)"],"feedback":"Japanese lawngrass, manilagrass, and mascarenegrass are the three primary zoysiagrass species.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q050","module":"M14","question":"Of the three zoysiagrass species, which has the coarsest texture?","correct":"Japanese lawngrass","options":["Japanese lawngrass","manilagrass","mascarenegrass","all three are equally coarse"],"feedback":"Japanese lawngrass has the coarsest texture of the three zoysiagrass species.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q051","module":"M14","question":"Of the three zoysiagrass species, which has intermediate texture?","correct":"manilagrass","options":["manilagrass","Japanese lawngrass","mascarenegrass","none are intermediate"],"feedback":"Manilagrass has intermediate texture among the three zoysiagrass species.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q052","module":"M14","question":"Of the three zoysiagrass species, which has the finest texture?","correct":"mascarenegrass","options":["mascarenegrass","Japanese lawngrass","manilagrass","all three are equally fine"],"feedback":"Mascarenegrass has the finest texture of the three zoysiagrass species.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q053","module":"M14","question":"Per its module page, the three zoysiagrass species are all tetraploids with how many chromosomes?","correct":"40","options":["40","36","27","18"],"feedback":"Japanese lawngrass, manilagrass, and mascarenegrass are all tetraploids with 40 chromosomes.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q054","module":"M14","question":"Because the three zoysiagrass species easily interbreed, many zoysiagrasses are actually:","correct":"interspecific hybrids or combinations of these species","options":["interspecific hybrids or combinations of these species","completely sterile and non-reproducing","unrelated genetically","identical to one another"],"feedback":"Zoysiagrasses easily interbreed, so many are actually interspecific hybrids or combinations of the three species.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q055","module":"M14","question":"It's more accurate to call a particular zoysiagrass an interspecific hybrid if it exhibits qualities that are:","correct":"intermediate between two species","options":["intermediate between two species","identical to one parent species only","absent from all three species","unrelated to any known species"],"feedback":"A zoysiagrass is best called an interspecific hybrid when its qualities fall intermediate between two species.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q056","module":"M14","question":"Zoysia pacifica is used mostly as a ground cover on sites where:","correct":"regular mowing is impractical","options":["regular mowing is impractical","irrigation is unavailable","soil is highly acidic","traffic is heaviest"],"feedback":"Zoysia pacifica is used mostly as ground cover on sloping sites where regular mowing is impractical.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q057","module":"M14","question":"Besides use as a ground cover, Zoysia pacifica is also used as a parent in crossing with either japonica or matrella to form:","correct":"hybrid zoysiagrasses","options":["hybrid zoysiagrasses","hybrid bermudagrasses","improved buffalograss cultivars","centipedegrass cultivars"],"feedback":"Zoysia pacifica serves as a parent species for hybrid zoysiagrasses.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q058","module":"M14","question":"Zoysiagrasses are generally slow to establish, but vary widely in:","correct":"their rate of spread among different cultivars","options":["their rate of spread among different cultivars","their chromosome number","their cold tolerance only","their need for nitrogen"],"feedback":"Zoysiagrasses establish slowly overall, but cultivars vary widely in spread rate.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q059","module":"M14","question":"Per its module page, the Latin name of common zoysiagrass is given as:","correct":"Zoysia spp.","options":["Zoysia spp.","Zoysia japonica","Zoysia matr ,"source":"M14.6: Buffalograss","kind":"module"},{"id":"m14q112","module":"M14","question":"A hexaploid buffalograss plant can have up to how many different alleles at a single gene locus?","correct":"six","options":["six","four","two","three"],"feedback":"Hexaploids can carry up to six different alleles at a single locus.","source":"M14.6: Buffalograss","kind":"module"},{"id":"m14q113","module":"M14","question":"Higher ploidy levels in buffalograss mean that the species is capable of being:","correct":"more broadly adapted","options":["more broadly adapted","more narrowly adapted","sterile","slower growing"],"feedback":"Higher ploidy levels allow buffalograss to be more broadly adapted.","source":"M14.6: Buffalograss","kind":"module"},{"id":"m14q114","module":"M14","question":"Buffalograss is dioecious, meaning:","correct":"male and female flowers are borne on different plants","options":["male and female flowers are borne on different plants","each plant bears both male and female flowers together","flowers are entirely absent","flowers self-pollinate exclusively"],"feedback":"Dioecious buffalograss bears male and female flowers on separate plants.","source":"M14.6: Buffalograss","kind":"module"},{"id":"m14q115","module":"M14","question":"Male (staminate) buffalograss flowers have two to three short spikes borne on:","correct":"slender culms elevated above the leaves","options":["slender culms elevated above the leaves","burrs hidden within the leaves","underground rhizomes","the leaf tips themselves"],"feedback":"Male buffalograss flowers sit on slender culms elevated above the leaves.","source":"M14.6: Buffalograss","kind":"module"},{"id":"m14q116","module":"M14","question":"Female (pistillate) buffalograss flowers are composed of:","correct":"a burr of female spikelets partially hidden within the leaves","options":["a burr of female spikelets partially hidden within the leaves","short spikes on elevated culms","a single terminal spikelet","a contracted panicle mmon bermudagrass","common zoysiagrass","hybrid zoysiagrass"],"feedback":"Buffalograss is rated well adapted in drier climate for utility turf, unlike the bermudagrasses and zoysiagrasses in this module.","source":"M14.6: Buffalograss","kind":"module"},{"id":"m14q121","module":"M14","question":"Which turfgrass in this module needs minimal or no irrigation: buffalograss or hybrid bermudagrass?","correct":"buffalograss","options":["buffalograss","hybrid bermudagrass","both need minimal irrigation","neither needs irrigation"],"feedback":"Buffalograss needs minimal or no irrigation; hybrid bermudagrass is irrigated frequently.","source":"M14.6: Buffalograss","kind":"module"},{"id":"m14q122","module":"M14","question":"Which is rated \"well adapted\" on golf fairways but only \"adapted, with poor recuperative capacity\" on tees: common zoysiagrass or common bermudagrass?","correct":"common zoysiagrass","options":["common zoysiagrass","common bermudagrass","both share this rating","neither shares this rating"],"feedback":"Common zoysiagrass is well adapted on fairways but only adapted with poor recuperative capacity on tees.","source":"M14.4: Zoysiagrasses","kind":"module"},{"id":"m14q123","module":"M14","question":"Per the textbook, Chloridoideae subfamily grasses require warm nights and no ________ at the time of floral initiation.","correct":"vernalization","options":["vernalization","defoliation","scarification","fertilization"],"feedback":"Chloridoid grasses require warm nights and no vernalization for floral initiation, unlike the pooid (cool-season) grasses.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q124","module":"M14","question":"Per the textbook, chloridoid grasses are Pooid in most spikelet characters but Panicoid with respect to chromosome number and size and in most features of the:","correct":"embryo, root, stem, and leaf","options":["embryo, root, stem, and leaf","inflorescence only","seed coat only","flowering culm only"],"feedback":"Chloridoid grasses resemble Pooids in spikelet traits but Panicoids in chromosome traits and embryo/root/stem/leaf features.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q125","module":"M14","question":"Per the textbook, photosynthesis in chloridoid grasses occurs principally through:","correct":"the C4 (Hatch and Slack) pathway","options":["the C4 (Hatch and Slack) pathway","the C3 (Calvin) cycle","the CAM pathway","anaerobic respiration"],"feedback":"Chloridoid grasses use the C4 (Hatch and Slack) photosynthetic pathway, unlike the C3 pooid grasses.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q126","module":"M14","question":"Per the textbook, the Chloridoideae subfamily contains five tribes, how many of which include turfgrass genera?","correct":"three","options":["three","one","two","all five"],"feedback":"Three of the Chloridoideae subfamily's five tribes include turfgrass genera.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q127","module":"M14","question":"Per the textbook, within the Cynodonteae tribe, the two major turfgrass genera are Cynodon and:","correct":"Bouteloua","options":["Bouteloua","Zoysia","Buchloe","Eremochloa"],"feedback":"Cynodon and Bouteloua are the two major Cynodonteae turfgrass genera.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q128","module":"M14","question":"Per the textbook, the genus Cynodon includes about how many species?","correct":"10","options":["10","50","125","25"],"feedback":"The genus Cynodon includes about 10 species.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q129","module":"M14","question":"Per the textbook, besides common, African, Magennis, and hybrid bermudagrass, a fifth principal bermudagrass turfgrass species is Bradley bermudagrass, whose Latin name is:","correct":"Cynodon incompletus var. hirsutis","options":["Cynodon incompletus var. hirsutis","Cynodon dactylon var. seleucidus","Cynodon transvaalensis var. hirsutis","Cynodon magennisii var. bradleyi"],"feedback":"Bradley bermudagrass is Cynodon incompletus var. hirsutis.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q130","module":"M14","question":"Per the textbook, there are three races within C. dactylon var. dactylon: a tropical race, a temperate race, and a:","correct":"seleucidus race","options":["seleucidus race","subarctic race","oceanic race","Mediterranean race"],"feedback":"Common bermudagrass has tropical, temperate, and seleucidus races.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q131","module":"M14","question":"Per the textbook, the tropical race of common bermudagrass is short in stature and forms a:","correct":"loose turf","options":["loose turf","dense turf","thatch-free turf","deeply rooted turf"],"feedback":"The tropical race of common bermudagrass forms a loose turf.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q132","module":"M14","question":"Per the textbook, the temperate race of common bermudagrass is more winter hardy and forms a:","correct":"denser turf","options":["denser turf","looser turf","coarser turf","shade-tolerant turf"],"feedback":"The temperate race of common bermudagrass is more winter hardy and denser than the tropical race.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q133","module":"M14","question":"Per the textbook, the seleucidus race of common bermudagrass is quite cold tolerant and very coarse textured, with thick:","correct":"stolons and rhizomes","options":["stolons and rhizomes","leaf blades only","roots only","ligules"],"feedback":"The seleucidus race is cold tolerant, coarse textured, with thick stolons and rhizomes.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q134","module":"M14","question":"Per the textbook, depending on race, bermudagrass may occur as far north as:","correct":"53°N latitude","options":["53°N latitude","32°N latitude","40°N latitude","60°N latitude"],"feedback":"Bermudagrass may occur as far north as 53°N latitude, depending on race.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q135","module":"M14","question":"Per the textbook, common bermudagrass spreads laterally by:","correct":"both stolons and rhizomes","options":["both stolons and rhizomes","stolons only","rhizomes only","seed dispersal only"],"feedback":"Common bermudagrass spreads laterally through both stolons and rhizomes.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q136","module":"M14","question":"Per the textbook, the vernation of common bermudagrass is:","correct":"folded","options":["folded","rolled","flat","convolute"],"feedback":"Common bermudagrass has folded vernation.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q137","module":"M14","question":"Per the textbook, common bermudagrass's intolerance of shade necessitates the use of alternative warm-season species where:","correct":"trees and other structures restrict sunlight penetration","options":["trees and other structures restrict sunlight penetration","soils are sandy","rainfall is heaviest","soil pH is highest"],"feedback":"Bermudagrass's shade intolerance requires alternative species on shaded sites.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q138","module":"M14","question":"Per the textbook, early U.S. golf-green plantings of bermudagrass used imported seed from:","correct":"Africa","options":["Africa","South America","Australia","Southeast Asia"],"feedback":"Early U.S. bermudagrass greens were planted with seed imported from Africa.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q139","module":"M14","question":"Per the textbook, selection of surviving clones from poor-quality, African-seeded greens led to the cultivar:","correct":"U-3","options":["U-3","Tiflawn","Tifgreen","Vamont"],"feedback":"U-3 resulted from selecting surviving clones of early African-seeded bermudagrass greens.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q140","module":"M14","question":"Per the textbook, one of the first intraspecific hybrid bermudagrass cultivars, produced by intercrossing two or more parent plants, was:","correct":"Tiflawn","options":["Tiflawn","Tifgreen","Tifway","U-3"],"feedback":"Tiflawn was one of the first intraspecific bermudagrass hybrids.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q141","module":"M14","question":"Per the textbook, the method of successive cycles of selection and intercrossing used to develop improved bermudagrass cultivars is called:","correct":"recurrent selection","options":["recurrent selection","backcrossing","mutagenesis","clonal propagation"],"feedback":"Recurrent selection is the successive-cycle selection-and-intercrossing method used to improve bermudagrass cultivars.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q142","module":"M14","question":"Per the textbook, African bermudagrass is a very fine-textured, puffy, yellowish-green grass with soft hairy leaves and:","correct":"threadlike stolons","options":["threadlike stolons","thick rhizomes","no stolons at all","coarse, woody stolons"],"feedback":"African bermudagrass has threadlike stolons along with its fine, puffy, yellowish-green growth.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q143","module":"M14","question":"Per the textbook, African bermudagrass is one of the parents of many:","correct":"fine-textured hybrid bermudagrass cultivars","options":["fine-textured hybrid bermudagrass cultivars","coarse-textured zoysiagrass cultivars","cold-tolerant buffalograss cultivars","shade-tolerant fescue cultivars"],"feedback":"African bermudagrass parents many fine-textured hybrid bermudagrass cultivars.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q144","module":"M14","question":"Per the textbook, the improved cultivar of African bermudagrass is:","correct":"Uganda","options":["Uganda","Sunturf","U-3","Tiflawn"],"feedback":"Uganda is the improved African bermudagrass cultivar.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q145","module":"M14","question":"Per the textbook, Magennis bermudagrass is a sterile triploid with how many chromosomes?","correct":"27 (2n = 3x = 27)","options":["27 (2n = 3x = 27)","36 (2n = 4x = 36)","18 (2n = 2x = 18)","40 (2n = 4x = 40)"],"feedback":"Magennis bermudagrass is a sterile triploid with 27 chromosomes, the same count as hybrid bermudagrass.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q146","module":"M14","question":"Per the textbook, the improved cultivar of Magennis bermudagrass is:","correct":"Sunturf","options":["Sunturf","Uganda","U-3","Tiflawn"],"feedback":"Sunturf is the improved Magennis bermudagrass cultivar.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q147","module":"M14","question":"Per the textbook, the vernation of hybrid bermudagrass is:","correct":"folded","options":["folded","rolled","flat","convolute"],"feedback":"Hybrid bermudagrass has folded vernation, matching common bermudagrass.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q148","module":"M14","question":"Per the textbook, the first interspecific hybrid bermudagrass cultivar, initially tested as Tifton 127, was:","correct":"Tiffine","options":["Tiffine","Tifgreen","Tifway","Tifdwarf"],"feedback":"Tiffine, initially tested as Tifton 127, was the first interspecific hybrid bermudagrass cultivar.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q149","module":"M14","question":"Per the textbook, Tiffine was developed from a controlled cross between Tiflawn and:","correct":"a C. transvaalensis selection","options":["a C. transvaalensis selection","a C. magennisii selection","a seleucidus-race selection","a tropical-race selection"],"feedback":"Tiffine was a controlled cross of Tiflawn with a C. transvaalensis selection.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q150","module":"M14","question":"Per the textbook, Tiffine, released in 1953, proved too stemmy for use on:","correct":"greens","options":["greens","fairways","roughs","roadsides"],"feedback":"Tiffine was too stemmy for greens despite being the first interspecific hybrid.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q151","module":"M14","question":"Per the textbook, the cultivar that became the standard for golf greens in warm subtropical and some tropical climates, released in 1956, was:","correct":"Tifgreen (Tifton 328)","options":["Tifgreen (Tifton 328)","Tifway (Tifton 419)","Tifdwarf","TifEagle"],"feedback":"Tifgreen, released in 1956, became the standard for golf greens in warm subtropical and tropical climates.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q152","module":"M14","question":"Per the textbook, Tifway (Tifton 419) was a chance interspecific hybrid received in a packet of C. transvaalensis seed from:","correct":"South Africa, in 1954","options":["South Africa, in 1954","Uganda, in 1960","Australia, in 1956","Brazil, in 1962"],"feedback":"Tifway arrived by chance in a packet of C. transvaalensis seed from South Africa in 1954.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q153","module":"M14","question":"Per the textbook, Tifway gained widespread popularity for fairways and sports fields because of its:","correct":"stiffer and more erect growth","options":["stiffer and more erect growth","finer leaf texture than Tifgreen","superior cold tolerance","lower fertility requirement"],"feedback":"Tifway's stiffer, more erect growth made it popular for fairways and sports fields.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q154","module":"M14","question":"Per the textbook, Tifdwarf was discovered in 1962 in an 8-year-old Tifgreen green and is believed to be a:","correct":"natural mutant","options":["natural mutant","deliberate cross with African bermudagrass","radiation-induced mutant","contaminating weed species"],"feedback":"Tifdwarf is believed to be a natural mutant discovered in an older Tifgreen green.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q155","module":"M14","question":"Per the textbook, Tifdwarf became a popular alternative to Tifgreen because of its:","correct":"shorter leaves and internodes","options":["shorter leaves and internodes","greater cold tolerance","lower fertilization requirement","resistance to all diseases"],"feedback":"Tifdwarf's shorter leaves and internodes suited it to lower mowing heights than Tifgreen.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q156","module":"M14","question":"Per the textbook, the ultradwarf hybrid bermudagrass FloraDwarf was selected from Tifgreen and released in:","correct":"1995","options":["1995","1953","1962","1997"],"feedback":"FloraDwarf, selected from Tifgreen, was released in 1995.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q157","module":"M14","question":"Per the textbook, the ultradwarf hybrid bermudagrass TifEagle was an induced mutant by cobalt radiation from:","correct":"Tifway II, released in 1997","options":["Tifway II, released in 1997","Tifgreen, released in 1995","Tifdwarf, released in 1965","Tiflawn, released in 1953"],"feedback":"TifEagle was induced by cobalt radiation from Tifway II and released in 1997.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q158","module":"M14","question":"Per the textbook, newer ultradwarf cultivars arising as somatic mutations from Tifgreen or Tifdwarf include Champion, Classic, Florida Dwarf, MS Supreme, MiniVerde, and:","correct":"Reesegrass","options":["Reesegrass","Sunturf","Uganda","Riviera"],"feedback":"Reesegrass is among the newer ultradwarf bermudagrass cultivars derived as somatic mutations.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q159","module":"M14","question":"Per the textbook, the environmental adaptation of ultradwarf hybrid bermudagrasses is largely restricted to warm subtropical climates, generally below:","correct":"32°N latitude","options":["32°N latitude","40°N latitude","53°N latitude","25°N latitude"],"feedback":"Ultradwarf bermudagrasses are largely restricted to climates below 32°N latitude, where severe cold is unlikely.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q160","module":"M14","question":"Per the textbook, where greater cold tolerance is required, hybrid bermudagrass cultivars Latitude 36, Northbridge, Patriot, and Riviera are used primarily for sports fields and lawns in warm temperate and cool subtropical climates, where ________ are used for greens instead.","correct":"creeping bentgrasses","options":["creeping bentgrasses","zoysiagrasses","buffalograsses","fine fescues"],"feedback":"In cooler climates, creeping bentgrasses are used for greens instead of cold-tolerant hybrid bermudagrass cultivars.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q161","module":"M14","question":"Per the textbook, the genus Bouteloua (gramagrasses) consists of about how many species?","correct":"50","options":["50","10","125","11"],"feedback":"The genus Bouteloua includes about 50 species.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q162","module":"M14","question":"Per the textbook, species within Bouteloua with dryland turf value include buffalograss, blue grama, and:","correct":"sideoats grama","options":["sideoats grama","crested wheatgrass","fairway wheatgrass","tufted hairgrass"],"feedback":"Buffalograss, blue grama, and sideoats grama are the Bouteloua species with dryland turf value.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q163","module":"M14","question":"Per the textbook, buffalograss's Latin name is given as Bouteloua dactyloides [Nutt.] J.T. Columbus — differing from the genus used on its own module page, which calls it:","correct":"Buchloe dactyloides [Nutt.] Engelm.","options":["Buchloe dactyloides [Nutt.] Engelm.","Cynodon dactylon [L.]","Zoysia dactyloides","Bouteloua gracilis"],"feedback":"The textbook's modern reclassification (Bouteloua dactyloides) differs from the module page's traditional name, Buchloe dactyloides.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q164","module":"M14","question":"Per the textbook, buffalograss's base chromosome number is:","correct":"10 (n = 10)","options":["10 (n = 10)","18 (n = 18)","20 (n = 20)","40 (n = 40)"],"feedback":"Buffalograss has a base chromosome number of 10.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q165","module":"M14","question":"Per the textbook, buffalograss is found as diploid, tetraploid, and:","correct":"hexaploid clones","options":["hexaploid clones","octoploid clones","triploid clones","pentaploid clones"],"feedback":"Buffalograss occurs as diploid, tetraploid, and hexaploid clones.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q166","module":"M14","question":"Per the textbook, the vernation of buffalograss is:","correct":"rolled","options":["rolled","folded","flat","convolute"],"feedback":"Buffalograss has rolled vernation, per the textbook's species description.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q167","module":"M14","question":"Per the textbook, buffalograss is exceptionally well suited to fine-textured:","correct":"alkaline soils","options":["alkaline soils","acid soils","saline wetland soils","peat soils"],"feedback":"Buffalograss is exceptionally well suited to fine-textured, alkaline soils.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q168","module":"M14","question":"Per the textbook, blue grama (Bouteloua gracilis) is generally considered a tetraploid with how many chromosomes?","correct":"40 (2n = 4x = 40)","options":["40 (2n = 4x = 40)","20 (2n = 2x = 20)","60 (2n = 6x = 60)","27 (2n = 3x = 27)"],"feedback":"Blue grama is generally a tetraploid with 40 chromosomes.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q169","module":"M14","question":"Per the textbook, blue grama's vernation is:","correct":"folded","options":["folded","rolled","flat","convolute"],"feedback":"Blue grama has folded vernation, unlike buffalograss's rolled vernation.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q170","module":"M14","question":"Per the textbook, sideoats grama differs from blue grama in having a ________ vernation and long, scattered hairs along the adaxial leaf blade surface.","correct":"rolled","options":["rolled","folded","flat","convolute"],"feedback":"Sideoats grama has rolled vernation, unlike blue grama's folded vernation.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q171","module":"M14","question":"Per the textbook, the Zoysieae tribe's only genus is:","correct":"Zoysia","options":["Zoysia","Cynodon","Bouteloua","Buchloe"],"feedback":"Zoysia is the sole genus within the Zoysieae tribe.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q172","module":"M14","question":"Per the textbook, of the 11 recognized Zoysia species, how many are used as turfgrasses?","correct":"three","options":["three","two","six","all eleven"],"feedback":"Three of the 11 recognized Zoysia species are used as turfgrasses.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q173","module":"M14","question":"Per the textbook, the three zoysiagrass turfgrass species are differentiated in terms of aggressiveness, texture, and:","correct":"cold tolerance","options":["cold tolerance","disease resistance","flower color","seed size"],"feedback":"Aggressiveness, texture, and cold tolerance differentiate the three zoysiagrass species.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q174","module":"M14","question":"Per the textbook, Japanese lawngrass's outstanding cold tolerance even allows it to persist in a subarctic climate, although its very short growing season makes it:","correct":"impractical for use in this climatic zone","options":["impractical for use in this climatic zone","the preferred turfgrass there","toxic to livestock there","unable to survive winter there"],"feedback":"Although cold-tolerant enough to persist subarctically, Japanese lawngrass's short growing season there makes it impractical.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q175","module":"M14","question":"Per the textbook, Japanese lawngrass's late-season discoloration begins with the onset of what temperature range?","correct":"50°F to 55°F (10°C to 13°C)","options":["50°F to 55°F (10°C to 13°C)","32°F to 40°F (0°C to 4°C)","60°F to 65°F (16°C to 18°C)","70°F to 75°F (21°C to 24°C)"],"feedback":"Japanese lawngrass begins late-season discoloration at 50-55°F.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q176","module":"M14","question":"Per the textbook, Japanese lawngrass's slow green-up and late discoloration result in a straw-colored turf during much of the:","correct":"winter season","options":["winter season","summer season","spring season","early fall season"],"feedback":"Japanese lawngrass stays straw-colored through much of winter due to its slow green-up and early discoloration.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q177","module":"M14","question":"Per the textbook, Japanese lawngrass is being used successfully as a fairway and lawn grass in transitional climates, between temperate and subtropical zones, where some cool-season and other warm-season grasses:","correct":"encounter the limits of their environmental adaptation","options":["encounter the limits of their environmental adaptation","grow most vigorously","are entirely absent","require no management at all"],"feedback":"Japanese lawngrass thrives in transitional climates where both cool- and other warm-season grasses hit adaptation limits.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q178","module":"M14","question":"Per the textbook, because of the density and toughness of Japanese lawngrass shoots, mowing should be performed with:","correct":"heavy, reel-type mowers","options":["heavy, reel-type mowers","lightweight rotary mowers","flail mowers only","hand shears only"],"feedback":"Japanese lawngrass's tough, dense shoots require heavy, reel-type mowers for a uniform surface.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q179","module":"M14","question":"Per the textbook, historically the most widely used Japanese lawngrass cultivar was:","correct":"Meyer","options":["Meyer","Crowne","El Toro","Zenith"],"feedback":"Meyer was historically the most widely used Japanese lawngrass cultivar.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q180","module":"M14","question":"Per the textbook, newer Japanese lawngrass cultivars that must be propagated vegetatively include Crowne, El Toro, and:","correct":"Palisades","options":["Palisades","Zenith","Compatibility","Meyer"],"feedback":"Crowne, El Toro, and Palisades are vegetatively propagated Japanese lawngrass cultivars.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q181","module":"M14","question":"Per the textbook, newer Japanese lawngrass cultivars that can be propagated by seed include Compatibility and:","correct":"Zenith","options":["Zenith","Palisades","Crowne","El Toro"],"feedback":"Compatibility and Zenith are seed-propagated Japanese lawngrass cultivars.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q182","module":"M14","question":"Per the textbook, manilagrass is described, compared with the other two Zoysia species, as:","correct":"intermediate in texture and cold tolerance","options":["intermediate in texture and cold tolerance","the coarsest and most cold tolerant","the finest and least cold tolerant","identical in all respects"],"feedback":"Manilagrass is intermediate in both texture and cold tolerance among the three zoysiagrass species.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q183","module":"M14","question":"Per the textbook, improved manilagrass cultivars include Cashmere, Cavalier, Diamond, Royal, and:","correct":"Zorro","options":["Zorro","Meyer","Zenith","Uganda"],"feedback":"Zorro is among the improved manilagrass cultivars listed alongside Cashmere, Cavalier, Diamond, and Royal.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q184","module":"M14","question":"Per the textbook, mascarenegrass is the finest-textured, densest, and slowest-growing Zoysia species, with cold tolerance even lower than:","correct":"manilagrass","options":["manilagrass","Japanese lawngrass","common bermudagrass","buffalograss"],"feedback":"Mascarenegrass has even lower cold tolerance than manilagrass, the next-finest zoysiagrass species.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q185","module":"M14","question":"Per the textbook, mascarenegrass is usually maintained as an:","correct":"unmowed ground cover","options":["unmowed ground cover","intensively mowed putting surface","annually reseeded lawn","irrigated-only utility turf"],"feedback":"Mascarenegrass is typically maintained as unmowed ground cover where used.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q186","module":"M14","question":"Per the textbook, where a very dense thatch is allowed to develop on mascarenegrass, especially on untrafficked sites, ________ develop in the surface that disrupt the uniform appearance of the turf.","correct":"convolutions","options":["convolutions","bare patches","disease lesions","insect mounds"],"feedback":"Heavy thatch on untrafficked mascarenegrass causes surface convolutions that disrupt uniformity.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q187","module":"M14","question":"Per the leaf-anatomy section of the textbook (p. 83), bermudagrasses (Cynodon) have relatively smooth, sometimes hairy, leaf surfaces and a ________ vernation.","correct":"folded","options":["folded","rolled","flat","convolute"],"feedback":"The leaf-anatomy section confirms bermudagrass has folded vernation with smooth, sometimes hairy leaf surfaces.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q188","module":"M14","question":"Per the leaf-anatomy section of the textbook (p. 83), zoysiagrasses (Zoysia) have relatively smooth leaf surfaces, but all have a ________ vernation.","correct":"rolled","options":["rolled","folded","flat","convolute"],"feedback":"The leaf-anatomy section confirms all zoysiagrasses have rolled vernation.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q189","module":"M14","question":"Per the leaf-anatomy section of the textbook (p. 83), some zoysia species have sparse, long hairs usually confined to:","correct":"the adaxial leaf surface","options":["the adaxial leaf surface","the abaxial leaf surface","the ligule only","the root hairs"],"feedback":"Sparse long hairs on some zoysia species are usually confined to the adaxial (upper) leaf surface.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q190","module":"M14","question":"Which bermudagrass has more chromosomes per the textbook: common bermudagrass (36) or African bermudagrass (18)?","correct":"common bermudagrass","options":["common bermudagrass","African bermudagrass","they are equal","neither has a reported chromosome count"],"feedback":"Common bermudagrass is a tetraploid (36 chromosomes), double African bermudagrass's diploid 18.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q191","module":"M14","question":"Which has a folded vernation and which has rolled, per the textbook: bermudagrass or zoysiagrass?","correct":"bermudagrass has folded; zoysiagrass has rolled","options":["bermudagrass has folded; zoysiagrass has rolled","bermudagrass has rolled; zoysiagrass has folded","both have folded vernation","both have rolled vernation"],"feedback":"Per the leaf-anatomy section, bermudagrass has folded vernation while zoysiagrass has rolled vernation.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"},{"id":"m14q192","module":"M14","question":"Among the Bouteloua species discussed, which has folded vernation and which has rolled: blue grama or buffalograss?","correct":"blue grama has folded; buffalograss has rolled","options":["blue grama has folded; buffalograss has rolled","blue grama has rolled; buffalograss has folded","both have folded vernation","both have rolled vernation"],"feedback":"Blue grama has folded vernation while buffalograss (also a Bouteloua species per the textbook) has rolled vernation.","source":"Textbook Ch. 3, pp. 74-77, 83: Turfgrass Species","kind":"enrichment"}];const KEY='turf235_exam1_m14_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M14 cleared</h2><p>You retired all 192 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M14 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
