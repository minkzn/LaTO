:root{--g:#0d5722;--good:#187b35;--bad:#b52d2d;--line:#c9d4ca;--muted:#657167}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f8f3;color:#142018}header{padding:25px 14px 13px;text-align:center;background:linear-gradient(135deg,#0c4d1f,#19452a);color:#fff}h1{font-size:clamp(32px,6vw,58px);line-height:1;margin:0}header p{margin:9px auto 0;max-width:850px;color:#dce9df}.progress{height:10px;background:#d6e1d7;max-width:650px;margin:12px auto 0;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#8fd19e}.toolbar{position:sticky;top:0;z-index:10;background:#f7faf6ee;backdrop-filter:blur(8px);border-bottom:1px solid #d7e0d7}.row{max-width:1050px;margin:auto;padding:9px 12px;display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}button{font:inherit;font-weight:750;border:1px solid #aebcaf;border-radius:10px;background:#fff;padding:9px 12px;cursor:pointer}.primary{background:var(--g);color:#fff;border-color:var(--g)}button:disabled{opacity:.45;cursor:not-allowed}main{max-width:1050px;margin:17px auto 55px;padding:0 14px}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800}.card{background:white;border:1px solid #b9c6ba;border-radius:15px;overflow:hidden;margin:0 0 15px;box-shadow:0 5px 15px rgba(12,70,25,.05)}.card.correct{border:2px solid var(--good)}.card.wrong{border:2px solid var(--bad)}.head{background:#edf3ee;padding:10px 13px;display:flex;justify-content:space-between;gap:10px;font-weight:800}.body{padding:14px}.stem{font-size:16.5px;font-weight:650;margin-bottom:11px}.opt{display:block;padding:10px;border:1px solid #d3dcd4;border-radius:9px;margin:7px 0;cursor:pointer}.opt input{margin-right:9px}.opt.good{background:#eaf7ed;border-color:var(--good)}.opt.bad{background:#fff0f0;border-color:var(--bad)}.feedback{display:non </style><style>.subs{max-width:1050px;margin:12px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.subs a{text-decoration:none;color:#173f24;background:#fff;border:1px solid #c9d4ca;border-radius:999px;padding:6px 11px;font-weight:750;font-size:14px}.subs a span{color:#657167;font-weight:600}.subs a.on{background:#0d5722;color:#fff;border-color:#0d5722}.subs a.on span{color:#dce9df}</style></head><body><header><h1>M21.4 • 17 Questions</h1><p>M21.4: Marcelling. TURF 235 final exam practice. Ten at a time. Correct questions retire; misses cycle back until you clear the module.</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="toolbar"><div class="row"><button class="primary" id="restart">Restart M21.4</button><button id="clear">Clear Saved Progress</button><a href="../index.html"><button>All Modules</button></a></div></div><nav class="subs"><a href="index.html">All M21 <span>95</span></a><a href="21-2.html">M21.2 <span>10</span></a><a href="21-3.html">M21.3 <span>38</span></a><a href="21-4.html" class="on">M21.4 <span>17</span></a><a href="21-5.html">M21.5 <span>30</span></a></nav><main><div class="stats"><div class="stat" id="remaining">Remaining: 17</div><div class="stat" id="mastered">Mastered: 0</div><div class="stat" id="misses">Misses: 0</div><div class="stat" id="batch">Batch: —</div></div><div id="quiz"></div><div class="actions"><button class="primary" id="submit">Submit 10</button><button class="primary" id="next" disabled>Next 10 →</button></div></main><script>
const BANK=[{"id":"m21q049","module":"M21","question":"The most uniform cut from a reel mower occurs when:","correct":"CR equals MH","options":["CR equals MH","CR is twice MH","CR is less than MH","CR is half of MH"],"feedback":"CR = MH gives a 12% variation, which is not noticeable.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q050","module":"M21","question":"When the clip of the reel equals the mowing height, the percent variation is:","correct":"12%","options":["12%","0%","25%","50%"],"feedback":"CR = MH yields a 12% variation, an acceptable amount.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q051","module":"M21","question":"Marcelling is a wavy turf surface that occurs when:","correct":"CR is greater than MH","options":["CR is greater than MH","CR is less than MH","CR equals MH","the bedknife is too loose"],"feedback":"CR > MH produces a wavy (marcelled) cut.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q052","module":"M21","question":"When the clip of the reel is less than the mowing height, the result is a:","correct":"ragged cut","options":["ragged cut","wavy cut","uniform cut","scalped cut"],"feedback":"Reel blades cannot efficiently direct all leaves to the bedknife, so the cut is ragged.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q053","module":"M21","question":"A ragged cut when CR < MH results from:","correct":"reel blades failing to gather all shoots","options":["reel blades failing to gather all shoots","reel blades traveling too far between clips","a bedknife ground with no relief angle","frayed leaves from a too-tight bedknife"],"feedback":"The reel cannot pull all shoots toward the bedknife.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q054","module":"M21","question":"The most common cause of marcelling is:","correct":"a forward operating speed that is too fast","options":["a forward operating speed that is too fast","too many blades on the reel for the mowing height","a reel that spins too fast","a mowing height that is too low"],"feedback":"Too few blades or slow reel speed can do it, but excessive forward speed is the usual cause.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q055","module":"M21","question":"Besides excessive forward speed, marcelling can be induced by:","correct":"reducing reel speed or the number of blades","options":["reducing reel speed or the number of blades","increasing reel speed or the number of blades","raising the mowing height above the CR","tightening the bedknife against the reel"],"feedback":"Both reduce clips per distance, raising CR.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q056","module":"M21","question":"At the point of clip, the aerial shoots form an isosceles triangle whose height is MH and whose base is:","correct":"CR","options":["CR","CR/2","R","MH/2"],"feedback":"The base is the clip of the reel; halving gives right triangles with base CR/2.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q057","module":"M21","question":"In the right triangle used to explain marcelling, side a equals MH and side b equals:","correct":"CR/2","options":["CR/2","CR","2 x CR","MH/2"],"feedback":"Halving the isosceles triangle gives base b = CR/2.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q058","module":"M21","question":"Restitution height (R) is the difference between:","correct":"the hypotenuse (c) and MH (a)","options":["the hypotenuse (c) and MH (a)","the CR and the MH","the bench setting and MH","the hypotenuse (c) and CR/2"],"feedback":"R = c − a.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q059","module":"M21","question":"The formula for restitution height is:","correct":"R = √(MH² + (CR/2)²) − MH","options":["R = √(MH² + (CR/2)²) − MH","R = √(MH² + CR²) − MH","R = √(MH² − (CR/2)²) + MH","R = (MH² + CR²) / MH"],"feedback":"From the Pythagorean theorem, c = √(a² + b²), and R = c − a.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q060","module":"M21","question":"Percent variation (%V) is calculated as:","correct":"R / MH","options":["R / MH","MH / R","R / CR","CR / MH"],"feedback":"%V = restitution height divided by mowing height.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q061","module":"M21","question":"With MH = 1.0 in and CR = 1.5 in, the restitution height is:","correct":"0.25 in","options":["0.25 in","0.12 in","0.50 in","0.75 in"],"feedback":"b = 0.75; c = √(1.0² + 0.75²) = 1.25; R = 1.25 − 1.0 = 0.25 in.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q062","module":"M21","question":"With MH = 1.0 in and CR = 1.5 in, the percent variation is:","correct":"25%","options":["25%","12%","50%","75%"],"feedback":"R = 0.25 in; %V = 0.25 / 1.0 = 25%.","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q063","module":"M21","question":"With MH = 0.4 in and CR = 0.6 in, the restitution height is:","correct":"0.1 in","options":["0.1 in","0.2 in","0.3 in","0.05 in"],"feedback":"b = 0.3; c = √(0.16 + 0.09) = 0.5; R = 0.5 − 0.4 = 0.1 in (%V = 25%).","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q064","module":"M21","question":"According to the module, where the clip of the reel is twice the mowing height, surface variation reaches:","correct":"100 percent","options":["100 percent","12 percent","25 percent","50 percent"],"feedback":"The module states 100 percent, resulting in severe marcelling. (Running the formula with CR = 2 x MH gives about 41%, but the module's stated figure is 100%.)","source":"M21.4: Marcelling","kind":"module"},{"id":"m21q065","module":"M21","question":"A 12-percent variation in the turf surface is:","correct":"not even noticeable","options":["not even noticeable","severe marcelling","a ragged cut","scalping injury"],"feedback":"At CR = MH the 12% variation is acceptable and not noticeable.","source":"M21.4: Marcelling","kind":"module"}];const KEY='turf235_final_m21_21_4_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M21.4 cleared</h2><p>You retired all 17 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M21.4 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
