<style>

</style><style>.subs{max-width:1050px;margin:12px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.subs a{text-decoration:none;color:#173f24;background:#fff;border:1px solid #c9d4ca;border-radius:999px;padding:6px 11px;font-weight:750;font-size:14px}.subs a span{color:#657167;font-weight:600}.subs a.on{background:#0d5722;color:#fff;border-color:#0d5722}.subs a.on span{color:#dce9df}</style></head><body><header><h1>M21.5 • 30 Questions</h1><p>M21.5: Mowing Variables. TURF 235 final exam practice. Ten at a time. Correct questions retire; misses cycle back until you clear the module.</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="toolbar"><div class="row"><button class="primary" id="restart">Restart M21.5</button><button id="clear">Clear Saved Progress</button><a href="../index.html"><button>All Modules</button></a></div></div><nav class="subs"><a href="index.html">All M21 <span>95</span></a><a href="21-2.html">M21.2 <span>10</span></a><a href="21-3.html">M21.3 <span>38</span></a><a href="21-4.html">M21.4 <span>17</span></a><a href="21-5.html" class="on">M21.5 <span>30</span></a></nav><main><div class="stats"><div class="stat" id="remaining">Remaining: 30</div><div class="stat" id="mastered">Mastered: 0</div><div class="stat" id="misses">Misses: 0</div><div class="stat" id="batch">Batch: —</div></div><div id="quiz"></div><div class="actions"><button class="primary" id="submit">Submit 10</button><button class="primary" id="next" disabled>Next 10 →</button></div></main><script>
const BANK=[{"id":"m21q066","module":"M21","question":"Which is NOT one of the mowing variables shown in the module's star diagram?","correct":"mowing speed","options":["mowing speed","mowing height","blade sharpness","mowing pattern"],"feedback":"The five: mowing height, frequency, pattern, blade sharpness, and clippings.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q067","module":"M21","question":"The \"effective\" mowing height is the:","correct":"shoot height immediately after mowing","options":["shoot height immediately after mowing","height set mechanically on the mower","height at which the reel meets the bedknife","shoot height just before the next mowing"],"feedback":"Effective height = height of aerial shoots immediately following mowing.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q068","module":"M21","question":"The \"bench setting\" is the:","correct":"mechanically set height of the mower","options":["mechanically set height of the mower","shoot height immediately after mowing","forward distance between clips","height at which scalping begins"],"feedback":"Bench setting and effective height should be similar but are not likely to be the same.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q069","module":"M21","question":"The bench setting and the effective mowing height are usually:","correct":"similar but not identical","options":["similar but not identical","exactly the same","unrelated to each other","different by a factor of two"],"feedback":"They should be similar, but are not likely to be the same.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q070","module":"M21","question":"Within a grass's mowing-tolerance range, closer mowing produces a turf that is:","correct":"denser and finer-textured","options":["denser and finer-textured","thinner and coarser","denser and coarser","thinner and finer-textured"],"feedback":"More diminutive plants form a denser, finer-textured sward.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q071","module":"M21","question":"Compared with a higher-mowed turf, closer-mowed turf has a:","correct":"less-extensive root system","options":["less-extensive root system","more-extensive root system","deeper root system","root system of equal size"],"feedback":"Closer mowing reduces rooting.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q072","module":"M21","question":"In some rhizomatous turfgrasses, closer mowing results in:","correct":"fewer, shorter rhizomes","options":["fewer, shorter rhizomes","more, longer rhizomes","more, shorter rhizomes","fewer, longer rhizomes"],"feedback":"Rhizome development declines with lower mowing.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q073","module":"M21","question":"Closer-mowed turf needs more frequent irrigation and fertilization because:","correct":"fewer roots must supply more shoots","options":["fewer roots must supply more shoots","more clippings remove more nutrients","low turf loses water through the soil","its leaves photosynthesize less efficiently"],"feedback":"Relatively small root capacity supports a relatively large number of shoots.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q074","module":"M21","question":"Each leaf emerging from an aerial shoot has at its base a(n) ___ that can give rise to a new tiller.","correct":"axillary bud","options":["axillary bud","intercalary meristem","adventitious root","rhizome node"],"feedback":"One axillary bud per leaf.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q075","module":"M21","question":"In a healthy turf maintained at a constant height, axillary buds develop only to:","correct":"replace senescing shoots","options":["replace senescing shoots","expand shoot density","recover from disease","produce seed heads"],"feedback":"Shoot replacement after senescence maintains shoot density.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q076","module":"M21","question":"Axillary bud development for shoot density EXPANSION is triggered by:","correct":"mowing height reduction","options":["mowing height reduction","injury or disease","shoot senescence","raising the mowing height"],"feedback":"Lowering the height causes more buds to develop, raising density.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q077","module":"M21","question":"Shoot recuperative capacity is the axillary bud response to:","correct":"recovery from injury or disease","options":["recovery from injury or disease","mowing height reduction","reduction of the mowing height within its range","clipping removal"],"feedback":"Even more buds develop to repopulate the site after injury or disease.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q078","module":"M21","question":"Scalping injury is caused by:","correct":"excessive removal of green shoot tissue","options":["excessive removal of green shoot tissue","leaves torn by a loosely set bedknife","clippings left lying on the surface","mowing in the same direction each time"],"feedback":"It exposes unsightly shoot stubble or bare earth.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q079","module":"M21","question":"Scalping along the edge of a green is prevented mainly by:","correct":"careful attention by the mower operator","options":["careful attention by the mower operator","using a rotary rather than a reel mower","returning clippings after each mowing","sharpening the reel blades more often"],"feedback":"This is avoidable operator-caused damage.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q080","module":"M21","question":"Striped scalping across a fairway, as shown in the module, results from:","correct":"mowing units set to unequal heights","options":["mowing units set to unequal heights","mowing too fast for the reel speed","reel blades that have become dull","following the one-third rule too closely"],"feedback":"The mechanic must adjust all units to exactly the same height.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q081","module":"M21","question":"Turf cut with a dull mower shows:","correct":"frayed tissue above the cut height","options":["frayed tissue above the cut height","smooth, evenly cut leaf tips","a wavy, marcelled surface","a wavy, marcelled surface across the whole turf"],"feedback":"Dull blades cut raggedly, leaving frayed tissue.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q082","module":"M21","question":"In the 48 hours after mowing with dull blades, leaf regrowth is:","correct":"sporadic, accentuating uneven heights","options":["sporadic, accentuating uneven heights","uniform, keeping the shape just after cutting","faster than after a sharp cut","halted until the tips heal"],"feedback":"With sharp blades, regrowth is even; with dull blades it is sporadic.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q083","module":"M21","question":"Excessive clippings should be removed mainly to avoid:","correct":"light-exclusion injury","options":["light-exclusion injury","marcelling","soil compaction from mowing traffic","scalping"],"feedback":"Especially during hot weather.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q084","module":"M21","question":"Light-exclusion injury from clippings is most likely during:","correct":"hot weather","options":["hot weather","cool weather","spring green-up","winter dormancy"],"feedback":"Excessive clippings should be removed especially in hot weather.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q085","module":"M21","question":"When the one-third rule is followed, clippings:","correct":"need not be removed","options":["need not be removed","must always be removed","must be removed in spring","should be raked weekly"],"feedback":"Returning them may even be beneficial.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q086","module":"M21","question":"Returning clippings to the turf recycles:","correct":"N, P, K, and organic matter","options":["N, P, K, and organic matter","only nitrogen","soluble salts and sodium","lime and organic matter"],"feedback":"Nutrients (N, P, K) and organic matter are returned.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q087","module":"M21","question":"Where clippings are routinely removed, the turf may need:","correct":"additional fertilization","options":["additional fertilization","less irrigation","a higher mowing height","more frequent rolling"],"feedback":"To compensate for nutrients lost in clippings.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q088","module":"M21","question":"Mowing frequency is:","correct":"the number of mowings per unit of time","options":["the number of mowings per unit of time","the number of days between mowings","the number of days between successive mowings","the fraction of growth removed"],"feedback":"It is inversely related to the mowing interval.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q089","module":"M21","question":"Mowing frequency is ___ related to the mowing interval.","correct":"inversely","options":["inversely","directly","not","exponentially"],"feedback":"More frequent mowing means fewer days between mowings.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q090","module":"M21","question":"The mowing interval is the:","correct":"number of days between mowings","options":["number of days between mowings","number of mowings per week","height removed per mowing","width of each mowing pass"],"feedback":"Interval = days between successive mowings.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q091","module":"M21","question":"As a general rule for ornamental and sports turfs, no more than ___ of vertical shoot growth should be removed per mowing.","correct":"one third","options":["one third","one quarter","one half","two thirds"],"feedback":"The one-third rule.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q092","module":"M21","question":"Mowing frequency ranges from daily on greens to:","correct":"a few mowings a season on utility turf","options":["a few mowings a season on utility turf","weekly on most utility turfs throughout the year","twice daily on home lawns","monthly on athletic fields"],"feedback":"Some utility turfs are mowed only a few times during the growing season.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q093","module":"M21","question":"Light and dark stripes after mowing result from:","correct":"shoots leaning, which changes light reflection","options":["shoots leaning, which changes light reflection","alternating units set at different heights","clippings left behind on alternating mowing passes","uneven fertilizer applied with the mower"],"feedback":"Mowing direction orients shoots toward the direction of travel.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q094","module":"M21","question":"A checkerboard pattern is produced by:","correct":"double cutting at right angles","options":["double cutting at right angles","mowing in a circular pattern","alternating sharp and dull reels","mowing twice in one direction"],"feedback":"Two passes at right angles.","source":"M21.5: Mowing Variables","kind":"module"},{"id":"m21q095","module":"M21","question":"Mowing direction should be varied to encourage upright growth and avoid:","correct":"grain and differential compaction","options":["grain and differential compaction","marcelling and ragged cuts","scalping and light exclusion along the passes","thatch and nutrient loss"],"feedback":"Varying direction prevents grain and uneven soil compaction.","source":"M21.5: Mowing Variables","kind":"module"}];const KEY='turf235_final_m21_21_5_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M21.5 cleared</h2><p>You retired all 30 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M21.5 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
