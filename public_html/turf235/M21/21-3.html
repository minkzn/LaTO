</style><style>.subs{max-width:1050px;margin:12px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.subs a{text-decoration:none;color:#173f24;background:#fff;border:1px solid #c9d4ca;border-radius:999px;padding:6px 11px;font-weight:750;font-size:14px}.subs a span{color:#657167;font-weight:600}.subs a.on{background:#0d5722;color:#fff;border-color:#0d5722}.subs a.on span{color:#dce9df}</style></head><body><header><h1>M21.3 • 38 Questions</h1><p>M21.3: Mechanical Mowing Types. TURF 235 final exam practice. Ten at a time. Correct questions retire; misses cycle back until you clear the module.</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="toolbar"><div class="row"><button class="primary" id="restart">Restart M21.3</button><button id="clear">Clear Saved Progress</button><a href="../index.html"><button>All Modules</button></a></div></div><nav class="subs"><a href="index.html">All M21 <span>95</span></a><a href="21-2.html">M21.2 <span>10</span></a><a href="21-3.html" class="on">M21.3 <span>38</span></a><a href="21-4.html">M21.4 <span>17</span></a><a href="21-5.html">M21.5 <span>30</span></a></nav><main><div class="stats"><div class="stat" id="remaining">Remaining: 38</div><div class="stat" id="mastered">Mastered: 0</div><div class="stat" id="misses">Misses: 0</div><div class="stat" id="batch">Batch: —</div></div><div id="quiz"></div><div class="actions"><button class="primary" id="submit">Submit 10</button><button class="primary" id="next" disabled>Next 10 →</button></div></main><script>
const BANK=[{"id":"m21q011","module":"M21","question":"Mechanical mowers employ one of two cutting actions:","correct":"shearing-type or impact-type","options":["shearing-type or impact-type","reel-type or rotary-type, depending on the shaft","vertical or horizontal","grinding or slicing"],"feedback":"Shearing (two edges, like scissors) or impact (one edge, like a machete).","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q012","module":"M21","question":"A shearing-type cutting action clips leaves by:","correct":"bringing two cutting edges together","options":["bringing two cutting edges together","slicing with a single cutting edge","tearing with free-swinging knives","crushing against a heavy roller"],"feedback":"Like scissors: two edges meet.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q013","module":"M21","question":"An impact-type cutting action clips leaves by:","correct":"slicing with a single cutting edge","options":["slicing with a single cutting edge","bringing two cutting edges together","pinching between reel and bedknife","grinding against a stationary plate"],"feedback":"Like a machete: one edge.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q014","module":"M21","question":"The three basic types of mowers in use today are:","correct":"reel, rotary, and flail","options":["reel, rotary, and flail","reel, rotary, and sickle","rotary, flail, and hover","reel, sickle, and scythe"],"feedback":"Reel, rotary, and flail.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q015","module":"M21","question":"A reel mower uses a shearing action between a rotating series of reel blades and a stationary:","correct":"bedknife","options":["bedknife","flail","roller","vertical shaft"],"feedback":"The reel blades shear against the bedknife.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q016","module":"M21","question":"Reel mower cut quality is influenced by sharpness and by the:","correct":"adjustment of the bedknife against the reel","options":["adjustment of the bedknife against the reel","diameter of the rear drive roller","engine horsepower of the traction unit driving it","balance of the vertical drive shaft"],"feedback":"Sharpness plus bedknife-to-reel adjustment.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q017","module":"M21","question":"Which grind prepares the cutting surface of the reel blade for mowing?","correct":"spin grind","options":["spin grind","relief grind","bedknife grind","front-face grind"],"feedback":"Spin grinding prepares the cutting surface; relief grinding follows.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q018","module":"M21","question":"Relief grinding of a reel blade:","correct":"reduces its thickness to a smaller edge","options":["reduces its thickness to a smaller edge","prepares the initial cutting surface","sets the reel height above the ground","balances the blade on its shaft"],"feedback":"Relief grinding progressively reduces thickness to a smaller surface for a finished edge.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q019","module":"M21","question":"Reel blades are prepared for mowing by spin grinding followed by:","correct":"relief grinding","options":["relief grinding","back lapping","balancing","spin grinding again"],"feedback":"Spin grind first, then relief grind.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q020","module":"M21","question":"The bedknife is ground with a slight relief angle so that cutting is restricted to:","correct":"its tip, where the top and front faces meet","options":["its tip, where the top and front faces meet","the full width of its top face","its rear edge, nearest the roller","the gap between adjacent reel blades as they turn"],"feedback":"The relief angle confines the cutting action to the tip.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q021","module":"M21","question":"In a reel mower, the cutting action begins as the bedknife pushes shoots forward while a reel blade:","correct":"pulls shoots toward the bedknife","options":["pulls shoots toward the bedknife","pushes shoots down into the canopy","lifts clippings into the basket","slices shoots against the housing"],"feedback":"The bedknife pushes forward; the reel blade pulls toward the bedknife.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q022","module":"M21","question":"A bedknife adjusted too TIGHTLY against the reel causes:","correct":"faster wear, heat, and higher power needs","options":["faster wear, heat, and higher power needs","torn, bruised leaves with tip browning","a wavy, marcelled turf surface","scalping along the inside edge of the mowing swath"],"feedback":"Too tight: accelerated wear of cutting surfaces, heat buildup, more power.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q023","module":"M21","question":"A bedknife adjusted too LOOSELY against the reel causes:","correct":"torn, bruised leaves with tip browning","options":["torn, bruised leaves with tip browning","faster wear, heat, and higher power needs","a wavy, marcelled turf surface","projectiles thrown from the housing"],"feedback":"Too loose: torn and bruised leaves, tip discoloration, stunting.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q024","module":"M21","question":"The clip of the reel (CR) is the:","correct":"forward distance traveled between clips","options":["forward distance traveled between clips","height of the aerial shoots just after mowing","number of blades on the reel","gap between bedknife and reel"],"feedback":"CR is the forward distance traveled between successive clips.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q025","module":"M21","question":"Which of the following does NOT determine the clip of the reel?","correct":"the mowing height","options":["the mowing height","the number of reel blades","the reel's rotational velocity","the forward operating speed"],"feedback":"CR depends on blade number, reel speed, and forward speed.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q026","module":"M21","question":"A rotary mower cuts with single cutting edges rotating about a:","correct":"vertical shaft","options":["vertical shaft","horizontal shaft","stationary bedknife","hinged axle"],"feedback":"Rotary blades spin on a vertical shaft and cut by impact.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q027","module":"M21","question":"Reasonable mowing quality from a rotary mower requires that the cutting edges be sharp and the blade:","correct":"balanced","options":["balanced","serrated","hinged","relief ground"],"feedback":"Sharp and balanced.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q028","module":"M21","question":"Rotary mowers are most often used on:","correct":"utility turfs and home lawns","options":["utility turfs and home lawns","putting greens and tees","fairways and sod farms","bowling and croquet greens"],"feedback":"Rotaries are often used for utility turfs and home lawns.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q029","module":"M21","question":"Compared with a reel mower, a rotary mower is more versatile because it can:","correct":"mow tall grass, seed stalks, and leaves","options":["mow tall grass, seed stalks, and leaves","produce a true putting surface","cut more uniformly than a reel at low mowing heights","eliminate the risk of projectiles"],"feedback":"It can mow tall grass, tough seed stalks and weeds, mulch or bag leaves, and trim along walls.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q030","module":"M21","question":"Advantages of rotary mowers include:","correct":"low cost, easy operation, simple upkeep","options":["low cost, easy operation, simple upkeep","high quality, no projectiles, low cost","fine mulch, no projectiles, low cost","high quality, low cost, simple upkeep"],"feedback":"Cheap, easy to run, simple to maintain.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q031","module":"M21","question":"Disadvantages of rotary mowers include:","correct":"moderate quality and possible projectiles","options":["moderate quality and possible projectiles","high cost and high maintenance","poor mowing quality and very high equipment cost","frequent bedknife adjustment and wear"],"feedback":"Moderate mowing quality and possible projectiles.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q032","module":"M21","question":"Mulching mowers use a modified rotary blade to:","correct":"recut clippings so they settle into the canopy","options":["recut clippings so they settle into the canopy","lift clippings into a rear-mounted collection bag","grind the reel blades while mowing","fold away when striking a hard object"],"feedback":"Smaller clippings move into the canopy where microbes degrade them.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q033","module":"M21","question":"Mulched clippings that move into the turfgrass canopy are further degraded by:","correct":"microbial activity","options":["microbial activity","ultraviolet light","earthworm casting","leaching"],"feedback":"Microbial activity breaks them down.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q034","module":"M21","question":"A flail mower cuts with:","correct":"free-swinging knives on a horizontal shaft","options":["free-swinging knives on a horizontal shaft","a single blade on a vertical shaft","a reel turning against a bedknife","a fan-driven blade floating on a cushion of air"],"feedback":"Small free-swinging knives hinged to a horizontal shaft; impact action.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q035","module":"M21","question":"Flail mowers pose less danger from projectiles than rotary mowers because the knives:","correct":"fold away when they hit a hard object","options":["fold away when they hit a hard object","spin much more slowly than rotary blades","are enclosed inside a reel housing","are made of soft plastic, not steel"],"feedback":"Hinged knives fold away from rocks and other obstructions.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q036","module":"M21","question":"While a flail mower shaft rotates, the knives are held out by:","correct":"centrifugal force","options":["centrifugal force","spring tension","a fixed bolt","air pressure"],"feedback":"Centrifugal force extends the hinged knives.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q037","module":"M21","question":"Flail mowers reduce tall vegetation to a fine mulch because:","correct":"debris is recut until it clears the housing","options":["debris is recut until it clears the housing","a separate blade chops clippings in the bag","the reel shears clippings against a bedknife","clippings are blown into the turf canopy"],"feedback":"Small knife-to-housing clearance means debris is recut until small enough to clear.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q038","module":"M21","question":"Flail mowers are primarily used on:","correct":"utility turfs mowed infrequently","options":["utility turfs mowed infrequently","greens mowed daily","home lawns mowed weekly","tees mowed several times weekly"],"feedback":"Utility turfs where mowing is infrequent.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q039","module":"M21","question":"The principal disadvantages of flail mowers are expense, high maintenance cost, and:","correct":"poor mowing quality","options":["poor mowing quality","projectile danger","coarse clippings","limited versatility"],"feedback":"Flails give poor mowing quality.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q040","module":"M21","question":"The inverted-Y shape of a flail cutting unit allows it to cut through:","correct":"thatch or woody runners","options":["thatch or woody runners","soil and buried rocks","wet, matted clippings","irrigation heads"],"feedback":"The upside-down Y shape cuts through thatch or woody runners.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q041","module":"M21","question":"Triplex greens mowers were introduced in the:","correct":"1960s","options":["1960s","1830s","1920s","1990s"],"feedback":"Early triplex greens mowers date to the 1960s.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q042","module":"M21","question":"The \"triplex ring\" on putting greens results from:","correct":"wheel traffic and inside-edge scalping","options":["wheel traffic and inside-edge scalping","dull reel blades on the outer units","bedknives set too tightly on the reel","mowing the green in only one direction"],"feedback":"Wheel traffic, plus scalping along the inside edge of the mowing swath.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q043","module":"M21","question":"Large tractor mowers popular in the 1960s for fairways declined because they caused:","correct":"severe soil compaction","options":["severe soil compaction","marcelling","scalping on slopes","projectile injuries"],"feedback":"Severe compaction from their operation became increasingly apparent.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q044","module":"M21","question":"Modern mowers are relatively lightweight to ensure:","correct":"high-quality, efficient, reliable mowing","options":["high-quality, efficient, reliable mowing","that operators can carry them up slopes","lower prices than rotary mowers","compatibility with older reel units"],"feedback":"Light weight gives excellent mowing quality and efficient, reliable operation.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q045","module":"M21","question":"Tractor-pulled gang reel units like those shown in the module are used for mowing:","correct":"roughs","options":["roughs","greens","tees","banks"],"feedback":"They were used for mowing roughs.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q046","module":"M21","question":"A hover mower (Flymo) is a type of rotary mower especially useful for mowing:","correct":"steep banks","options":["steep banks","putting greens","sod crops","tall utility turf"],"feedback":"Its air cushion and lack of wheels make it easy to move on steep banks.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q047","module":"M21","question":"A hover mower floats over the turf because:","correct":"a fan drives air down to form a cushion","options":["a fan drives air down to form a cushion","its blades spin fast enough to lift it","large balloon tires spread its weight","the operator supports it by the handle"],"feedback":"A fan above the blades drives air downward, like a hovercraft.","source":"M21.3: Mechanical Mowing Types","kind":"module"},{"id":"m21q048","module":"M21","question":"Hover mowers are maneuvered easily around objects because they:","correct":"have no wheels","options":["have no wheels","have three wheels","use a reel","are self-propelled"],"feedback":"The lack of wheels allows easy maneuvering.","source":"M21.3: Mechanical Mowing Types","kind":"module"}];const KEY='turf235_final_m21_21_3_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M21.3 cleared</h2><p>You retired all 38 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M21.3 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
