const BANK=[{"id":"m18q044","module":"M18","question":"Per the textbook, the most formidable adverse influences on turf are frequently:","correct":"people","options":["people","insects","diseases","earthworms"],"feedback":"Wear, breakage, displacement, compaction.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q045","module":"M18","question":"Direct traffic pressure crushes shoots especially when plants are:","correct":"frosted or wilted","options":["frosted or wilted","freshly fertilized","actively growing","mowed high"],"feedback":"Avoid traffic on frost, dormant turf, and wet soil.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q046","module":"M18","question":"Golf course wear can be spread by:","correct":"moving pins and tee markers","options":["moving pins and tee markers","lowering mowing heights","closing the course often","applying more nitrogen"],"feedback":"Also shifting bunkers for wider lanes.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q047","module":"M18","question":"Adjusting fertilization and irrigation improves wearability by reducing:","correct":"succulence","options":["succulence","root growth","verdure","photosynthesis"],"feedback":"Also raise mowing height.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q048","module":"M18","question":"A golf ball tearing a green surface produces a:","correct":"ball mark","options":["ball mark","divot","rut","pitch scar"],"feedback":"Repair by reshaping the surface.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q049","module":"M18","question":"A claypan and a hardpan are:","correct":"genetic pans","options":["genetic pans","induced pans","plow soles","black layers"],"feedback":"Induced pans come from tillage or tine pressure.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q050","module":"M18","question":"With core cultivation, an induced pan can form:","correct":"along the hole walls","options":["along the hole walls","on the leaf surfaces","in the clipping layer","only in pure sand"],"feedback":"Also at maximum tine depth.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q051","module":"M18","question":"Surface compaction increases bulk density, soil strength, and:","correct":"water-holding capacity","options":["water-holding capacity","aeration porosity","infiltration rate","percolation rate"],"feedback":"Those three decrease.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q052","module":"M18","question":"During compaction, which pores are lost first?","correct":"large aeration pores","options":["large aeration pores","capillary pores","micropores","intra-aggregate pores"],"feedback":"Pore distribution shifts smaller.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q053","module":"M18","question":"A compaction-tolerant weed named in the textbook is:","correct":"goosegrass","options":["goosegrass","crabgrass","dandelion","yellow nutsedge"],"feedback":"Also knotweed, annual bluegrass, white clover.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q054","module":"M18","question":"Compacted turf requires:","correct":"more frequent fertilization and irrigation","options":["more frequent fertilization and irrigation","less frequent fertilization and irrigation","no cultivation at all","no pesticide applications"],"feedback":"Plus drainage and more pesticides.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q055","module":"M18","question":"Penetrometer readings need correction for:","correct":"soil moisture","options":["soil moisture","air temperature","turf color","mowing height"],"feedback":"Wet soils read softer.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q056","module":"M18","question":"A strong root system affects sand stability under traffic by:","correct":"greatly improving it","options":["greatly improving it","reducing it","having no effect","making sand hydrophobic"],"feedback":"Rounded, spherical sand is least stable.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q057","module":"M18","question":"Per Table 3.17, the most wear-resistant cool-season turfgrass is:","correct":"tall fescue","options":["tall fescue","rough bluegrass","creeping bentgrass","fine fescue"],"feedback":"Rough bluegrass ranks lowest.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"},{"id":"m18q058","module":"M18","question":"Zoysiagrasses are very wear resistant but:","correct":"slow to recover","options":["slow to recover","recover very quickly","cannot be mowed","are cool-season grasses"],"feedback":"Creeping bentgrass recovers excellently.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"},{"id":"m18q059","module":"M18","question":"Leaf elasticity is dramatically reduced when turf is:","correct":"frozen","options":["frozen","wet","fertilized","mowed high"],"feedback":"Frost removal by early syringing helps.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"}];const KEY='turf235_exam2_m18_18_textbook_v2';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>Textbook cleared</h2><p>You retired all 16 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart Textbook from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
