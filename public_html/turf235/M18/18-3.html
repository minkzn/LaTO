const BANK=[{"id":"m18q057","module":"M18","question":"In a turf with good internal drainage, water readily moves through the:","correct":"pores permeating the soil matrix","options":["pores permeating the soil matrix","thatch only","leaf surfaces","catch basins only"],"feedback":"Water moves through pores in the soil matrix.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q058","module":"M18","question":"Per M18.3, the larger the soil pores:","correct":"the faster water moves through the soil","options":["the faster water moves through the soil","the slower water moves through the soil","the more water is retained","the more compaction occurs"],"feedback":"Larger pores mean faster water movement.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q059","module":"M18","question":"Per M18.3, the better the drainage:","correct":"the higher the traffic threshold","options":["the higher the traffic threshold","the lower the traffic threshold","the more the turf wilts","the more traffic damage"],"feedback":"Better drainage raises TT.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q060","module":"M18","question":"The soil diagram in M18.3 labels four components of soil:","correct":"air, mineral, organic matter, and water","options":["air, mineral, organic matter, and water","sand, silt, clay, and thatch","nitrogen, phosphorus, potassium, and sulfur","roots, shoots, stolons, and rhizomes"],"feedback":"Air, mineral, organic matter, and water.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q061","module":"M18","question":"When water falls at a rate in excess of a turf's infiltration capacity, the excess will:","correct":"flow downslope and accumulate in depressions","options":["flow downslope and accumulate in depressions","always percolate rapidly","evaporate immediately","raise the traffic threshold"],"feedback":"Excess flows downslope and collects in depressions.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q062","module":"M18","question":"Catch basins situated in depressions can:","correct":"remove surface water and conduct it to drain lines, dramatically increasing the traffic threshold","options":["remove surface water and conduct it to drain lines, dramatically increasing the traffic threshold","increase compaction","reduce the traffic threshold","store water for irrigation only"],"feedback":"Catch basins remove surface water and raise TT.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q063","module":"M18","question":"Where should catch basins be situated?","correct":"in depressions","options":["in depressions","on ridges","on putting surfaces only","under trees"],"feedback":"Catch basins are situated in depressions.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q064","module":"M18","question":"The illustration with rain falling on two surfaces shows standing water on one and a catch basin removing water from the other. It illustrates:","correct":"surface drainage removing excess water","options":["surface drainage removing excess water","transpirational cooling","syringing","soil compaction"],"feedback":"The catch basin removes the surface water.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q065","module":"M18","question":"Per M18.3, generally, the higher the mowing height:","correct":"the higher the traffic threshold","options":["the higher the traffic threshold","the lower the traffic threshold","the more compaction","the less verdure"],"feedback":"Higher mowing raises TT.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q066","module":"M18","question":"With higher mowing there is more verdure, which is:","correct":"above-ground biomass","options":["above-ground biomass","root biomass","thatch","soil organic matter"],"feedback":"Verdure is above-ground biomass.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q067","module":"M18","question":"Higher mowing helps traffic tolerance because more verdure:","correct":"cushions traffic, diluting wear and insulating the soil against compaction","options":["cushions traffic, diluting wear and insulating the soil against compaction","increases thatch decomposition","shades out weeds only","increases evapotranspiration"],"feedback":"Verdure cushions traffic and insulates soil.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q068","module":"M18","question":"A balanced fertilization program provides turfgrasses:","correct":"all essential nutrients in the quantities needed to sustain healthy growth","options":["all essential nutrients in the quantities needed to sustain healthy growth","nitrogen only","as much nitrogen as possible","no phosphorus or potassium"],"feedback":"All essential nutrients in needed quantities.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q069","module":"M18","question":"A balanced fertilization program contributes to:","correct":"maximizing the traffic threshold","options":["maximizing the traffic threshold","minimizing the traffic threshold","increasing thatch","increasing weed pressure"],"feedback":"Balanced fertility helps maximize TT.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q070","module":"M18","question":"Which is a result of excessive nitrogen and other nutrients, per M18.3?","correct":"reduced stress tolerance, excessive growth, and foliar burn","options":["reduced stress tolerance, excessive growth, and foliar burn","dormancy and discoloration","chlorosis and thin stand","increased weed pressure"],"feedback":"Excess fertility: reduced stress tolerance, excessive growth, foliar burn, disease.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q071","module":"M18","question":"Which diseases are favored by EXCESSIVE nitrogen fertility?","correct":"brown patch, Pythium blight, Microdochium patch, Typhula blight, and gray leaf spot","options":["brown patch, Pythium blight, Microdochium patch, Typhula blight, and gray leaf spot","dollar spot, anthracnose, and red thread","summer patch and take-all patch","pink patch and leaf spot"],"feedback":"Excess N favors brown patch, Pythium blight, Microdochium patch, Typhula blight, gray leaf spot.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q072","module":"M18","question":"Which diseases are favored by INADEQUATE fertility?","correct":"dollar spot, anthracnose, pink patch, red thread, summer patch, take-all patch, and leaf spot","options":["dollar spot, anthracnose, pink patch, red thread, summer patch, take-all patch, and leaf spot","brown patch and Pythium blight","Microdochium patch and Typhula blight","gray leaf spot only"],"feedback":"Low fertility favors dollar spot, anthracnose, pink patch, red thread, summer patch, take-all patch, leaf spot.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q073","module":"M18","question":"Brown patch pressure increases with:","correct":"excessive nitrogen","options":["excessive nitrogen","inadequate nitrogen","inadequate irrigation","raising the mowing height"],"feedback":"Brown patch is listed under excessive fertility.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q074","module":"M18","question":"Dollar spot pressure increases with:","correct":"inadequate fertility","options":["inadequate fertility","excessive nitrogen","excessive irrigation","improved light penetration"],"feedback":"Dollar spot is listed under inadequate fertility.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q075","module":"M18","question":"Red thread is associated with:","correct":"inadequate fertility","options":["inadequate fertility","excessive fertility","excessive irrigation","high mowing"],"feedback":"Red thread is in the inadequate-nutrient list.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q076","module":"M18","question":"Gray leaf spot is associated with:","correct":"excessive fertility","options":["excessive fertility","inadequate fertility","inadequate irrigation","drought dormancy"],"feedback":"Gray leaf spot is in the excessive-nutrient list.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q077","module":"M18","question":"Anthracnose pressure in M18.3 is linked to:","correct":"inadequate nutrients","options":["inadequate nutrients","excessive nutrients","excessive irrigation","high verdure"],"feedback":"Anthracnose is in the inadequate list.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q078","module":"M18","question":"Typhula blight in M18.3 is linked to:","correct":"excessive nutrients","options":["excessive nutrients","inadequate nutrients","drought","low mowing"],"feedback":"Typhula blight is in the excessive list.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q079","module":"M18","question":"Inadequate fertility increases weed pressure because:","correct":"the turfgrass is not competitive against potential weed invaders","options":["the turfgrass is not competitive against potential weed invaders","weeds need less light","fertilizer kills weeds","weeds prefer compacted soil only"],"feedback":"Weak turf is not competitive against weed invaders.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q080","module":"M18","question":"A chlorotic appearance from inadequate fertility reflects:","correct":"specific nutrient deficiencies","options":["specific nutrient deficiencies","excess nitrogen","frost damage","scald injury"],"feedback":"Chlorosis reflects specific nutrient deficiencies.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q081","module":"M18","question":"Inadequate fertility can cause a shoot density reduction resulting in:","correct":"a thin stand","options":["a thin stand","excessive growth","foliar burn","thatch accumulation"],"feedback":"Reduced shoot density means a thin stand.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q082","module":"M18","question":"Because both excess and deficient fertility reduce the traffic threshold, it is important to:","correct":"remain within the fertilization \"window\" throughout the growing season","options":["remain within the fertilization \"window\" throughout the growing season","fertilize as heavily as possible","stop fertilizing during the season","fertilize only in winter"],"feedback":"Stay within the fertilization window.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q083","module":"M18","question":"The optimum window for fertilization is the period when which factors are most favorable?","correct":"root-to-shoot ratio, stress tolerance, color, and disease resistance","options":["root-to-shoot ratio, stress tolerance, color, and disease resistance","growth rate and clipping yield only","thatch accumulation and verdure","soil pH and CEC"],"feedback":"Optimum root:shoot ratio, stress tolerance, color, minimum disease.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q084","module":"M18","question":"In the \"Window of Fertilization\" chart, the fertilization window is determined by fertilization timing, irrigation rate, and:","correct":"phenological events","options":["phenological events","soil texture","mower type","cultivar color"],"feedback":"Timing, irrigation rate, and phenological events.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q085","module":"M18","question":"In the \"Window of Fertilization\" chart, the effects listed in the upper box (too much) are:","correct":"reduced stress tolerance, excessive growth, foliar burn, and disease pressure","options":["reduced stress tolerance, excessive growth, foliar burn, and disease pressure","weed pressure, chlorosis, and thin stand","dormancy and discoloration","poor roots and scald"],"feedback":"Upper box: reduced stress tolerance, excessive growth, foliar burn, disease pressure.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q086","module":"M18","question":"In the \"Window of Fertilization\" chart, the effects listed in the lower box (too little) are:","correct":"weed pressure, disease pressure, chlorotic appearance, and thin stand","options":["weed pressure, disease pressure, chlorotic appearance, and thin stand","foliar burn and excessive growth","scald injury and poor roots","dormancy and discoloration"],"feedback":"Lower box: weed pressure, disease pressure, chlorotic appearance, thin stand.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q087","module":"M18","question":"On the fertilization window chart, the horizontal axis is labeled:","correct":"application interval / phenological events","options":["application interval / phenological events","soil depth","mowing height","traffic intensity"],"feedback":"The x axis: application interval, phenological events.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q088","module":"M18","question":"Where the irrigation program provides excessive moisture, which effects may result?","correct":"poor rooting, scald injury, and increased disease pressure","options":["poor rooting, scald injury, and increased disease pressure","dormancy and discoloration","chlorosis and weed pressure","foliar burn"],"feedback":"Excess irrigation: poor rooting, scald, disease.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q089","module":"M18","question":"Scald injury results from:","correct":"prolonged standing water","options":["prolonged standing water","frost on leaves","excess nitrogen","low mowing"],"feedback":"Scald is from prolonged standing water.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q090","module":"M18","question":"Which diseases are especially favored by excessive irrigation?","correct":"Pythium blight and brown patch","options":["Pythium blight and brown patch","dollar spot and red thread","summer patch and take-all patch","anthracnose and leaf spot"],"feedback":"Pythium blight and brown patch especially.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q091","module":"M18","question":"With inadequate irrigation, effects may include:","correct":"dormancy, discoloration, and a thin stand","options":["dormancy, discoloration, and a thin stand","scald injury and Pythium blight","poor rooting from saturation","foliar burn"],"feedback":"Inadequate water: dormancy, discoloration, thin stand.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q092","module":"M18","question":"The optimum window for irrigation depends on irrigation timing, irrigation rate, and:","correct":"environmental conditions","options":["environmental conditions","phenological events","cultivar color","mower sharpness"],"feedback":"Timing, rate, and environmental conditions.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q093","module":"M18","question":"Optimal irrigation leads to:","correct":"favorable growth, favorable color, and minimal disease","options":["favorable growth, favorable color, and minimal disease","maximum clipping yield","dormancy","deep thatch"],"feedback":"Optimum growth, favorable color, minimum disease.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q094","module":"M18","question":"On the \"Window of Irrigation\" chart, the horizontal axis is labeled:","correct":"application interval / environmental conditions","options":["application interval / environmental conditions","phenological events","soil texture","traffic intensity"],"feedback":"Application interval, environmental conditions.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q095","module":"M18","question":"On the fertilization window chart, the horizontal axis includes phenological events, whereas on the irrigation window chart it includes:","correct":"environmental conditions","options":["environmental conditions","phenological events","soil pH","mowing height"],"feedback":"Fertilization: phenological events; irrigation: environmental conditions.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q096","module":"M18","question":"In the lawn photo, brown patches contrasting with green turf illustrate the importance of water for sustaining turfgrass:","correct":"growth, color, and density","options":["growth, color, and density","thatch and mat","soil pH","compaction"],"feedback":"Water sustains growth, color, and density.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q097","module":"M18","question":"In the absence of water, a turf may become:","correct":"dormant and possibly die","options":["dormant and possibly die","more traffic tolerant","greener","more dense"],"feedback":"Dormancy and possibly death may result.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q098","module":"M18","question":"The traffic threshold of a turf when it is dormant is:","correct":"dramatically reduced","options":["dramatically reduced","dramatically increased","unchanged","slightly increased"],"feedback":"TT is dramatically reduced when dormant.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q099","module":"M18","question":"A wilted turf has a traffic threshold that is:","correct":"substantially reduced","options":["substantially reduced","substantially increased","unchanged","highest of the season"],"feedback":"A wilted turf has a substantially reduced TT.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q100","module":"M18","question":"Wilting reflects either the absence of sufficient moisture or:","correct":"the inability of plants to absorb water at a rate sufficient to meet requirements","options":["the inability of plants to absorb water at a rate sufficient to meet requirements","excess nitrogen","excess light","high mowing"],"feedback":"Or inability to absorb water fast enough.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q101","module":"M18","question":"Per M18.3, the greatest need turfgrass plants have for water is for:","correct":"tissue cooling through transpiration","options":["tissue cooling through transpiration","photosynthesis","cell division","nutrient storage"],"feedback":"The greatest need is transpirational cooling.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q102","module":"M18","question":"Transpiration is the process by which soil moisture is absorbed, translocated to the leaves, and:","correct":"evaporated from mesophyll cell surfaces, exiting through stomata","options":["evaporated from mesophyll cell surfaces, exiting through stomata","stored in the crown","released as liquid through roots","converted to sugar"],"feedback":"Evaporated from mesophyll cells, exiting via stomata.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q103","module":"M18","question":"Water translocated during transpiration moves to the leaves through the:","correct":"vascular system","options":["vascular system","phloem only, against gravity","cuticle","thatch layer"],"feedback":"Through the vascular system.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q104","module":"M18","question":"Water vapor exits the leaf through:","correct":"stomata openings","options":["stomata openings","the cuticle","root hairs","the crown"],"feedback":"Through stomata openings.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q105","module":"M18","question":"The conversion of liquid water to water vapor cools the plant because:","correct":"heat energy is absorbed","options":["heat energy is absorbed","heat energy is released","oxygen is consumed","carbon dioxide is fixed"],"feedback":"Evaporation absorbs heat energy.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q106","module":"M18","question":"Which two factors are named as influencing the transpiration rate?","correct":"ambient temperature and wind","options":["ambient temperature and wind","soil pH and CEC","mowing height and cultivar","nitrogen and phosphorus"],"feedback":"Temperature and wind.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q107","module":"M18","question":"With increasing temperature and air movement, the water required for transpirational cooling:","correct":"increases proportionately","options":["increases proportionately","decreases","stays the same","drops to zero"],"feedback":"It increases proportionately.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q108","module":"M18","question":"Turfgrasses may absorb enough water for transpirational cooling regardless of atmospheric conditions if they have:","correct":"a well-developed root system with adequate soil aeration and moisture","options":["a well-developed root system with adequate soil aeration and moisture","shallow roots in thatch","compacted soil","low mowing"],"feedback":"Well-developed roots, aeration, and moisture.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q109","module":"M18","question":"Where rooting is too shallow or soil conditions unfavorable, turfgrasses often cannot meet transpirational demand, resulting in:","correct":"severe wilting and sometimes death","options":["severe wilting and sometimes death","excessive growth","scald from standing water","increased traffic threshold"],"feedback":"Severe wilting and sometimes death.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q110","module":"M18","question":"Syringing is most likely required on:","correct":"close-cut turfs, such as greens","options":["close-cut turfs, such as greens","rough","home lawns mowed high","dormant turf"],"feedback":"Close-cut turfs such as greens.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q111","module":"M18","question":"Syringing compensates for turfgrasses' inability to:","correct":"absorb soil water at a rate sufficient to meet transpirational demand","options":["absorb soil water at a rate sufficient to meet transpirational demand","photosynthesize at night","fix nitrogen","resist compaction"],"feedback":"Syringing offsets inability to absorb water fast enough.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q112","module":"M18","question":"Syringing involves:","correct":"a light application of water","options":["a light application of water","a deep irrigation to field capacity","a fungicide application","a heavy topdressing"],"feedback":"A light application of water.","source":"M18.3: Drainage","kind":"module"},{"id":"m18q113","module": ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M18.3 cleared</h2><p>You retired all 59 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M18.3 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
