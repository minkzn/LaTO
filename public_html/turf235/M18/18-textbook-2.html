const BANK=[{"id":"m18q156","module":"M18","question":"During compaction, clay particles become flattened in a plane:","correct":"perpendicular to the compacting force","options":["perpendicular to the compacting force","parallel to the compacting force","at 45 degrees","randomly oriented"],"feedback":"Perpendicular to the compacting force.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q157","module":"M18","question":"Which pores are most susceptible to loss during compaction?","correct":"large (aeration) pores","options":["large (aeration) pores","capillary pores","micropores","intra-aggregate pores only"],"feedback":"Large aeration pores are most susceptible.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q158","module":"M18","question":"Compacted soils retain more moisture because:","correct":"pore-size distribution shifts toward smaller pores","options":["pore-size distribution shifts toward smaller pores","particle density increases","organic matter increases","sand content increases"],"feedback":"Shift toward smaller pores increases retention.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q159","module":"M18","question":"Poor root growth in compacted soils is partially accounted for by increased:","correct":"soil strength (resistance to penetration)","options":["soil strength (resistance to penetration)","macroporosity","oxygen","infiltration"],"feedback":"Increased soil strength measurable as penetration resistance.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q160","module":"M18","question":"Besides soil strength, poor rooting in compacted soil is due to:","correct":"inadequate oxygen and relatively high CO2 and other potentially toxic gases","options":["inadequate oxygen and relatively high CO2 and other potentially toxic gases","excess oxygen","too much nitrogen","high infiltration"],"feedback":"Low O2 and high CO2 and toxic gases.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q161","module":"M18","question":"Physiological responses to soil compaction include reduced root and shoot growth and:","correct":"increased susceptibility to scald and direct low-temperature injury","options":["increased susceptibility to scald and direct low-temperature injury","increased drought tolerance","increased nutrient uptake","increased heat tolerance"],"feedback":"Also reduced uptake and heat/drought tolerance.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q162","module":"M18","question":"Higher disease incidence in compacted turf is attributed to weakened plants plus:","correct":"prolonged periods of high humidity in the microenvironment","options":["prolonged periods of high humidity in the microenvironment","low humidity","high light","reduced irrigation"],"feedback":"Weak plants and prolonged high humidity.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q163","module":"M18","question":"Which is a compaction-tolerant weed named by Turgeon?","correct":"goosegrass","options":["goosegrass","crabgrass","dandelion","yellow nutsedge"],"feedback":"Knotweed, annual bluegrass, goosegrass, white clover.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q164","module":"M18","question":"Knotweed invading a heavily trafficked area is an ecological indicator of:","correct":"soil compaction","options":["soil compaction","excess shade","low pH only","black layer"],"feedback":"Knotweed is a compaction-tolerant weed.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q165","module":"M18","question":"Soil compaction influences cultural requirements by requiring:","correct":"more frequent fertilization and irrigation","options":["more frequent fertilization and irrigation","less frequent fertilization and irrigation","no cultivation","no pesticides"],"feedback":"More frequent fertilization and irrigation.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q166","module":"M18","question":"In compacted turf, which practices may be essential to dispose of excessive surface moisture?","correct":"drainage tiles, slit trenches, and catch basins","options":["drainage tiles, slit trenches, and catch basins","syringing and dew removal","higher mowing and rolling","sulfur applications"],"feedback":"Drainage tiles, slit trenches, catch basins.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q167","module":"M18","question":"Mistakes in pesticide application are of greater consequence on compacted turf because:","correct":"suitable conditions for turfgrass recovery do not exist","options":["suitable conditions for turfgrass recovery do not exist","pesticides do not work on compacted soil","compacted soil absorbs pesticides","pesticides cause compaction"],"feedback":"Recovery conditions are lacking.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q168","module":"M18","question":"Per Turgeon, traffic should be avoided on frosted turfs because:","correct":"damage to leaf tissue may occur and be evident until new growth takes place","options":["damage to leaf tissue may occur and be evident until new growth takes place","frost raises the traffic threshold","frost prevents compaction","frost fertilizes the turf"],"feedback":"Leaf tissue damage persists until new growth.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q169","module":"M18","question":"Figure 4.14 shows damage to turfgrass caused by:","correct":"cart traffic across frosted turf","options":["cart traffic across frosted turf","snow mold","divots on a tee","black layer"],"feedback":"Cart traffic across frosted turf.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q170","module":"M18","question":"Per the textbook, snow cover protects the turf from:","correct":"winter desiccation and traffic-induced injury","options":["winter desiccation and traffic-induced injury","all winter diseases","ice encasement","annual bluegrass invasion"],"feedback":"Snow protects against desiccation and traffic injury.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q171","module":"M18","question":"Per the textbook, a \"shade\" turf is less tolerant of wear partly because inactive phytochrome results in:","correct":"longer, thinner leaves, reduced density, shallower rooting, thinner cuticles, and lower reserves","options":["longer, thinner leaves, reduced density, shallower rooting, thinner cuticles, and lower reserves","shorter, thicker leaves","deeper rooting","higher carbohydrate reserves"],"feedback":"Shade morphology makes turf delicate.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q172","module":"M18","question":"In a heavily trafficked turf, the loss of plant tissue to mechanical damage necessitates:","correct":"additional growth (and photosynthesis) to sustain quality","options":["additional growth (and photosynthesis) to sustain quality","less photosynthesis","reduced fertility","lower mowing"],"feedback":"Additional growth is needed to replace lost tissue.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q173","module":"M18","question":"For shaded, trafficked turf, which is a course of action the textbook suggests?","correct":"reducing traffic intensity to minimize mechanical damage","options":["reducing traffic intensity to minimize mechanical damage","lowering mowing height","increasing nitrogen sharply","removing all irrigation"],"feedback":"Prune, reduce traffic, or use shade-adapted plants.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q174","module":"M18","question":"At high moisture contents, fine-textured soils can be very unstable and yield under foot or vehicular traffic because:","correct":"particles are forced apart, weakening cohesive and frictional forces","options":["particles are forced apart, weakening cohesive and frictional forces","clay forms aggregates","sand dominates","particle density rises"],"feedback":"Water forces particles apart, weakening both forces.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q175","module":"M18","question":"When a sand-based turf dries out completely, its strength under traffic depends entirely on:","correct":"frictional forces","options":["frictional forces","electrostatic forces","cohesion from clay","organic matter"],"feedback":"Dry sand strength is entirely frictional.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q176","module":"M18","question":"Walking on a dry, poorly rooted sand-based turf is likened to walking on:","correct":"a blanket on the beach","options":["a blanket on the beach","a concrete slab","a wet clay field","a trampoline"],"feedback":"Like a blanket on the beach.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q177","module":"M18","question":"A well-irrigated sand-based turf provides a firmer surface than a dry one because:","correct":"water bridging between particles increases soil strength","options":["water bridging between particles increases soil strength","water dissolves the sand","water adds clay","water raises particle density"],"feedback":"Water bridges increase strength via electrostatic attraction.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q178","module":"M18","question":"Which sand is least structurally stable under traffic?","correct":"well-rounded particles of high sphericity","options":["well-rounded particles of high sphericity","very angular particles of low sphericity","widely differing particle sizes","sand with a strong root system"],"feedback":"Lowest stability: well-rounded, high sphericity.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q179","module":"M18","question":"A strong, well-developed root system affects sand stability by:","correct":"dramatically improving it","options":["dramatically improving it","reducing it","having no effect","making sand hydrophobic"],"feedback":"Roots dramatically improve stability.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q180","module":"M18","question":"To check for traffic-induced compaction, a penetrometer measures:","correct":"the force required to push a rod tip into the turf","options":["the force required to push a rod tip into the turf","soil pH","water infiltration rate","green speed"],"feedback":"Force to push a cone-shaped rod into the turf.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q181","module":"M18","question":"Penetrometer readings may not accurately characterize compaction unless:","correct":"soil moisture content is taken into account","options":["soil moisture content is taken into account","the sand is dry","the turf is dormant","measured at noon"],"feedback":"Moisture strongly influences soil strength.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q182","module":"M18","question":"Per the textbook, the protective cover provided by turfgrasses reduces soil compaction from traffic and:","correct":"splashing raindrops","options":["splashing raindrops","root growth","earthworms","mowing clippings"],"feedback":"Traffic, splashing raindrops, and other forces.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q183","module":"M18","question":"Thatch, as a growth medium, is described as:","correct":"well-aerated and compaction-resistant, with poor nutrient- and water-holding properties","options":["well-aerated and compaction-resistant, with poor nutrient- and water-holding properties","poorly aerated and easily compacted","high in nutrient-holding capacity","identical to mat"],"feedback":"Well-aerated, compaction-resistant, poor holding capacity.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q184","module":"M18","question":"A mat layer is considered especially desirable in turfs receiving:","correct":"frequent or intensive traffic","options":["frequent or intensive traffic","no traffic","only wildlife traffic","winter dormancy"],"feedback":"Mat is desirable under frequent or intensive traffic.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q185","module":"M18","question":"Mat provides better surface resiliency and:","correct":"stabilizes turf against impacting forces from traffic and play","options":["stabilizes turf against impacting forces from traffic and play","prevents all disease","increases compaction","repels water"],"feedback":"It stabilizes turf against impacting forces.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q186","module":"M18","question":"Excess salts reduce plant-available water, making plants more susceptible to environmental stresses, including:","correct":"wear","options":["wear","overseeding","mowing","fertilization"],"feedback":"Salt-induced water deficits increase susceptibility to wear.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q187","module":"M18","question":"Traffic, along with splashing rain or irrigation and cultivation, tends to:","correct":"destroy soil structure","options":["destroy soil structure","build soil aggregates","add organic matter","increase macroporosity"],"feedback":"These forces destroy soil structure.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q188","module":"M18","question":"Per Table 3.17, the most wear-resistant cool-season turfgrass is:","correct":"tall fescue","options":["tall fescue","rough bluegrass","creeping bentgrass","fine fescue"],"feedback":"Tall fescue is most wear resistant among cool-season grasses.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"},{"id":"m18q189","module":"M18","question":"Among popular turfgrasses, which ranks lowest in wear resistance?","correct":"rough bluegrass","options":["rough bluegrass","tall fescue","zoysiagrass","bermudagrass"],"feedback":"Rough bluegrass ranks lowest.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"},{"id":"m18q190","module":"M18","question":"Zoysiagrasses are very wear resistant but:","correct":"very slow to recover from injury","options":["very slow to recover from injury","have excellent recuperative capacity","cannot be mowed","are cool-season grasses"],"feedback":"Very slow to recover.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"},{"id":"m18q191","module":"M18","question":"Creeping bentgrass ranks only fair in wear resistance but has:","correct":"excellent recuperative ability","options":["excellent recuperative ability","the poorest recuperative ability","the highest wear resistance","no stolons"],"feedback":"Excellent recuperative capacity via stolons.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"},{"id":"m18q192","module":"M18","question":"Elasticity, the tendency of leaves to spring back after compression, is dramatically reduced when turf is:","correct":"frozen","options":["frozen","wet","fertilized","mowed high"],"feedback":"Elasticity drops when frozen; avoid traffic on frosted turf.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"},{"id":"m18q193","module":"M18","question":"Frost disappearance on turf can be accelerated so traffic can resume sooner by:","correct":"early-morning syringing","options":["early-morning syringing","rolling","topdressing","fertilizing"],"feedback":"Early-morning syringing accelerates frost removal.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"},{"id":"m18q194","module":"M18","question":"At higher mowing heights, the same genotype will often have more verdure and:","correct":"better wear resistance","options":["better wear resistance","poorer wear resistance","less resiliency","less rigidity"],"feedback":"More verdure, better wear resistance.","source":"Textbook Ch. 2-3: Functional Quality and Wear Resistance (pp. 14-16, 89-90)","kind":"enrichment"}];const KEY='turf235_exam2_m18_18_textbook_2_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>Textbook 2/2 cleared</h2><p>You retired all 39 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart Textbook 2/2 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
