const BANK=[{"id":"m18q116","module":"M18","question":"Per the textbook, the biotic component of the turfgrass environment includes primarily:","correct":"the use and culture of the turf by people","options":["the use and culture of the turf by people","earthworms only","fungi and bacteria only","weather patterns"],"feedback":"Biotic: primarily people's use and culture of the turf.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q117","module":"M18","question":"According to Turgeon, the most formidable of adverse influences against turfgrass persistence and quality frequently are:","correct":"human activities","options":["human activities","insects","diseases","earthworms"],"feedback":"Human activities frequently constitute the most formidable adverse influences.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q118","module":"M18","question":"The textbook names which conditions as reflecting the type and intensity of human activities on turf?","correct":"wear and breakage of the turf, and displacement and compaction of the soil","options":["wear and breakage of the turf, and displacement and compaction of the soil","thatch and mat formation","black layer and hydrophobicity","salinity and sodicity"],"feedback":"Wear, breakage, displacement, compaction.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q119","module":"M18","question":"The textbook defines wear as:","correct":"the physical deterioration of a turfgrass community resulting from excessive traffic","options":["the physical deterioration of a turfgrass community resulting from excessive traffic","the removal of turf by golf clubs","the displacement of soil by vehicles","the compression of soil into a dense mass"],"feedback":"Wear: physical deterioration from excessive traffic.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q120","module":"M18","question":"What constitutes \"excessive\" traffic varies with turfgrass genotype, edaphic and climatic conditions, and the:","correct":"physiological condition of the plants","options":["physiological condition of the plants","color of the turf","price of the seed","size of the field"],"feedback":"Genotype, physiological condition, edaphic and climatic conditions.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q121","module":"M18","question":"The textbook contrasts which turf as much more susceptible to wear than a well-cared-for bermudagrass turf on a sunny, sandy site?","correct":"a rough bluegrass turf in a wet, shaded environment","options":["a rough bluegrass turf in a wet, shaded environment","a tall fescue turf in full sun","a zoysiagrass tee","a perennial ryegrass athletic field"],"feedback":"Rough bluegrass in a wet, shaded environment.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q122","module":"M18","question":"Turgeon calls the rough bluegrass vs. bermudagrass wear comparison somewhat misleading because:","correct":"bermudagrass would not survive where rough bluegrass is well adapted","options":["bermudagrass would not survive where rough bluegrass is well adapted","both have identical wear tolerance","rough bluegrass is a warm-season grass","bermudagrass is never used on sand"],"feedback":"Bermudagrass would not survive in rough bluegrass habitat.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q123","module":"M18","question":"Direct pressure tends to crush shoots, especially when the plants are:","correct":"stiff with frost or wilted","options":["stiff with frost or wilted","freshly fertilized","actively growing","mowed high"],"feedback":"Especially when stiff with frost or wilted.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q124","module":"M18","question":"Because wear tolerance varies from site to site and season to season, a traffic threshold level must be determined:","correct":"for each location and time of year","options":["for each location and time of year","once for the entire country","only at establishment","only for golf greens"],"feedback":"For each location and time of year.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q125","module":"M18","question":"On golf courses, traffic on greens, approaches, exit lanes, and tees can be made less concentrated by:","correct":"coordinating placement of pins and tee markers","options":["coordinating placement of pins and tee markers","lowering mowing heights","closing the course","applying more nitrogen"],"feedback":"Coordinating pin and tee marker placement.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q126","module":"M18","question":"Per the textbook, shifting sand trap positions can reduce wear by:","correct":"providing wider traffic lanes","options":["providing wider traffic lanes","increasing compaction","reducing drainage","concentrating traffic"],"feedback":"Wider traffic lanes plus improved drainage reduce wear.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q127","module":"M18","question":"On athletic fields used for practice, wear can be reduced by:","correct":"shifting intensive traffic to different field locations","options":["shifting intensive traffic to different field locations","practicing only in the goal mouths","mowing lower","eliminating irrigation"],"feedback":"Shift practice to different locations to promote recovery.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q128","module":"M18","question":"Strategic placement of ornamental plantings, sidewalks, and fences can be used to:","correct":"uniformly distribute or concentrate traffic","options":["uniformly distribute or concentrate traffic","increase soil compaction","increase disease","raise soil pH"],"feedback":"They distribute or concentrate traffic for better turf.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q129","module":"M18","question":"Which cultural consideration does the textbook give for improving wearability by providing larger, more vigorous shoots?","correct":"raising the mowing height","options":["raising the mowing height","lowering the mowing height","increasing nitrogen","eliminating cultivation"],"feedback":"Raise mowing height for larger, more vigorous shoots.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q130","module":"M18","question":"Adjusting fertilization and irrigation practices improves wearability by reducing:","correct":"plant succulence","options":["plant succulence","root growth","verdure","photosynthesis"],"feedback":"Reduce plant succulence.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q131","module":"M18","question":"Which conditions require that traffic be avoided entirely, per the textbook?","correct":"frosted leaves, winter-dormant turfgrass, and wet soil","options":["frosted leaves, winter-dormant turfgrass, and wet soil","dry sand and full sun","high mowing and low nitrogen","after core cultivation only"],"feedback":"Frost, winter dormancy, and wet soil.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q132","module":"M18","question":"Per Turgeon, moderately shaded turfgrass may be so weak that it is intolerant of:","correct":"all but minimal traffic","options":["all but minimal traffic","any fertilization","any mowing","sunlight"],"feedback":"Moderately shaded turf tolerates only minimal traffic.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q133","module":"M18","question":"Turf breakage results from activities that:","correct":"disrupt the structural integrity of the turf","options":["disrupt the structural integrity of the turf","add soil to thatch","raise the mowing height","compress soil particles"],"feedback":"Breakage disrupts structural integrity.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q134","module":"M18","question":"A golf ball landing on a green can tear the turf surface, producing a:","correct":"ball mark","options":["ball mark","divot","rut","pan"],"feedback":"Ball marks.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q135","module":"M18","question":"Ball marks are most likely to tear the turf where plants are:","correct":"shallow rooted","options":["shallow rooted","deeply rooted","dormant","heavily thatched with mat"],"feedback":"Especially where plants are shallow rooted.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q136","module":"M18","question":"If ball marks are not repaired, mowing can:","correct":"scalp the upraised plants and soil, causing more severe injury","options":["scalp the upraised plants and soil, causing more severe injury","heal them automatically","raise the traffic threshold","decompose thatch"],"feedback":"Mowing scalps the upraised plants and soil.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q137","module":"M18","question":"Ball marks should be repaired by:","correct":"carefully reshaping the turf surface","options":["carefully reshaping the turf surface","applying fungicide","core cultivating","syringing"],"feedback":"Repair by carefully reshaping the surface.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q138","module":"M18","question":"Golf shots and other physical forces that rip out sections of sod cause:","correct":"divots","options":["divots","ball marks","pans","black layer"],"feedback":"Ripped-out sections of sod are divots.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q139","module":"M18","question":"Divot size is influenced by the physical force, turfgrass species, cultural practices, and the:","correct":"overall condition of the turf","options":["overall condition of the turf","color of the ball","time of day","fertilizer brand"],"feedback":"And the overall condition of the turf.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q140","module":"M18","question":"Divot repair may include:","correct":"replacing torn sod or filling divots with soil (and perhaps seed)","options":["replacing torn sod or filling divots with soil (and perhaps seed)","applying herbicide","core cultivating the divot","rolling only"],"feedback":"Replace sod or fill with soil and seed.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q141","module":"M18","question":"Soil displacement and rutting occur where foot or vehicular traffic:","correct":"substantially changes the shape of the turf surface","options":["substantially changes the shape of the turf surface","removes leaf tissue only","compresses thatch","spreads disease"],"feedback":"Traffic changes the shape of the surface.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q142","module":"M18","question":"The textbook lists turf susceptibility to rutting as a function of soil moisture, texture, and strength, the intensity and duration of traffic, and:","correct":"the extent to which roots and lateral shoots enhance the shear strength of the turf","options":["the extent to which roots and lateral shoots enhance the shear strength of the turf","the color of the turf","the mowing direction","the fertilizer analysis"],"feedback":"Roots and lateral shoots enhance shear strength.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q143","module":"M18","question":"The textbook defines compaction as:","correct":"compression of soil constituents into a relatively dense mass","options":["compression of soil constituents into a relatively dense mass","tearing of leaf tissue","removal of sod by a club","accumulation of thatch"],"feedback":"Compression into a relatively dense mass.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q144","module":"M18","question":"A moderate amount of compaction may be desirable in turf soils to provide:","correct":"a firm surface and favorable root-soil contact","options":["a firm surface and favorable root-soil contact","better drainage","more macropores","more thatch"],"feedback":"Firm surface and root-to-soil contact.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q145","module":"M18","question":"Severe compaction is usually associated with inadequate aeration and poor drainage due to the loss of:","correct":"aeration porosity","options":["aeration porosity","capillary porosity","bulk density","organic matter"],"feedback":"Loss of aeration porosity.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q146","module":"M18","question":"A claypan and a hardpan are examples of:","correct":"genetic pans","options":["genetic pans","induced pans","plow soles","black layers"],"feedback":"Genetic pans form naturally.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q147","module":"M18","question":"A claypan forms due to:","correct":"very high clay content present during soil formation","options":["very high clay content present during soil formation","tine penetration","sulfur-reducing bacteria","wheel traffic"],"feedback":"High clay content during formation.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q148","module":"M18","question":"A hardpan forms from:","correct":"cementation of soil particles by organic matter or inorganic materials","options":["cementation of soil particles by organic matter or inorganic materials","high clay content alone","plow pressure","foot traffic"],"feedback":"Cementation of particles.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q149","module":"M18","question":"Induced pans result from:","correct":"pressure applied by cultivation or tillage operations","options":["pressure applied by cultivation or tillage operations","natural soil formation","high clay content","earthworm activity"],"feedback":"Pressure from cultivation or tillage.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q150","module":"M18","question":"In field crop culture, the induced pan that develops at plow depth is called a:","correct":"plow sole","options":["plow sole","claypan","hardpan","black layer"],"feedback":"A plow sole.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q151","module":"M18","question":"With core cultivation, an induced pan may also occur:","correct":"along the sides of the holes","options":["along the sides of the holes","on the leaf surfaces","in the clippings","only in sand"],"feedback":"At maximum tine depth and possibly along hole sides.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q152","module":"M18","question":"Surface compaction of turf soils occurs primarily in response to:","correct":"traffic","options":["traffic","earthworms","freezing and thawing","rainfall alone"],"feedback":"Primarily in response to traffic.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q153","module":"M18","question":"With surface compaction, which properties increase?","correct":"bulk density, soil strength, and water-holding capacity","options":["bulk density, soil strength, and water-holding capacity","aeration porosity, infiltration, and percolation","total porosity","macropore volume"],"feedback":"BD, strength, and water-holding capacity increase.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q154","module":"M18","question":"With surface compaction, which properties decrease?","correct":"aeration porosity, water infiltration, and percolation","options":["aeration porosity, water infiltration, and percolation","bulk density","soil strength","water-holding capacity"],"feedback":"Aeration porosity, infiltration, and percolation decrease.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"},{"id":"m18q155","module":"M18","question":"Increased bulk density after compaction results from:","correct":"the reduction in soil volume","options":["the reduction in soil volume","the addition of organic matter","increased particle density","more macropores"],"feedback":"Reduced volume raises BD.","source":"Textbook Ch. 4: The Turfgrass Environment (traffic-related passages, pp. 94-139)","kind":"enrichment"}];const KEY='turf235_exam2_m18_18_textbook_1_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>Textbook 1/2 cleared</h2><p>You retired all 40 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart Textbook 1/2 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
