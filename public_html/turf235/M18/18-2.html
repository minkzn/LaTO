const BANK=[{"id":"m18q010","module":"M18","question":"In M18.2, traffic simply means:","correct":"the pursuit of activities on a turfgrass surface","options":["the pursuit of activities on a turfgrass surface","vehicles crossing turf only","mowing operations only","the movement of water across turf"],"feedback":"Traffic simply means the pursuit of activities on a turfgrass surface.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q011","module":"M18","question":"Traffic on a turf may include sports and recreational activities, but it could include:","correct":"virtually any activity","options":["virtually any activity","only golf","only vehicle use","only maintenance equipment"],"feedback":"It could include virtually any activity.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q012","module":"M18","question":"Whether traffic-related damage occurs depends on the traffic's:","correct":"nature, intensity, and duration","options":["nature, intensity, and duration","color, sound, and timing","cost, labor, and equipment","pH, salinity, and texture"],"feedback":"Depending on the nature, intensity, and duration of traffic, damage may occur.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q013","module":"M18","question":"Which four forms of traffic-related turf damage are named in M18.2?","correct":"turfgrass wear, soil compaction, rutting, and divoting","options":["turfgrass wear, soil compaction, rutting, and divoting","scalping, scald, black layer, and thatch","dollar spot, brown patch, rust, and red thread","wilting, dormancy, chlorosis, and frost"],"feedback":"Wear, compaction, rutting, and divoting.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q014","module":"M18","question":"Turfgrass wear refers to:","correct":"physical deterioration of turfgrass plant tissue from compression, tearing, or other forces","options":["physical deterioration of turfgrass plant tissue from compression, tearing, or other forces","displacement of soil by wheels","removal of turf sections by a golf club","destruction of soil structure"],"feedback":"Wear is the physical deterioration of plant tissue from compression, tearing, or other forces.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q015","module":"M18","question":"Recovery from turfgrass wear can occur as long as the:","correct":"crown tissue survives","options":["crown tissue survives","leaf tips survive","thatch remains intact","soil stays dry"],"feedback":"Recovery can occur as long as the crown tissue survives.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q016","module":"M18","question":"Severely worn turfs may be so weakened that they are highly susceptible to:","correct":"disease and environmental stresses","options":["disease and environmental stresses","overseeding","herbicide uptake","excess growth"],"feedback":"Severely worn turfs are highly susceptible to disease and environmental stresses.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q017","module":"M18","question":"Soil compaction results where traffic:","correct":"destroys soil structure","options":["destroys soil structure","removes leaf tissue","adds organic matter","displaces soil into ruts"],"feedback":"Compaction results where traffic destroys soil structure.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q018","module":"M18","question":"Soil compaction dramatically changes porosity by:","correct":"reducing macroporosity and increasing microporosity","options":["reducing macroporosity and increasing microporosity","increasing macroporosity and reducing microporosity","increasing both","reducing both equally"],"feedback":"Macroporosity drops, microporosity rises.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q019","module":"M18","question":"Which is NOT listed in M18.2 as a result of soil compaction?","correct":"increased infiltration","options":["increased infiltration","increased runoff","oxygen deficiencies in the root zone","reduced percolation"],"feedback":"Compaction reduces infiltration and percolation and increases runoff.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q020","module":"M18","question":"Compaction leads to a substantial decline in turfgrass growth and quality partly because of:","correct":"oxygen deficiencies in the root zone","options":["oxygen deficiencies in the root zone","excess oxygen in the root zone","increased percolation","reduced runoff"],"feedback":"Oxygen deficiencies in the root zone result.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q021","module":"M18","question":"In the soil compaction diagram, bulk density rises from 1.0 to:","correct":"1.4","options":["1.4","2.65","0.8","1.1"],"feedback":"BD 1.0 uncompacted vs. BD 1.4 compacted.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q022","module":"M18","question":"In the compaction diagram, the uncompacted soil has a bulk density of:","correct":"1.0","options":["1.0","1.4","2.65","0.5"],"feedback":"The left panel is labeled BD 1.0.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q023","module":"M18","question":"Rutting occurs where:","correct":"wheel traffic displaces soil, leaving deep ruts","options":["wheel traffic displaces soil, leaving deep ruts","a golf club removes turf","frost forms on leaves","foot traffic tears leaf blades only"],"feedback":"Rutting is wheel traffic displacing soil.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q024","module":"M18","question":"Divoting specifically refers to removal of sections of turf by a:","correct":"golf club","options":["golf club","football cleat","mower reel","cart tire"],"feedback":"Divoting specifically refers to removal by a golf club.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q025","module":"M18","question":"In M18.2, divoting can be extended to mean any type of turf disruption, including damage from:","correct":"football cleats","options":["football cleats","frost","drought","fertilizer burn"],"feedback":"It can be extended to include damage from football cleats.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q026","module":"M18","question":"The traffic threshold (TT) is the traffic intensity:","correct":"above which a measurable deterioration in turf quality is likely to occur","options":["above which a measurable deterioration in turf quality is likely to occur","below which turf stops growing","at which turf goes dormant","that maximizes turf density"],"feedback":"TT is the intensity above which measurable deterioration is likely.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q027","module":"M18","question":"One method for dealing with excessive traffic is to reduce the traffic intensity to a level:","correct":"below the traffic threshold","options":["below the traffic threshold","above the traffic threshold","equal to zero","equal to the wilting point"],"feedback":"Reduce traffic intensity below TT.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q028","module":"M18","question":"The two strategies for reducing traffic intensity are:","correct":"dilution and concentration","options":["dilution and concentration","aeration and topdressing","syringing and irrigation","fertilization and mowing"],"feedback":"Dilution or concentration.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q029","module":"M18","question":"Through a dilution strategy, traffic is:","correct":"distributed over a larger area, reducing intensity per unit area","options":["distributed over a larger area, reducing intensity per unit area","kept off turf by concentrating it on paths","banned entirely","shifted to night hours only"],"feedback":"Dilution spreads traffic over a large area.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q030","module":"M18","question":"Through a concentration strategy, traffic is:","correct":"kept off the turf by concentrating it on inanimate surfaces","options":["kept off the turf by concentrating it on inanimate surfaces","spread evenly over all turf","concentrated on the healthiest turf","moved onto shaded turf"],"feedback":"Concentration keeps traffic on paths and sidewalks.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q031","module":"M18","question":"Golf cart paths and sidewalks are examples of which traffic strategy?","correct":"concentration","options":["concentration","dilution","raising the traffic threshold","cultivation"],"feedback":"They concentrate traffic on inanimate surfaces.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q032","module":"M18","question":"Spreading foot traffic across a wide area of turf so no spot is used heavily is an example of:","correct":"dilution","options":["dilution","concentration","compaction","divoting"],"feedback":"Dilution distributes traffic over a larger area.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q033","module":"M18","question":"In the first traffic-threshold graph, the arrow moves a point from above the TT line to below it. This represents:","correct":"reducing traffic intensity below the traffic threshold","options":["reducing traffic intensity below the traffic threshold","raising the traffic threshold","increasing traffic intensity","lowering the traffic threshold"],"feedback":"The point (traffic intensity) drops below TT.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q034","module":"M18","question":"The axes on the M18.2 traffic threshold graphs are:","correct":"traffic intensity (y) versus time (x)","options":["traffic intensity (y) versus time (x)","soil moisture versus depth","turf quality versus mowing height","temperature versus time"],"feedback":"Traffic intensity is plotted against time.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q035","module":"M18","question":"An alternate approach to managing traffic is to:","correct":"increase the traffic threshold above the traffic intensity","options":["increase the traffic threshold above the traffic intensity","lower the traffic threshold","increase the traffic intensity","eliminate mowing"],"feedback":"Raise TT to a level above the traffic intensity.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q036","module":"M18","question":"Which is NOT listed in M18.2 as a way to raise the traffic threshold?","correct":"lowering the mowing height","options":["lowering the mowing height","improving light penetration and drainage","optimizing fertility and irrigation","establishing a more traffic-tolerant turfgrass"],"feedback":"Raising, not lowering, the mowing height raises TT.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q037","module":"M18","question":"Per M18.2, to raise the traffic threshold you should adjust the mowing height by:","correct":"raising it","options":["raising it","lowering it","eliminating mowing","mowing twice daily"],"feedback":"Raising the mowing height is listed.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q038","module":"M18","question":"In the second traffic-threshold graph with TT1 and TT2, the arrows between the two lines illustrate that:","correct":"the traffic threshold itself can be moved up or down","options":["the traffic threshold itself can be moved up or down","traffic intensity is constant","time has no effect","turf quality equals traffic intensity"],"feedback":"TT can be raised (or lowered) by management.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q039","module":"M18","question":"Shaded turf has which characteristics?","correct":"thinner leaves and cuticles, shallower rooting, and reduced carbohydrate reserves","options":["thinner leaves and cuticles, shallower rooting, and reduced carbohydrate reserves","thicker cuticles and deeper roots","more carbohydrate reserves","higher tiller density"],"feedback":"Shade produces thinner leaves and cuticles, shallow roots, low reserves.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q040","module":"M18","question":"Because of its morphology and low reserves, shaded turf is:","correct":"more delicate and less tolerant of traffic, disease, and environmental stresses","options":["more delicate and less tolerant of traffic, disease, and environmental stresses","more tolerant of traffic","immune to disease","unaffected by traffic"],"feedback":"Shaded turf is more delicate and less tolerant.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q041","module":"M18","question":"Per M18.2, simply increasing which factor can produce a healthier, more traffic-tolerant turf?","correct":"light penetration","options":["light penetration","nitrogen rate","irrigation frequency","soil compaction"],"feedback":"Simply increasing light penetration helps.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q042","module":"M18","question":"In the morning vs. afternoon shade photos, the turf under morning shade was labeled:","correct":"poorly rooted turfgrass","options":["poorly rooted turfgrass","well rooted turfgrass","thatch-free turfgrass","dormant turfgrass"],"feedback":"The morning-shade plug was labeled \"Poorly rooted turfgrass.\"","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q043","module":"M18","question":"Comparing the morning- and afternoon-shade plugs, which turf held together better?","correct":"the afternoon-shade turf","options":["the afternoon-shade turf","the morning-shade turf","both equally","neither held together"],"feedback":"The morning-shade plug fell apart as poorly rooted turfgrass.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q044","module":"M18","question":"Depending on the presence and activity of earthworms and other soil organisms, a soil-based turf may lack sufficient:","correct":"mat development to hold up well under intensive traffic","options":["mat development to hold up well under intensive traffic","thatch to cause disease","sand to drain","nitrogen to grow"],"feedback":"It may lack mat development for intensive traffic.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q045","module":"M18","question":"A soil-based turf lacking mat development is highly susceptible to:","correct":"compaction","options":["compaction","black layer","salt injury","hydrophobicity"],"feedback":"As a consequence, the soil is highly susceptible to compaction.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q046","module":"M18","question":"Under wet conditions with standing water, a soil-based turf may become soiled because:","correct":"suspended soil particles are deposited onto leaf surfaces after the water subsides","options":["suspended soil particles are deposited onto leaf surfaces after the water subsides","earthworms deposit casts on the leaves","sand topdressing is too coarse","mowers spread soil"],"feedback":"Suspended soil is deposited on leaves, leaving a soiled turf.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q047","module":"M18","question":"A sand-based turf without sufficient mat development may have poor wear resistance because of:","correct":"low resiliency of the sand and greater destruction of plant tissue under traffic","options":["low resiliency of the sand and greater destruction of plant tissue under traffic","high compaction of the sand","excessive thatch","high water-holding capacity"],"feedback":"Low resiliency of sand and greater tissue destruction.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q048","module":"M18","question":"Because structureless sand is resistant to compaction, aeration usually occurs:","correct":"as soon as gravitational water drains, drawing atmospheric air into the root zone","options":["as soon as gravitational water drains, drawing atmospheric air into the root zone","only after core cultivation","only in winter","never"],"feedback":"Air is drawn in once gravitational water drains.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q049","module":"M18","question":"Sand-based root zones are resistant to:","correct":"compaction","options":["compaction","wear","drought","nutrient leaching"],"feedback":"Structureless sand resists compaction.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q050","module":"M18","question":"A turf with substantial thatch development will be fairly resistant to:","correct":"wear and soil compaction","options":["wear and soil compaction","disease and environmental stress","drought","insects"],"feedback":"Substantial thatch resists wear and compaction.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q051","module":"M18","question":"The downside of excessive thatch development is increased susceptibility to:","correct":"diseases and environmental stresses","options":["diseases and environmental stresses","compaction","wear","rutting"],"feedback":"Excessive thatch increases disease and stress susceptibility.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q052","module":"M18","question":"Controlling thatch through cultivation and topdressing creates a:","correct":"mat layer","options":["mat layer","black layer","pan","hardpan"],"feedback":"It creates a mat layer (integrated soil/thatch medium).","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q053","module":"M18","question":"A mat layer is defined in M18.2 as an:","correct":"integrated soil/thatch medium","options":["integrated soil/thatch medium","undecomposed layer of stolons only","compacted clay pan","layer of pure sand"],"feedback":"Mat is an integrated soil/thatch medium.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q054","module":"M18","question":"A mat layer is desirable because it:","correct":"resists wear and compaction while reducing susceptibility to disease and stress","options":["resists wear and compaction while reducing susceptibility to disease and stress","increases disease susceptibility","prevents all root growth","repels water"],"feedback":"Mat resists wear and compaction and reduces disease and stress susceptibility.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q055","module":"M18","question":"In the soil / sand / thatch-soil profile illustration, which profile combines wear and compaction resistance with reduced stress susceptibility once thatch is managed?","correct":"thatch/soil (mat)","options":["thatch/soil (mat)","soil","sand","none of them"],"feedback":"Managed thatch with topdressing forms a mat combining the benefits.","source":"M18.2: Soil Traffic","kind":"module"},{"id":"m18q056","module":"M18","question":"Which practices are used to control thatch and create a mat layer?","correct":"cultivation and topdressing","options":["cultivation and topdressing","heavy nitrogen and frequent irrigation","lowering mowing height and syringing","fungicides and insecticides"],"feedback":"Cultivation and topdressing.","source":"M18.2: Soil Traffic","kind":"module"}];const KEY='turf235_exam2_m18_18_2_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.ma ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M18.2 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
