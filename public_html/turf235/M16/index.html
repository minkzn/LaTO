const BANK=[{"id":"m16q001","module":"M16","question":"The study of the atmospheric component of the environment is called:","correct":"climatology","options":["climatology","edaphology","ecology","phenology"],"feedback":"Climatology studies the atmospheric environment.","source":"M16.2: Climatology","kind":"module"},{"id":"m16q002","module":"M16","question":"The atmospheric conditions affecting turf are measurable as temperature, moisture, wind, and:","correct":"light","options":["light","soil pH","traffic","salinity"],"feedback":"Temperature, moisture, light, and wind.","source":"M16.2: Climatology","kind":"module"},{"id":"m16q003","module":"M16","question":"Daily changes in atmospheric conditions are caused by:","correct":"the earth rotating on its axis","options":["the earth rotating on its axis","the earth revolving around the sun","the phases of the moon","shifts in the jet stream"],"feedback":"Rotation = daily; revolution around the sun = seasonal.","source":"M16.2: Climatology","kind":"module"},{"id":"m16q004","module":"M16","question":"Seasonal changes in atmospheric conditions are caused by:","correct":"the earth revolving around the sun","options":["the earth revolving around the sun","the earth rotating on its axis","changing ocean tides","changes in solar output"],"feedback":"Revolution shifts the equator relative to insolation.","source":"M16.2: Climatology","kind":"module"},{"id":"m16q005","module":"M16","question":"Incoming solar radiation is called:","correct":"insolation","options":["insolation","insulation","irradiation","isotherm"],"feedback":"Insolation.","source":"M16.2: Climatology","kind":"module"},{"id":"m16q006","module":"M16","question":"During the northern hemisphere winter, insolation is most direct:","correct":"below the equator","options":["below the equator","above the equator","at the equator","at the Arctic Circle"],"feedback":"Spring/fall: at the equator; northern winter: below it.","source":"M16.2: Climatology","kind":"module"},{"id":"m16q007","module":"M16","question":"In the northern hemisphere, moving poleward, winters become:","correct":"more severe, with milder summers","options":["more severe, with milder summers","milder, with more intense summers","milder, with milder summers","more severe, with hotter summers"],"feedback":"Poleward: harsher winters, milder summers.","source":"M16.2: Climatology","kind":"module"},{"id":"m16q008","module":"M16","question":"Compared with continental areas, sites near oceans are:","correct":"milder in both summer and winter","options":["milder in both summer and winter","hotter in summer, colder in winter","colder in both summer and winter","identical in both seasons"],"feedback":"Water bodies moderate temperature swings.","source":"M16.2: Climatology","kind":"module"},{"id":"m16q009","module":"M16","question":"Per M16.3, average temperatures decrease appreciably with:","correct":"small increases in altitude","options":["small increases in altitude","small decreases in altitude","moving closer to the equator","higher soil organic matter"],"feedback":"Small altitude gains lower temperatures noticeably.","source":"M16.3: Topography","kind":"module"},{"id":"m16q010","module":"M16","question":"Solar radiation striking a leaf can be absorbed, transmitted, or:","correct":"reflected","options":["reflected","converted to water","stored as heat","fixed as nitrogen"],"feedback":"Absorbed, reflected, or transmitted.","source":"M16.4: Light","kind":"module"},{"id":"m16q011","module":"M16","question":"Turfgrasses absorb about what share of incident solar radiation?","correct":"50 to nearly 80 percent","options":["50 to nearly 80 percent","about 1 to 2 percent of it","roughly 10 to 20 percent","essentially 95 to 100 percent"],"feedback":"Depends on leaf orientation.","source":"M16.4: Light","kind":"module"},{"id":"m16q012","module":"M16","question":"Which leaf orientation absorbs solar radiation most efficiently?","correct":"horizontal","options":["horizontal","vertical","tightly rolled","folded at the midrib"],"feedback":"Horizontal leaves absorb more (about 0.94 vs. 0.62 for vertical).","source":"M16.4: Light","kind":"module"},{"id":"m16q013","module":"M16","question":"Only about what share of absorbed solar radiation is converted to chemical energy by photosynthesis?","correct":"1 to 2 percent","options":["1 to 2 percent","10 to 15 percent","about 25 percent","50 to 80 percent"],"feedback":"Most is reradiated as heat.","source":"M16.4: Light","kind":"module"},{"id":"m16q014","module":"M16","question":"Most solar energy absorbed by turfgrass is:","correct":"reradiated as heat at longer wavelengths","options":["reradiated as heat at longer wavelengths","stored as carbohydrate in the crown","reflected back as visible light","converted to far-red light in the leaf"],"feedback":"Reradiated at longer wavelengths, warming the air.","source":"M16.4: Light","kind":"module"},{"id":"m16q015","module":"M16","question":"With moderate shading, turfgrass leaf blades tend to become:","correct":"more upright","options":["more upright","more horizontal","tightly rolled","purple"],"feedback":"They \"reach up\" for light.","source":"M16.4: Light","kind":"module"},{"id":"m16q016","module":"M16","question":"Which is an effect of reduced light on turfgrass?","correct":"shallower rooting","options":["shallower rooting","thicker cuticles","higher carbohydrate reserves","increased tillering"],"feedback":"Shade: thinner, longer leaves; shallower roots; lower density and reserves.","source":"M16.4: Light","kind":"module"},{"id":"m16q017","module":"M16","question":"PAR stands for:","correct":"photosynthetically active radiation","options":["photosynthetically active radiation","plant-absorbed reflectance","primary atmospheric radiation","photoperiod activation ratio"],"feedback":"PAR.","source":"M16.4: Light","kind":"module"},{"id":"m16q018","module":"M16","question":"Per M16.4, PAR includes blue light at 400–500 nm and red light at:","correct":"600–700 nm","options":["600–700 nm","300–400 nm","500–600 nm","700–800 nm"],"feedback":"Red 600–700 nm.","source":"M16.4: Light","kind":"module"},{"id":"m16q019","module":"M16","question":"Net photosynthesis equals:","correct":"photosynthesis minus respiration","options":["photosynthesis minus respiration","photosynthesis plus respiration","respiration minus photosynthesis","photosynthesis times respiration"],"feedback":"Net = gross photosynthesis − respiration.","source":"M16.4: Light","kind":"module"},{"id":"m16q020","module":"M16","question":"In hot weather, cool-season grasses lose net photosynthesis to increased:","correct":"photorespiration","options":["photorespiration","photoperiodism","phototropism","guttation"],"feedback":"Photorespiration rises with heat.","source":"M16.4: Light","kind":"module"},{"id":"m16q021","module":"M16","question":"The PAR at which photosynthesis equals respiration is the:","correct":"light compensation point","options":["light compensation point","light saturation point","dew point","permanent wilting point"],"feedback":"Net photosynthesis = 0.","source":"M16.4: Light","kind":"module"},{"id":"m16q022","module":"M16","question":"The PAR at which net photosynthesis reaches its maximum is the:","correct":"light saturation point","options":["light saturation point","light compensation point","photoperiod threshold","red/far-red point"],"feedback":"Maximum net photosynthesis.","source":"M16.4: Light","kind":"module"},{"id":"m16q023","module":"M16","question":"For cool-season turfgrasses, the light saturation point is about:","correct":"one-third of full sunlight","options":["one-third of full sunlight","one-tenth of full sunlight","two-thirds of full sunlight","full sunlight"],"feedback":"Warm-season grasses saturate much higher.","source":"M16.4: Light","kind":"module"},{"id":"m16q024","module":"M16","question":"Light transmitted through tree leaves is enriched in:","correct":"far-red light","options":["far-red light","red light","blue light","ultraviolet light"],"feedback":"Trees absorb red, lowering the red:far-red ratio.","source":"M16.4: Light","kind":"module"},{"id":"m16q025","module":"M16","question":"On greens, which shade is usually more damaging?","correct":"morning shade","options":["morning shade","afternoon shade","evening shade","midday shade"],"feedback":"Morning is when cool temperatures allow high net photosynthesis.","source":"M16.4: Light","kind":"module"},{"id":"m16q026","module":"M16","question":"Morning shade on a green comes from trees on which side?","correct":"east","options":["east","west","north","south"],"feedback":"East-side trees shade in the morning.","source":"M16.4: Light","kind":"module"},{"id":"m16q027","module":"M16","question":"Mild afternoon shade can benefit a green by reducing:","correct":"moisture stress and photorespiration","options":["moisture stress and photorespiration","PAR reaching the canopy and photosynthesis","dew and guttation on leaf surfaces","tillering and overall shoot density"],"feedback":"West-side shade in the afternoon can help.","source":"M16.4: Light","kind":"module"},{"id":"m16q028","module":"M16","question":"Red light converts phytochrome to:","correct":"Pfr, the active form","options":["Pfr, the active form","Pr, the inactive form","chlorophyll","abscisic acid"],"feedback":"Red → Pfr; far-red or darkness → Pr.","source":"M16.4: Light","kind":"module"},{"id":"m16q029","module":"M16","question":"Active phytochrome (Pfr):","correct":"inhibits elongation and promotes tillering","options":["inhibits elongation and promotes tillering","promotes elongation and inhibits tillering","promotes elongation and tillering","inhibits elongation and tillering"],"feedback":"Low Pfr under shade gives tall, thin plants.","source":"M16.4: Light","kind":"module"},{"id":"m16q030","module":"M16","question":"The ultimate shading problem, such as heavy clippings left on turf, is called:","correct":"light exclusion","options":["light exclusion","light saturation","photoperiodism","etiolation"],"feedback":"In hot weather injury can occur within hours.","source":"M16.4: Light","kind":"module"},{"id":"m16q031","module":"M16","question":"Short day lengths typically give turfgrasses:","correct":"more tillers and a prostrate habit","options":["more tillers and a prostrate habit","fewer tillers and longer leaves","larger, more upright shoots","no change in growth"],"feedback":"Short days: denser, shorter leaves, prostrate.","source":"M16.4: Light","kind":"module"},{"id":"m16q032","module":"M16","question":"The most important factor in a turfgrass's adaptation to a region is:","correct":"temperature","options":["temperature","wind","soil texture","photoperiod"],"feedback":"Temperature.","source":"M16.5: Temperature","kind":"module"},{"id":"m16q033","module":"M16","question":"Which list matches M16.5's processes of heat transfer?","correct":"radiation, conduction, convection, advection, evaporation","options":["radiation, conduction, convection, advection, evaporation","transpiration, guttation, exudation, evaporation, wind","radiation, respiration, photosynthesis, convection","conduction, insolation, condensation, sublimation"],"feedback":"Five heat transfer processes.","source":"M16.5: Temperature","kind":"module"},{"id":"m16q034","module":"M16","question":"\"Heat island\" turfs are stressed because:","correct":"nearby surfaces re-radiate absorbed heat","options":["nearby surfaces re-radiate absorbed heat","they receive less total sunlight overall","surrounding trees keep them shaded","nearby water bodies keep them cool"],"feedback":"Adjacent areas absorb and re-radiate heat.","source":"M16.5: Temperature","kind":"module"},{"id":"m16q035","module":"M16","question":"Compared with inland areas, Chicago's north shore along Lake Michigan is:","correct":"cooler in summer, warmer in winter","options":["cooler in summer, warmer in winter","warmer in summer, cooler in winter","warmer in both seasons","cooler in both seasons"],"feedback":"The lake moderates temperatures.","source":"M16.5: Temperature","kind":"module"},{"id":"m16q036","module":"M16","question":"Downtown Chicago, compared with inland areas, is:","correct":"warmer in summer and winter","options":["warmer in summer and winter","cooler in summer and winter","cooler in summer, warmer in winter","the same in both seasons"],"feedback":"Heat island effect.","source":"M16.5: Temperature","kind":"module"},{"id":"m16q037","module":"M16","question":"The three cardinal temperatures that bound turfgrass growth are minimum effective, maximum effective, and:","correct":"optimum","options":["optimum","dew point","minimum survival","freezing point"],"feedback":"Survival min/max are the two extra cardinal temperatures.","source":"M16.5: Temperature","kind":"module"},{"id":"m16q038","module":"M16","question":"The lowest daily temperature usually occurs:","correct":"just before sunrise","options":["just before sunrise","around midnight","right at sunset","in the early afternoon"],"feedback":"Highest at midday; lowest just before sunrise.","source":"M16.5: Temperature","kind":"module"},{"id":"m16q039","module":"M16","question":"Compared with air 5 feet above ground, bare-soil surface temperature:","correct":"fluctuates more widely","options":["fluctuates more widely","fluctuates less","stays nearly constant","is always cooler"],"feedback":"Weather services measure at 5 ft.","source":"M16.5: Temperature","kind":"module"},{"id":"m16q040","module":"M16","question":"The quantitative effect of shade is reduced PAR; the qualitative effect is:","correct":"phytochrome responses","options":["phytochrome responses","more photorespiration","higher soil temperature","increased dew formation"],"feedback":"Quality = altered red:far-red, phytochrome responses.","source":"M16.5: Temperature","kind":"module"},{"id":"m16q041","module":"M16","question":"The three causes of ice-related damage listed in M16.6 are crown hydration, ice encasement, and:","correct":"gas-related problems","options":["gas-related problems","winter desiccation","light exclusion","frost heaving"],"feedback":"Gas problems include anoxia, hypoxia, toxic gases.","source":"M16.6: Ice Damage","kind":"module"},{"id":"m16q042","module":"M16","question":"Complete depletion of oxygen under ice is called:","correct":"anoxia","options":["anoxia","hypoxia","hyperoxia","asphyxia"],"feedback":"Anoxia = none; hypoxia = reduced.","source":"M16.6: Ice Damage","kind":"module"},{"id":"m16q043","module":"M16","question":"Crown hydration damage involves:","correct":"ice crystals forming inside the crowns","options":["ice crystals forming inside the crowns","oxygen depletion beneath ice","freezing in leaf intercellular spaces","winter wind desiccation"],"feedback":"Membrane disruption in crowns.","source":"M16.6: Ice Damage","kind":"module"},{"id":"m16q044","module":"M16","question":"Crown hydration is most likely:","correct":"on poorly drained sites in early spring","options":["on poorly drained sites in early spring","on sand greens during midsummer heat","under deep, lasting midwinter snow","on south-facing slopes in the fall"],"feedback":"Poor drainage plus a rapid temperature drop.","source":"M16.6: Ice Damage","kind":"module"},{"id":"m16q045","module":"M16","question":"Ice encasement damage involves:","correct":"rapid freezing in intercellular spaces","options":["rapid freezing in intercellular spaces","ice crystals forming within the crowns","buildup of toxic gases beneath ice","slow formation of black ice"],"feedback":"Membrane disruption from intercellular freezing.","source":"M16.6: Ice Damage","kind":"module"},{"id":"m16q046","module":"M16","question":"In the M16.6 crown-hydration photo, the dead patches on the green were:","correct":"annual bluegrass","options":["annual bluegrass","creeping bentgrass","perennial ryegrass","Kentucky bluegrass"],"feedback":"Bentgrass survived; annual bluegrass died.","source":"M16.6: Ice Damage","kind":"module"},{"id":"m16q047","module":"M16","question":"Crown hydration in green depressions can be dramatically reduced by:","correct":"improving surface drainage","options":["improving surface drainage","raising the mowing height","applying more nitrogen","breaking up the ice"],"feedback":"Remove standing water.","source":"M16.6: Ice Damage","kind":"module"},{"id":"m16q048","module":"M16","question":"A green's ice was broken up, melted, refroze, and the green died. The lesson is:","correct":"remove ice or leave it undisturbed","options":["remove ice or leave it undisturbed","always break ice and leave it","apply salt to melt ice","flood the green to thicken ice"],"feedback":"Broken ice that refreezes is worse.","source":"M16.6: Ice Damage","kind":"module"},{"id":"m16q049","module":"M16","question":"The two factors that largely decide survival of a long ice event are:","correct":"species and degree of fall hardening","options":["species and degree of fall hardening","mowing height and nitrogen source","soil pH and thatch depth","irrigation and traffic levels"],"feedback":"Species × hardening.","source":"M16.7: Species x Hardening Interaction","kind":"module"},{"id":"m16q050","module":"M16","question":"Which two species sit at opposite ends of ice tolerance?","correct":"creeping bentgrass and annual bluegrass","options":["creeping bentgrass and annual bluegrass","perennial ryegrass and tall fescue","Kentucky bluegrass and rough bluegrass","bermudagrass and zoysiagrass"],"feedback":"Bentgrass most tolerant; annual bluegrass least.","source":"M16.7: Species x Hardening Interaction","kind":"module"},{"id":"m16q051","module":"M16","question":"Under ice, survival is a race against time because the crown:","correct":"respires its TNC reserves anaerobically","options":["respires its TNC reserves anaerobically","photosynthesizes slowly under clear ice","absorbs dissolved sugars from the ice","stops respiring entirely until the thaw"],"feedback":"No photosynthesis; reserves drain.","source":"M16.7: Species x Hardening Interaction","kind":"module"},{"id":"m16q052","module":"M16","question":"In the species × hardening graph, unhardened creeping bentgrass survived at:","correct":"under 20%, near annual bluegrass","options":["under 20%, near annual bluegrass","about 50 percent survival","about 85 percent, like hardened plants","essentially complete survival"],"feedback":"Hardening can matter as much as species.","source":"M16.7: Species x Hardening Interaction","kind":"module"},{"id":"m16q053","module":"M16","question":"Per Tables 16.7.1–2, as ice cover lasted from 30 to 90 days, crown TNC:","correct":"decreased in all plants","options":["decreased in all plants","increased in all plants","increased only when hardened","stayed constant"],"feedback":"TNC fell with duration; survival fell with it.","source":"M16.7: Species x Hardening Interaction","kind":"module"},{"id":"m16q054","module":"M16","question":"Per Table 16.7.2, unhardened crowns under 90 days of ice had about:","correct":"1% survival","options":["1% survival","10% survival","31% survival","49% survival"],"feedback":"Hardened crowns at 90 days: about 49%.","source":"M16.7: Species x Hardening Interaction","kind":"module"},{"id":"m16q055","module":"M16","question":"Per Table 16.7.1, hardened crowns under 90 days of ice had about:","correct":"49% survival","options":["49% survival","1% survival","10% survival","85% survival"],"feedback":"Hardened 90 days: 4.5% TNC, 49% survival.","source":"M16.7: Species x Hardening Interaction","kind":"module"},{"id":"m16q056","module":"M16","question":"Actively growing turfgrass is about what percent water by mass?","correct":"90 percent","options":["90 percent","25 percent","50 percent","99.9 percent"],"feedback":"Approaches 90%.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q057","module":"M16","question":"Which is NOT a function of water in plants?","correct":"converting red to far-red light","options":["converting red to far-red light","maintaining cell turgidity","transporting nutrients","buffering temperature by transpiration"],"feedback":"Phytochrome conversion is driven by light, not water.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q058","module":"M16","question":"Evaporating water from leaf cells requires about how much heat per gram?","correct":"570 calories","options":["570 calories","1 calorie","80 calories","5700 calories"],"feedback":"Why transpiration cools.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q059","module":"M16","question":"Water vapor exits the plant primarily through:","correct":"stomates","options":["stomates","hydathodes","root hairs","the cuticle"],"feedback":"Stomates; hydathodes exude guttation.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q060","module":"M16","question":"The layer of moist air surrounding a transpiring leaf is the:","correct":"boundary layer","options":["boundary layer","thatch layer","cuticle layer","dew-point layer"],"feedback":"Thickened by humidity and calm; thinned by wind.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q061","module":"M16","question":"The boundary layer is thickest with:","correct":"high humidity and no wind","options":["high humidity and no wind","low humidity and wind","low humidity and no wind","high humidity and wind"],"feedback":"Up to 1 cm with rapid transpiration, high RH, calm.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q062","module":"M16","question":"Tight leaf rolling when water is short is a drought:","correct":"avoidance mechanism","options":["avoidance mechanism","escape mechanism","tolerance mechanism","dormancy mechanism"],"feedback":"It reduces transpirational loss.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q063","module":"M16","question":"Under severe, prolonged moisture deficits, which turfs are most likely to die?","correct":"heavily trafficked turfs","options":["heavily trafficked turfs","turfs in deep shade","turfs low in nitrogen","turfs mowed high"],"feedback":"Others may go dormant.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q064","module":"M16","question":"The large droplets in dew come from:","correct":"guttation","options":["guttation","condensation","irrigation","transpiration"],"feedback":"Small droplets come from condensation.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q065","module":"M16","question":"Guttation water exits through leaf-tip openings called:","correct":"hydathodes","options":["hydathodes","stomates","lenticels","bulliform cells"],"feedback":"Driven by root water pressure.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q066","module":"M16","question":"The small droplets in dew form when:","correct":"radiation cooling drops leaves below the dew point","options":["radiation cooling drops leaves below the dew point","root pressure forces water out of the leaf tips","rain or irrigation falls during the night","stomates release vapor during the midday heat"],"feedback":"Air next to the cooled leaf reaches its dew point.","source":"M16.8: Moisture","kind":"module"},{"id":"m16q067","module":"M16","question":"Wind is defined as:","correct":"air in motion","options":["air in motion","water vapor in motion","a pressure gradient","heated rising air"],"feedback":"Air in motion.","source":"M16.9: Wind","kind":"module"},{"id":"m16q068","module":"M16","question":"Global air circulation is initiated by:","correct":"unequal heating of the earth's surface","options":["unequal heating of the earth's surface","the earth's magnetic field lines","the daily rise and fall of ocean tides","the monthly phases of the moon"],"feedback":"Heated equatorial air rises and flows poleward aloft.","source":"M16.9: Wind","kind":"module"},{"id":"m16q069","module":"M16","question":"In the northern hemisphere, air in a high-pressure system circulates:","correct":"clockwise","options":["clockwise","counterclockwise","straight north","not at all"],"feedback":"Lows are counterclockwise.","source":"M16.9: Wind","kind":"module"},{"id":"m16q070","module":"M16","question":"Low-pressure systems at intermediate latitudes are characterized by:","correct":"frontal weather","options":["frontal weather","clear, calm weather","persistent drought","steady tropical heat"],"feedback":"Converging cold and warm air.","source":"M16.9: Wind","kind":"module"},{"id":"m16q071","module":"M16","question":"Because wind disperses the boundary layer, transpiration rises:","correct":"in proportion to wind velocity","options":["in proportion to wind velocity","in inverse proportion to wind","only at night","only in winter"],"feedback":"Direct proportion.","source":"M16.9: Wind","kind":"module"},{"id":"m16q072","module":"M16","question":"Dense trees and shrubs blocking air movement can create:","correct":"a hot, humid microclimate","options":["a hot, humid microclimate","a cool, dry microclimate","denser, healthier turf","faster drying of leaves"],"feedback":"Poor air circulation favors disease.","source":"M16.9: Wind","kind":"module"},{"id":"m16q073","module":"M16","question":"With severe winds over long periods, exposed turf risks:","correct":"desiccation injury","options":["desiccation injury","light exclusion","crown hydration","guttation damage"],"feedback":"Snow cover protects against winter desiccation.","source":"M16.9: Wind","kind":"module"},{"id":"m16q074","module":"M16","question":"Water that freezes slowly forms:","correct":"black (clear) ice","options":["black (clear) ice","white (cloudy) ice","frost","slush"],"feedback":"Slush and freezing rain form white ice.","source":"M16.9: Wind","kind":"module"},{"id":"m16q075","module":"M16","question":"Which ice is much more damaging to turf?","correct":"white (cloudy) ice","options":["white (cloudy) ice","black (clear) ice","both equally","neither"],"feedback":"Rapid freezing pulls moisture from tissues.","source":"M16.9: Wind","kind":"module"},{"id":"m16q076","module":"M16","question":"Under black ice, damage occurs because:","correct":"crowns hydrate and ice crystals form","options":["crowns hydrate and ice crystals form","rapid freezing desiccates tissues","wind desiccates exposed leaves","heat builds beneath the ice"],"feedback":"White ice damage is desiccation.","source":"M16.9: Wind","kind":"module"},{"id":"m16q077","module":"M16","question":"In the M16.9 winter cover system, the layers from the green upward are:","correct":"permeable plastic, straw, impermeable plastic","options":["permeable plastic, straw, impermeable plastic","impermeable plastic, straw, permeable plastic","straw, permeable plastic, sand","sand, straw, impermeable plastic"],"feedback":"6–12 in of straw between the plastics.","source":"M16.9: Wind","kind":"module"},{"id":"m16q078","module":"M16","question":"The winter cover system protects greens by:","correct":"keeping ice off while allowing gas exchange","options":["keeping ice off while allowing gas exchange","trapping released gases next to the turf","holding snowmelt water on the green surface","insulating the green from all air exchange"],"feedback":"Prevents O₂ depletion and toxic gas buildup.","source":"M16.9: Wind","kind":"module"},{"id":"m16q079","module":"M16","question":"A solid-tine cultivator on an iced green is used to:","correct":"remove ice in successive thin layers","options":["remove ice in successive thin layers","break ice and leave the pieces to melt","inject air beneath the ice sheet","work straw mulch into the ice"],"feedback":"Remove ½-inch layers until the green is exposed.","source":"M16.9: Wind","kind":"module"},{"id":"m16q080","module":"M16","question":"The textbook's three interacting dimensions of the turfgrass environment are atmospheric, biotic, and:","correct":"edaphic","options":["edaphic","hydrologic","geologic","climatic"],"feedback":"Edaphic = soil.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q081","module":"M16","question":"The shade response is reduced by trinexapac-ethyl, implicating the hormone:","correct":"gibberellic acid","options":["gibberellic acid","abscisic acid","ethylene","salicylic acid"],"feedback":"TE inhibits gibberellin synthesis.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q082","module":"M16","question":"For shaded turf, the textbook recommends nitrogen fertilization be:","correct":"reduced from full-sun rates","options":["reduced from full-sun rates","doubled over full-sun rates","the same as full sun","stopped entirely"],"feedback":"Also raise mowing height, irrigate deeply and infrequently.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q083","module":"M16","question":"Irrigation of turf under trees should be:","correct":"infrequent and deep","options":["infrequent and deep","light and frequent","eliminated","applied at midday"],"feedback":"Encourages deep rooting and meets tree needs.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q084","module":"M16","question":"Spectrum-adjusted HPS grow lamps on shaded greens add more:","correct":"blue light","options":["blue light","far-red light","ultraviolet light","infrared heat"],"feedback":"Continuous 24-hour lighting can be harmful.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q085","module":"M16","question":"When water evaporates, heat is converted from:","correct":"sensible to latent","options":["sensible to latent","latent to sensible","radiant to conductive","infrared to visible"],"feedback":"Condensation reverses it.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q086","module":"M16","question":"Air passing over a warm surface carrying heat downwind is:","correct":"advection","options":["advection","convection","conduction","radiation"],"feedback":"Strips near pavement suffer advective heating.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q087","module":"M16","question":"The textbook ranks energy transfer processes from most to least important as:","correct":"radiation, convection, transpiration, wind","options":["radiation, convection, transpiration, wind","wind, transpiration, convection, radiation","conduction, radiation, wind, convection","transpiration, radiation, conduction, wind"],"feedback":"Managers can influence transpiration and wind.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q088","module":"M16","question":"Cold acclimation is associated with an increase in:","correct":"soluble sugars","options":["soluble sugars","tissue water content","gibberellic acid","saturated membrane lipids"],"feedback":"Sugars restrict ice growth and raise osmotic pressure.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q089","module":"M16","question":"Which factor undermines cold acclimation?","correct":"excessive nitrogen fertilization","options":["excessive nitrogen fertilization","adequate potassium fertilization","good surface drainage","moderate mowing heights"],"feedback":"Potassium helps acclimation.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q090","module":"M16","question":"Growth response to day/night temperature cycles is called:","correct":"thermoperiodism","options":["thermoperiodism","photoperiodism","thermotolerance","vernalization"],"feedback":"Photosynthesis by day, growth best at cooler nights.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q091","module":"M16","question":"Annual bluegrass producing heavy seed under drought illustrates drought:","correct":"escape","options":["escape","avoidance","tolerance","dormancy"],"feedback":"Turgor maintenance = tolerance; deeper roots = avoidance.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q092","module":"M16","question":"Maintaining turgor at low water potentials is a drought:","correct":"tolerance mechanism","options":["tolerance mechanism","escape mechanism","avoidance mechanism","dormancy mechanism"],"feedback":"Tolerance.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q093","module":"M16","question":"Browning of leaves under sustained drought is called:","correct":"leaf firing","options":["leaf firing","light exclusion","crown hydration","etiolation"],"feedback":"Leaf firing.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q094","module":"M16","question":"The hormone that closes stomata and promotes root growth under drought is:","correct":"abscisic acid","options":["abscisic acid","gibberellic acid","auxin","cytokinin"],"feedback":"ABA.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q095","module":"M16","question":"Moisture escaping through cut leaf tips after mowing is called:","correct":"exudation","options":["exudation","guttation","condensation","transpiration"],"feedback":"Guttation is through intact hydathodes.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q096","module":"M16","question":"A benefit of dew is that it:","correct":"delays early-morning transpiration","options":["delays early-morning transpiration","reduces disease pressure on greens","raises leaf temperatures at dawn","speeds up photorespiration"],"feedback":"Conserves soil moisture.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q097","module":"M16","question":"Under continuous ice cover, annual bluegrass typically dies after about:","correct":"75 days","options":["75 days","15 days","45 days","120 days"],"feedback":"Creeping bentgrass can survive at least 120 days.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q098","module":"M16","question":"Ice-related damage is often more severe in:","correct":"shaded areas","options":["shaded areas","full-sun areas","well-drained sand greens","wind-exposed tees"],"feedback":"Shade slows melting.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q099","module":"M16","question":"Traditionally, heat tolerance in turfgrass has been linked to:","correct":"heat shock proteins","options":["heat shock proteins","antifreeze proteins","phytochrome","chlorophyll b"],"feedback":"Induced by heat acclimation.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q100","module":"M16","question":"Antifreeze proteins work by:","correct":"binding ice crystals to slow their growth","options":["binding ice crystals to slow their growth","melting ice that has already formed inside cells","increasing the hydration of crown tissues","breaking down membrane lipids"],"feedback":"Bind ice crystal surfaces.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q101","module":"M16","question":"In the United States, air masses generally move from:","correct":"west to east","options":["west to east","east to west","north to south","south to north"],"feedback":"Canadian highs bring dry, cold air.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q102","module":"M16","question":"Strong, dry, warm winds descending the lee side of the Rockies are:","correct":"chinook winds","options":["chinook winds","Santa Ana winds","sea breezes","land breezes"],"feedback":"Santa Ana is a drainage wind.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q103","module":"M16","question":"Dense trees and shrubs blocking air movement raise the incidence of:","correct":"brown patch, Pythium, and Helminthosporium","options":["brown patch, Pythium, and Helminthosporium","snow molds and other winter diseases","powdery mildew and the rust diseases","fairy ring and other soilborne fungi"],"feedback":"Hot, humid, stagnant microclimates.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"},{"id":"m16q104","module":"M16","question":"In a soil profile, the A horizon is the:","correct":"topsoil","options":["topsoil","subsoil","parent material","bedrock"],"feedback":"B = subsoil with leachates; C = weathered parent material.","source":"Textbook Ch. 4, pp. 93-111: The Turfgrass Environment","kind":"enrichment"}];const KEY='turf235_exam2_m16_v2';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M16 cleared</h2><p>You retired all 104 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M16 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
