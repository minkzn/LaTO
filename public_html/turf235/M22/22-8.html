const BANK=[{"id":"m22q081","module":"M22","question":"Vertical mowing uses vertically oriented knives on a:","correct":"rapidly rotating horizontal shaft","options":["rapidly rotating horizontal shaft","slowly rotating vertical shaft","fixed bar pulled behind a tractor","vibrating plow beneath the turf"],"feedback":"Depth of knife penetration determines the objective.","source":"M22.8: Vertical Mowing Controls","kind":"module"},{"id":"m22q082","module":"M22","question":"When vertical mowing knives are set to just nick the turf, they:","correct":"sever stolons and leaves to reduce grain","options":["sever stolons and leaves to reduce grain","remove much of the accumulated thatch","cultivate the soil to relieve compaction","prepare a deep seedbed for overseeding"],"feedback":"Shallow setting reduces grain on greens.","source":"M22.8: Vertical Mowing Controls","kind":"module"},{"id":"m22q083","module":"M22","question":"Vertical mowing set to penetrate into the thatch layer serves to:","correct":"remove much of the accumulated thatch","options":["remove much of the accumulated thatch","sever stolons and reduce grain on greens","cultivate soil to relieve compaction","inject sand for bypass drainage"],"feedback":"Medium depth removes thatch.","source":"M22.8: Vertical Mowing Controls","kind":"module"},{"id":"m22q084","module":"M22","question":"Setting vertical mowing knives to penetrate deepest, into the soil, serves to:","correct":"alleviate surface compaction","options":["alleviate surface compaction","reduce grain on greens","remove decumbent leaves","break up dry soil cores"],"feedback":"Deep penetration cultivates the underlying soil.","source":"M22.8: Vertical Mowing Controls","kind":"module"},{"id":"m22q085","module":"M22","question":"From shallowest to deepest knife setting, vertical mowing targets:","correct":"grain, thatch, then compaction","options":["grain, thatch, then compaction","thatch, grain, then compaction","compaction, thatch, then grain","grain, compaction, then thatch"],"feedback":"Nick = grain; deeper = thatch; deepest = soil compaction.","source":"M22.8: Vertical Mowing Controls","kind":"module"},{"id":"m22q086","module":"M22","question":"Deep vertical mowing is sometimes done to:","correct":"prepare a turf for overseeding","options":["prepare a turf for overseeding","reduce grain on putting greens","reincorporate dry soil cores","sever stolons for sprigging"],"feedback":"Deep grooves form a seedbed.","source":"M22.8: Vertical Mowing Controls","kind":"module"},{"id":"m22q087","module":"M22","question":"After hollow-tine cultivation, ___ vertical mowing can break up soil cores for reincorporation.","correct":"shallow","options":["shallow","deep","medium","no"],"feedback":"Shallow vertical mowing breaks up the cores.","source":"M22.8: Vertical Mowing Controls","kind":"module"},{"id":"m22q088","module":"M22","question":"Thorough reincorporation of soil from core cultivation modifies the thatch to have:","correct":"improved moisture and nutrient retention","options":["improved moisture and nutrient retention","reduced moisture retention and reduced nutrient retention","greater porosity and faster drainage","lower bulk density and less firmness"],"feedback":"It also facilitates upward capillary movement of water into the thatch-like derivative.","source":"M22.8: Vertical Mowing Controls","kind":"module"},{"id":"m22q089","module":"M22","question":"Soil reincorporation also facilitates ___ movement of water into the thatch-like derivative.","correct":"upward capillary","options":["upward capillary","downward gravitational","lateral surface","vapor-phase"],"feedback":"Water moves up from the soil into the modified thatch.","source":"M22.8: Vertical Mowing Controls","kind":"module"}];const KEY='turf235_final_m22_22_8_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M22.8 cleared</h2><p>You retired all 9 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M22.8 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
