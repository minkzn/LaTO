const BANK=[{"id":"m22q010","module":"M22","question":"Hollow-tine (core) cultivation uses hollow tines to:","correct":"extract cores from the turf","options":["extract cores from the turf","inject sand into the turf","sever stolons near the surface","slice grooves for seeding"],"feedback":"Cores are extracted and deposited on the surface.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q011","module":"M22","question":"Core size in hollow-tine cultivation ranges from:","correct":"0.25 to 1.0 inch in diameter","options":["0.25 to 1.0 inch in diameter","1.0 to 2.0 inches in diameter","0.1 to 0.25 inch in diameter","0.5 to 1.5 inches in diameter"],"feedback":"Depending on the size of the tine.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q012","module":"M22","question":"The vertical length of cores varies with:","correct":"soil strength and the coring unit's penetration","options":["soil strength and the coring unit's penetration","the tine diameter and the spacing between the tines","the grass species and its rooting depth","thatch depth and the mowing height"],"feedback":"Soil strength and penetration capacity of the coring apparatus.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q013","module":"M22","question":"The term \"aerification\" is misleading because:","correct":"soil between and below holes may not be aerated","options":["soil between and below holes may not be aerated","the coring hole itself is not actually aerated at all","cores are always returned to the holes","it only applies to solid-tine cultivation"],"feedback":"Only the hole is clearly aerated; tines can add compaction at the sides and base.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q014","module":"M22","question":"In hollow-tine cultivation, additional compaction results from:","correct":"tines moving along the sides and base of the hole","options":["tines moving along the sides and base of the hole","cores dropped back on top of the turf","the weight of the operator walking on the turf surface","water pooling in the open coring holes"],"feedback":"Tine movement compacts soil at the walls and bottom of the hole.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q015","module":"M22","question":"For greens and other intensively cultured turfs, cultivators that are ___ are used to minimize surface disruption.","correct":"slow-moving and vertical-motion","options":["slow-moving and vertical-motion","fast-moving and rotary-motion","slow-moving and rotary-motion","fast-moving and vertical-motion"],"feedback":"Slow-moving, vertical-motion units.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q016","module":"M22","question":"Coring units penetrate to the maximum tine length and extract the most soil on sites that are:","correct":"moist but not wet, with moderate soil strength","options":["moist but not wet, with moderate soil strength","saturated, with very low soil strength","dry, with the high soil strength of late summer drought","frozen near the surface, with high strength"],"feedback":"Moist, not wet, and moderate strength.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q017","module":"M22","question":"A mass of roots inside a soil core indicates:","correct":"root growth stimulated by earlier HTC","options":["root growth stimulated by earlier HTC","a core taken too deeply into subsoil","an older cultivar with deep rooting","damage from insects in the holes"],"feedback":"Cores may show evidence of previous cultivations.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q018","module":"M22","question":"Soil cores are sometimes removed from the site to:","correct":"leave holes open or allow different topdressing","options":["leave holes open or allow different topdressing","reduce the weight on the drainage pipes","prevent disease from spreading in the soil","supply soil from the site for sampling and lab testing"],"feedback":"Removal allows a different soil or sand to be topdressed.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q019","module":"M22","question":"Instead of removal, soil cores can be reincorporated by:","correct":"vertical mowing or matting","options":["vertical mowing or matting","rolling or spiking","slicing or syringing","irrigation or topdressing"],"feedback":"Break them up with a vertical mower or drag a mat.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q020","module":"M22","question":"Soil cores range in surface displacement, depending on tine size and spacing, from:","correct":"0.1 to 11 percent","options":["0.1 to 11 percent","1 to 25 percent","5 to 50 percent","0.01 to 1 percent"],"feedback":"Table 22.3.1 ranges from 0.1% (0.25 in, 6x8) to 11% (0.75 in, 2x2).","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q021","module":"M22","question":"Per Table 22.3.1, 0.75-inch tines on a 2 x 2 inch spacing displace about:","correct":"11.0% of the surface","options":["11.0% of the surface","4.9% of the surface","2.8% of the surface","20% of the surface"],"feedback":"π(0.375)² / 4 = 0.4418 / 4 ≈ 11%.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q022","module":"M22","question":"Per Table 22.3.1, which combination displaces the LEAST soil?","correct":"0.25-inch tines at 6 x 8 inches","options":["0.25-inch tines at 6 x 8 inches","0.75-inch tines at 6 x 8 inches","0.25-inch tines at 2 x 2 inches","0.5-inch tines at 4 x 6 inches"],"feedback":"Smallest tine at the widest spacing: 0.1%.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q023","module":"M22","question":"Percent displacement from coring is calculated as:","correct":"tine hole area ÷ area per tine spacing","options":["tine hole area ÷ area per tine spacing","tine diameter ÷ spacing between tines","tine hole area × number of passes","core depth ÷ the spacing between tines"],"feedback":"Area of one hole (πr²) divided by the area each tine occupies (spacing x spacing).","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q024","module":"M22","question":"A 1-inch-diameter tine affects a surface area of:","correct":"0.7854 in²","options":["0.7854 in²","3.1416 in²","1.0000 in²","0.5000 in²"],"feedback":"r = 0.5; πr² = 3.1416 x 0.25 = 0.7854 in².","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q025","module":"M22","question":"1-inch tines on a 2 x 2 inch spacing give a displacement of about:","correct":"20%","options":["20%","8%","50%","79%"],"feedback":"0.7854 ÷ 4 = 0.196, about 20%.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q026","module":"M22","question":"Soil replacement in the top 3 inches from 3-inch-deep HTC with 1-inch tines on a 3 x 4 inch spacing is about:","correct":"6.5%","options":["6.5%","8.3%","2.2%","26%"],"feedback":"0.7854 ÷ 12 = 6.5%.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q027","module":"M22","question":"Soil replacement from 3-inch-deep HTC with 1-inch tines on a 6 x 6 inch spacing is about:","correct":"2.2%","options":["2.2%","6.5%","0.8%","16.7%"],"feedback":"0.7854 ÷ 36 = 2.2%.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q028","module":"M22","question":"Soil replacement from 3-inch-deep HTC with ¾-inch tines on a 2 x 4 inch spacing is about:","correct":"5.5%","options":["5.5%","9.4%","2.8%","11.0%"],"feedback":"π(0.375)² = 0.4418; ÷ 8 = 5.5%.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q029","module":"M22","question":"Soil replacement from 3-inch-deep HTC with 1¼-inch tines on a 4 x 4 inch spacing is about:","correct":"7.7%","options":["7.7%","4.9%","31%","12.3%"],"feedback":"π(0.625)² = 1.2272; ÷ 16 = 7.7%.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q030","module":"M22","question":"Soil replacement from 3-inch-deep HTC with ½-inch tines on a 2 x 3 inch spacing is about:","correct":"3.3%","options":["3.3%","8.3%","1.6%","6.5%"],"feedback":"π(0.25)² = 0.1963; ÷ 6 = 3.3%.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q031","module":"M22","question":"Soil replacement from 3-inch-deep HTC with 1-inch tines on a 3 x 3 inch spacing is about:","correct":"8.7%","options":["8.7%","11.1%","6.5%","2.2%"],"feedback":"0.7854 ÷ 9 = 8.7%.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q032","module":"M22","question":"Where a sand topdressing program has begun on a loamy soil, cores containing both sand and soil should:","correct":"not be reincorporated","options":["not be reincorporated","always be reincorporated","be reincorporated only by matting","be reincorporated only in spring"],"feedback":"Mixing them back in creates distinct textural layers.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q033","module":"M22","question":"Reincorporating cores that contain both topdressing sand and native soil leads to:","correct":"distinct textural layers that obstruct water","options":["distinct textural layers that obstruct water","a uniform blend of sand and soil","faster thatch decomposition with no drawback","a firmer surface with better drainage"],"feedback":"Sand and soil cannot be thoroughly mixed; layers form and water movement is obstructed.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q034","module":"M22","question":"Once a sand topdressing layer is thick enough that coring brings up only sand, the cores:","correct":"might be reincorporated, though removing them may still be wise","options":["might be reincorporated, though removing them may still be wise","must always be removed and discarded","must be mixed with native soil first","can never be reincorporated into the turf under any circumstances"],"feedback":"\"Dirty\" sand cores may still be removed and replaced with \"clean\" sand to ensure water movement.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q035","module":"M22","question":"Cores from a new sand-based root zone can generally be:","correct":"reincorporated with little issue","options":["reincorporated with little issue","removed to avoid layering","reincorporated only with soil","discarded before topdressing"],"feedback":"Same material in, same material back.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q036","module":"M22","question":"Drill-and-fill drills typically penetrate to a depth of about:","correct":"12 inches","options":["12 inches","3 inches","6 inches","24 inches"],"feedback":"Sand fingers about 12 inches deep influence initial infiltration.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q037","module":"M22","question":"Drill-and-fill is most beneficial when the filled holes reach:","correct":"a more permeable layer below a tight surface","options":["a more permeable layer below a tight surface","the depth of the thatch layer only","the irrigation pipes buried beneath the putting green","the same soil texture as the surface"],"feedback":"The sand channels provide bypass drainage through an impermeable surface layer.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q038","module":"M22","question":"In a USGA green with too many fines in the root zone, drill-and-fill with suitable sand creates bypass channels down to the:","correct":"gravel or choker layer","options":["gravel or choker layer","thatch layer","sand blanket","surface mat"],"feedback":"Water moves around the root-zone matrix into the gravel layer and out through drain pipes.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q039","module":"M22","question":"A common cause of a USGA green root zone that drains poorly is:","correct":"too many \"fines\" in the root-zone mix","options":["too many \"fines\" in the root-zone mix","too much coarse gravel in the mix","too little organic matter in the mix","a choker layer that is too thick"],"feedback":"Excess fines reduce drainage.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q040","module":"M22","question":"Soil reincorporated into thick thatch fills the large pores, producing a:","correct":"thatchlike derivative","options":["thatchlike derivative","mat layer of pure sand","buried thatch layer","hydrophobic crust"],"feedback":"The physical and chemical properties of the thatch are substantially altered.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q041","module":"M22","question":"Compared with the original thatch, a thatchlike derivative is:","correct":"firmer, holding more nutrients and moisture","options":["firmer, holding more nutrients and moisture","softer, holding fewer nutrients and moisture","firmer, holding fewer nutrients and moisture","softer, holding more nutrients and moisture"],"feedback":"Firmer medium with greater nutrient and moisture retention.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q042","module":"M22","question":"Over the long term, soil incorporation into thatch is believed to:","correct":"accelerate biodecomposition of the organic matter","options":["accelerate biodecomposition of the organic matter","slow the natural decomposition of the organic matter","prevent any further thatch accumulation","make the thatch layer hydrophobic"],"feedback":"Soil speeds natural breakdown of the organic constituents.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q043","module":"M22","question":"Matting reincorporates cores by dragging ___ across the turf.","correct":"chain-link fence or heavy steel mats","options":["chain-link fence or heavy steel mats","a vertical mower with shallow knives","a weighted roller filled with water","a rotary mower set at a low height"],"feedback":"Hence the name matting.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q044","module":"M22","question":"Before matting, extracted cores should be allowed to dry until they:","correct":"can be easily broken with the fingers","options":["can be easily broken with the fingers","are completely dry and brick-like","have been rained on at least once","turn white on the outer surface"],"feedback":"Ideal moisture for coring is higher than for matting.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q045","module":"M22","question":"Cores allowed to dry too much before matting become:","correct":"brick-like and difficult to crush","options":["brick-like and difficult to crush","muddy and smear across the turf","powdery and blow off the turf","hydrophobic and repel irrigation"],"feedback":"Timing matters: crumbly, not rock-hard.","source":"M22.3: Core Cultivation","kind":"module"},{"id":"m22q046","module":"M22","question":"Compared with matting, the ideal soil moisture for core cultivation is:","correct":"higher, for maximum penetration","options":["higher, for maximum penetration","lower, so the cores dry faster","the same, so both are done together","lower, to reduce soil compaction"],"feedback":"Coring goes best in moist soil; matting after cores dry somewhat.","source":"M22.3: Core Cultivation","kind":"module"}];const KEY='turf235_final_m22_22_3_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M22.3 cleared</h2><p>You retired all 37 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M22.3 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
