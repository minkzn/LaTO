</style><style>.subs{max-width:1050px;margin:12px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.subs a{text-decoration:none;color:#173f24;background:#fff;border:1px solid #c9d4ca;border-radius:999px;padding:6px 11px;font-weight:750;font-size:14px}.subs a span{color:#657167;font-weight:600}.subs a.on{background:#0d5722;color:#fff;border-color:#0d5722}.subs a.on span{color:#dce9df}</style></head><body><header><h1>M22.6 • 12 Questions</h1><p>M22.6: Solid Tine Cultivation. TURF 235 final exam practice. Ten at a time. Correct questions retire; misses cycle back until you clear the module.</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="toolbar"><div class="row"><button class="primary" id="restart">Restart M22.6</button><button id="clear">Clear Saved Progress</button><a href="../index.html"><button>All Modules</button></a></div></div><nav class="subs"><a href="index.html">All M22 <span>205</span></a><a href="22-2.html">M22.2 <span>9</span></a><a href="22-3.html">M22.3 <span>37</span></a><a href="22-4.html">M22.4 <span>3</span></a><a href="22-5.html">M22.5 <span>10</span></a><a href="22-6.html" class="on">M22.6 <span>12</span></a><a href="22-7.html">M22.7 <span>9</span></a><a href="22-8.html">M22.8 <span>9</span></a><a href="22-9.html">M22.9 <span>8</span></a><a href="22-textbook.html">Textbook <span>108</span></a></nav><main><div class="stats"><div class="stat" id="remaining">Remaining: 12</div><div class="stat" id="mastered">Mastered: 0</div><div class="stat" id="misses">Misses: 0</div><div class="stat" id="batch">Batch: —</div></div><div id="quiz"></div><div class="actions"><button class="primary" id="submit">Submit 10</button><button class="primary" id="next" disabled>Next 10 →</button></div></main><script>
const BANK=[{"id":"m22q060","module":"M22","question":"Solid-tine cultivation (STC) differs from HTC in that STC:","correct":"does not remove soil cores","options":["does not remove soil cores","removes larger soil cores","injects water into the holes","uses V-shaped knives on disks"],"feedback":"No cores, so potentially more compaction at the sides and bases of holes.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q061","module":"M22","question":"Because no cores are removed, STC has the potential for:","correct":"more compaction along the sides and bases of holes","options":["more compaction along the sides and bases of holes","less compaction than any other method of cultivation used","more soil on the surface than hollow tines","more thatch removal than vertical mowing"],"feedback":"Soil is pushed aside rather than extracted.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q062","module":"M22","question":"Field trials suggest STC may directly increase aeration by uplifting and fracturing the soil, most likely when soil moisture is:","correct":"relatively low","options":["relatively low","relatively high","at saturation","near field capacity"],"feedback":"In wet soils the tines compact soil around the holes instead.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q063","module":"M22","question":"In wet soils, solid tines tend to:","correct":"compact the soil near the holes","options":["compact the soil near the holes","fracture and uplift the soil","extract cores from the soil","improve aeration below the holes"],"feedback":"Wet soil compacts rather than fractures.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q064","module":"M22","question":"Slicing penetrates the turf to a depth of:","correct":"3 to 4 inches","options":["3 to 4 inches","about 1 inch","6 to 8 inches","up to 16 inches"],"feedback":"V-shaped knives mounted on disks.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q065","module":"M22","question":"Slicing uses:","correct":"V-shaped knives mounted on disks","options":["V-shaped knives mounted on disks","hollow tines on a vertical crank","free-swinging knives on a shaft","pulses of high-pressure water"],"feedback":"Knives on disks slice into the turf.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q066","module":"M22","question":"Slicing is typically practiced on fairways and heavily trafficked turf during:","correct":"midsummer stress periods","options":["midsummer stress periods","early spring green-up","late fall before dormancy","winter, while the turf is dormant"],"feedback":"When HTC or STC might be too injurious or disruptive.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q067","module":"M22","question":"Slicing is used in midsummer instead of HTC or STC because those methods:","correct":"might be too injurious or disruptive","options":["might be too injurious or disruptive","cannot penetrate dry summer soils","require the turf to be dormant","only work on sand-based greens"],"feedback":"Slicing is less disruptive.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q068","module":"M22","question":"Spiking penetrates the turf to approximately:","correct":"1 inch","options":["1 inch","3 to 4 inches","6 inches","12 inches"],"feedback":"Spiking is shallower than slicing, with shorter surface perforations.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q069","module":"M22","question":"Spiking is primarily practiced on:","correct":"greens","options":["greens","fairways","roughs","sod farms"],"feedback":"It causes only minor disruption.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q070","module":"M22","question":"Because spiking causes only minor disruption, it can be practiced:","correct":"as often as weekly in the growing season","options":["as often as weekly in the growing season","only once a year in early spring","only during midsummer stress periods","only when the turf is dormant"],"feedback":"To mitigate the soil-compacting effects of traffic.","source":"M22.6: Solid Tine Cultivation","kind":"module"},{"id":"m22q071","module":"M22","question":"Compared with slicing, spiking has:","correct":"shallower penetration and shorter perforations","options":["shallower penetration and shorter perforations","deeper penetration and longer perforations","shallower penetration but longer surface perforations","deeper penetration and shorter perforations"],"feedback":"About 1 inch deep with shorter surface perforations.","source":"M22.6: Solid Tine Cultivation","kind":"module"}];const KEY='turf235_final_m22_22_6_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='enrichment'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M22.6 cleared</h2><p>You retired all 12 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M22.6 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
